나씩 공중으로 날아올랐다. 1, 2, 3, 4, 5, 6. 열쇠들은 이안의 손에 쥔 0을 향해 날아와 그 주위를 빙글빙글 돌았다."], ["p", "멀리서 거대한 문이 움직이는 소리가 들렸다."], ["p", "땅이 흔들렸다. 지하 도시의 기둥들이 신음 소리를 냈다. 조각상들이, 수천 개의 같은 얼굴들이 일제히 원형 공간 쪽으로 고개를 돌렸다. 이안이 환상 속에서 본 바로 그 장면이었다. 그들이 기다리던 것은 바로 이 순간이었다."], ["p", "에드먼드가 소리쳤다."], ["p", "\"안 돼! 아직 문을 열면 안 된다! 너는 아직 무엇을 쓸지 정하지 않았어!\""], ["p", "이안은 열쇠를 놓으려 했다. 하지만 손이 펴지지 않았다. 열쇠가 손바닥에 붙어 버린 것 같았다."], ["p", "하지만 이미 늦었다."], ["p", "일곱 개의 열쇠가 하나로 모이고 있었다."], ["p", "여섯 개의 열쇠가 이안의 손 위에서 0을 둘러싸며 녹아들었다. 은빛, 하얀빛, 투명한 빛이 하나로 섞였다. 그리고 하나의 둥근 고리가 되었다."], ["p", "책의 표지에 새겨진 것과 같은 원."], ["p", "유나가 이안의 다른 손을 꽉 잡았다."], ["p", "\"놓지 마.\""], ["p", "\"안 놓아.\""], ["p", "빛이 폭발했다."], ["n", "제20장"], ["t", "세계가 만들어진 날"], ["p", "장치가 작동하자 세상의 모든 빛이 한곳으로 모였다."], ["p", "원형 공간의 천장에 떠 있던 수많은 빛, 수많은 세계들이 한꺼번에 장치를 향해 쏟아져 내렸다. 별이 비처럼 떨어지는 것 같았다. 이안의 손에 쥔 원이 그 모든 빛을 빨아들였다."], ["p", "너무 밝았다."], ["p", "이안과 유나는 눈을 감았다."], ["p", "눈꺼풀 너머로도 빛이 느껴졌다. 몸이 가벼워졌다. 북쪽 산맥에서 안개에 휩싸였을 때와 비슷했다. 다만 이번에는 위아래만이 아니라, 앞과 뒤, 어제와 내일까지 모두 뒤섞이는 것 같았다."], ["p", "유나의 손만이 분명했다."], ["p", "다시 눈을 떴을 때, 그들은 낯선 장소에 서 있었다."], ["p", "하늘은 검은색도 파란색도 아니었다."], ["p", "마치 색이라는 개념이 존재하지 않는 것처럼 보였다. 밝지도 어둡지도 않았다. 그냥 '하늘'이라는 말만 있고, 그 말에 아직 아무 색도 칠해지지 않은 것 같았다."], ["p", "땅은 끝없이 펼쳐져 있었다."], ["p", "평평하고 매끄러웠다. 흙도 돌도 아닌, 아직 무엇이 될지 정해지지 않은 땅이었다. 발밑을 내려다보면 땅이 아주 조금씩 일렁였다. 이안이 '풀'이라고 생각하자 발치에 풀 몇 포기가 돋아났다가, 생각을 멈추자 다시 사라졌다."], ["p", "그곳에는 산도 바다도 없었다."], ["p", "대신 수많은 문이 서 있었다."], ["p", "문틀만 있는 문들이었다. 벽도 없이 허허벌판에 문틀 하나씩이 서 있었다. 나무 문, 돌문, 쇠문, 유리문. 크기도 모양도 제각각인 문들이 끝도 없이 늘어서 있었다."], ["p", "문마다 다른 풍경이 비치고 있었다."], ["p", "문틀 안쪽으로 다른 세계가 보였다. 문 뒤로 돌아가 보면 그냥 텅 빈 땅인데, 앞에서 보면 문 안에 하나의 세상이 펼쳐져 있었다."], ["p", "이안은 그중 하나를 바라보았다."], ["p", "그 안에는 자신이 살던 도시가 있었다. 비 그친 저녁의 골목, 가로등, 중앙도서관의 사자상. 아파트 단지 사이의 놀이터. 이안의 집 창문에 불이 켜져 있었다."], ["p", "엄마가 퇴근해 있었다."], ["p", "이안은 그 창문에서 눈을 떼기 어려웠다."], ["p", "다른 문에는 북쪽 산맥이 있었다. 숫자가 새겨진 바위들과 검은 돌."], ["p", "또 다른 문에는 잠든 바다가 있었다. 그런데 그 바다에 처음으로 잔물결이 일고 있었다."], ["p", "멈춘 마을의 문도 있었다. 광장에서 아이들이 공을 차고 있었다. 리아가 그 사이에서 웃고 있었다. 시계탑에는 바늘 대신 하얀 꽃 한 송이가 꽂혀 있었다."], ["p", "\"리아다.\""], ["p", "유나가 속삭였다. 그리고 머리의 꽃을 만졌다. 꽃잎 가장자리가 더 노래져 있었다."], ["p", "유나는 문들을 바라보며 말했다."], ["p", "\"여기가 세 번째 세계야?\""], ["p", "뒤에서 발소리가 들렸다. 에드먼드였다. 그도 빛에 휩쓸려 함께 온 것이다. 그의 외투 자락이 조금 희미해 보였다."], ["p", "에드먼드는 천천히 고개를 끄덕였다."], ["p", "\"그렇다. 모든 세계가 시작되기 전의 장소.\""], ["p", "\"아직 만들어지지 않은 세계.\""], ["p", "이안이 중얼거렸다. 관리인의 돌판, 비어 있던 세 번째 원."], ["p", "\"아니. 정확히는, 모든 세계가 만들어지는 곳이다. 저 문 하나하나가 하나의 세계로 이어지지. 그리고 이 땅은 아직 아무것도 되지 않은 가능성이다. 누군가 무언가를 선택할 때마다, 이 땅의 한 조각이 새로운 문이 된다.\""], ["p", "189년 전, 에드먼드는 이곳까지 오지 못했다. 여섯 개의 열쇠로는 문 바로 앞에서 멈출 수밖에 없었다."], ["p", "\"내가 평생 보고 싶었던 곳이야.\""], ["p", "에드먼드가 말했다. 그런데 그의 목소리는 기쁘기보다 조금 두려워 보였다."], ["p", "그때 저 멀리에서 거대한 형체가 나타났다."], ["p", "문들 사이로, 아주 높고 길쭉한 그림자가 걸어오고 있었다. 걸음마다 땅이 조용히 일렁였다. 문들이 그 존재를 위해 길을 비켜 주었다."], ["p", "그것은 사람처럼 보였지만 얼굴이 없었다."], ["p", "하얀 옷을 길게 늘어뜨린 형체였다. 키는 건물만 했다. 팔과 다리, 몸통이 있었고, 머리도 있었다. 하지만 얼굴이 있어야 할 자리는 매끄럽게 비어 있었다. 사진 속 세 번째 탐험가처럼. 벽화 속 펜을 든 사람처럼. 지하 도시의 수천 개 조각상이 닮았던, 아무도 아닌 얼굴."], ["p", "얼굴 없는 존재는 세 사람 앞에서 멈췄다."], ["p", "입이 없는데도 목소리가 들렸다. 귀가 아니라 머릿속에서 울리는 목소리였다. 무척 오래되고, 무척 피곤한 목소리."], ["p", "그 존재는 말했다."], ["p", "\"너희는 너무 일찍 도착했다.\""], ["n", "제21장"], ["t", "마지막 진실"], ["p", "얼굴 없는 존재는 자신을 세계의 기록자라고 소개했다."], ["p", "그는 아주 오래전부터 모든 세계의 역사를 기록해 왔다고 말했다."], ["p", "세계가 처음 생겨났을 때부터, 그는 그 곁에 있었다. 산이 솟고 바다가 생기는 것을 적었다. 처음 불을 피운 사람, 처음 노래를 부른 사람, 처음 지도를 그린 사람을 적었다. 사라진 문명의 사람들은 그를 본떠 장치를 만들었고, 그를 본떠 자기 얼굴을 지웠다."], ["p", "\"기록자는 기록 속에 있으면 안 된다. 그래서 나는 얼굴이 없다.\""], ["p", "기록자가 말했다."], ["p", "\"그런데 너는 사진 속에 있었잖아요.\""], ["p", "유나가 휴대전화를 꺼내 들었다. 화면은 꺼져 있었지만, 유나는 그 사진을 기억하고 있었다."], ["p", "\"에드먼드 아저씨 옆에. 1837년에.\""], ["p", "기록자는 잠시 침묵했다."], ["p", "\"그렇다. 단 한 번, 나는 기록 밖으로 나갔다. 사람의 모습을 하고 저 탐험가와 함께 걸었지. 처음으로 무언가를 적지 않고 그저 바라보고 싶었다. 그러다 실수를 깨닫고 내 얼굴을 지웠다. 사진에서도, 기록관의 장부에서도.\""], ["p", "에드먼드가 낮게 웃었다."], ["p", "\"그 말 없는 동행. 이름을 물어도 대답하지 않던. 결국 너였군.\""], ["p", "하지만 어느 날 기록에 오류가 생겼다."], ["p", "기록자는 설명했다. 사라진 문명이 장치를 만든 뒤로, 기록은 점점 빨라졌다. 일어난 일을 적는 것이 아니라, 일어날 일을 먼저 적기 시작했다."], ["p", "아직 태어나지 않은 사람들이 기록되기 시작했고, 존재하지 않는 장소들이 지도에 나타났다."], ["p", "사막의 비석들. 유나의 이름."], ["p", "그리고 결국 세상은 세 개로 나뉘었다."], ["p", "\"왜 이런 일이 일어났죠?\""], ["p", "유나가 물었다."], ["p", "기록자는 대답했다."], ["p", "\"세계가 자신을 이해하려고 했기 때문이다.\""], ["p", "그는 긴 팔을 들어 세 방향을 가리켰다."], ["p", "\"모든 것을 기록하면, 모든 것을 이해할 수 있다고 믿었지. 그래서 앞으로 일어날 일까지 적었다. 미래를 알면 두렵지 않을 테니까. 그런데 미래가 적히자, 세계는 그 미래 말고는 아무것도 될 수 없게 되었다. 그걸 견디지 못한 부분들이 떨어져 나갔다.\""], ["p", "그는 세 개의 세계를 가리켰다."], ["p", "첫 번째 세계는 실제로 존재하는 세계."], ["p", "두 번째 세계는 사라졌다고 믿어진 세계. 기록에서 지워져 잠든 곳들. 멈춘 마을, 잠든 바다, 뒤집힌 도시."], ["p", "세 번째 세계는 아직 선택되지 않은 가능성의 세계. 지금 그들이 서 있는 이곳."], ["p", "\"그럼 누가 세상을 만들었나요?\""], ["p", "이안이 물었다. 장치에 새겨진 문장이 떠올랐다. '마지막 열쇠는 세계를 만든 자의 것이다.'"], ["p", "기록자는 잠시 침묵했다."], ["p", "그리고 말했다."], ["p", "\"아무도 만들지 않았다.\""], ["p", "\"그럼 어떻게 존재하는 거죠?\""], ["p", "\"세상은 누군가가 발견하기 전부터 존재했지만, 누군가가 기록하기 전까지는 자신이 어떤 모습인지 알지 못했다.\""], ["p", "이안은 이해할 수 없었다."], ["p", "기록자는 얼굴 없는 머리를 이안 쪽으로 기울였다."], ["p", "\"너희 세계의 산은 누가 그 이름을 부르기 전에도 거기 있었다. 하지만 누군가 그 산을 보고, 이름을 붙이고, 그 산에 오른 이야기를 남겼을 때, 산은 비로소 그 산이 되었지. 세상은 기록될 때 모양을 얻는다. 그리고 선택될 때 움직인다. 나는 오랫동안 기록만 했다. 선택은 하지 않았다. 선택은 기록자가 하는 일이 아니니까.\""], ["p", "\"그럼 누가 해요?\""], ["p", "\"그 세계 안에 사는 자들. 너희 같은.\""], ["p", "기록자는 이안의 손에 쥔 원을 바라보았다. 일곱 개의 열쇠가 하나가 된 원."], ["p", "\"너희가 너무 일찍 왔다고 한 건, 네 이름이 아직 책에 다 적히지 않았기 때문이다. 너는 아직 무엇을 쓸지 정하지 않았다. 기록자는 항상 마지막에 도착해야 하는데, 너는 아직 마지막이 아니야.\""], ["p", "기록자는 마지막으로 말했다."], ["p", "\"너희가 찾아온 것은 세계의 끝이 아니다. 세계가 시작되는 방식이다.\""], ["n", "제22장"], ["t", "에드먼드의 선택"], ["p", "그때 에드먼드가 앞으로 나섰다."], ["p", "그의 몸은 아까보다 더 희미해져 있었다. 문틀 너머의 풍경이 그의 외투를 통해 비쳐 보였다."], ["p", "그는 오래전부터 이곳에 돌아오기를 기다렸다고 말했다."], ["p", "\"나는 189년 전 이 문을 열려고 했다.\""], ["p", "그는 기록자를 올려다보았다. 189년 전, 이름도 없이 곁을 걷던 동행을."], ["p", "그는 자신이 처음 발견한 세계에 대해 이야기했다."], ["p", "당시 그는 모든 것을 기록하고 싶었다."], ["p", "새로운 문명을 발견하고, 세계의 비밀을 밝혀내고, 인류에게 진실을 알려 주고 싶었다. 그리고 누구보다 먼저 그 일을 해낸 사람으로 기억되고 싶었다. 거울 속의 자신이 그 사실을 지적했을 때, 그는 화를 내며 거울을 등졌다."], ["p", "하지만 그가 장치를 작동시키는 순간 세계가 흔들리기 시작했다."], ["p", "여섯 개의 열쇠로 억지로 깨운 장치는 제멋대로 미래를 적어 나갔다. 마을의 시간이 멈췄고, 바다의 도시가 가라앉았다. 비석들이 사막을 뒤덮었다."], ["p", "그는 모든 것을 멈추기 위해 이곳에 남았다."], ["p", "189년 동안. 열쇠를 다시 흩어 놓고, 장치 곁을 지키며. 그리고 테오도르에게 돌아가지 못한 채."], ["p", "\"그럼 왜 우리를 여기까지 데려온 거죠?\""], ["p", "유나가 물었다."], ["p", "\"사막에서 처음 만났을 때 우리를 돌려보낼 수도 있었잖아요.\""], ["p", "에드먼드는 이안을 바라보았다."], ["p", "\"이제 내가 할 수 있는 일은 끝났으니까.\""], ["p", "그는 웃었다. 사막에서 처음 보여 준 굳은 웃음이 아니었다. 무거운 짐을 내려놓은 사람의 웃음이었다."], ["p", "\"나는 일곱 번째 열쇠를 찾지 못했다. 그건 내 그림자 속에 있었는데, 나는 한 번도 그쪽을 돌아보지 않았지. 나는 늘 바깥만 보았다. 지도의 빈칸, 수평선 너머, 남들이 가 보지 못한 곳. 정작 나 자신이 어디로 돌아가고 싶은지는 한 번도 묻지 않았어.\""], ["p", "그는 외투 안주머니에서 무언가를 꺼냈다."], ["p", "그는 이안에게 오래된 나침반을 건넸다."], ["p", "놋쇠로 된 작은 나침반이었다. 뚜껑 안쪽에는 두 사람의 이름 첫 글자가 새겨져 있었다. E. R. 그리고 T."], ["p", "\"테오도르가 출항 전에 준 거다. 내가 길을 잃지 않도록.\""], ["p", "이안은 나침반을 열었다."], ["p", "나침반의 바늘은 북쪽을 가리키지 않았다."], ["p", "대신 이안의 심장 쪽을 향하고 있었다."], ["p", "이안이 몸을 돌려도, 나침반을 기울여도, 바늘은 끝까지 이안의 가슴을 가리켰다."], ["p", "\"길을 찾을 때는 바깥을 보지 마라.\""], ["p", "에드먼드는 말했다."], ["p", "\"가장 중요한 장소는 항상 네가 어디로 돌아가고 싶은지에 달려 있다. 나는 그걸 189년 걸려서 알았다. 너는 더 빨리 알았으면 좋겠구나.\""], ["p", "그 순간 에드먼드의 모습이 희미해지기 시작했다."], ["p", "발끝부터 빛이 되어 흩어졌다. 아프거나 괴로워 보이지 않았다. 오히려 편안해 보였다."], ["p", "\"어디 가세요?\""], ["p", "이안이 다급하게 물었다."], ["p", "에드먼드는 문들 사이 어딘가를 바라보았다. 이안은 그의 시선을 따라갔다. 그곳에 작은 나무 문 하나가 있었다. 문틀 너머로 비 오는 골목이 보였다. 골목 끝의 붉은 벽돌 건물. 주황색 불빛이 숨을 쉬듯 밝아지고 어두워지는 진열창."], ["p", "간판 없는 책방이었다."], ["p", "\"이제야 내가 돌아갈 곳이 보이는군.\""], ["p", "에드먼드가 말했다."], ["p", "\"오래 기다리게 했어. 그 고집쟁이를.\""], ["p", "그는 마지막으로 이안과 유나에게 모자를 벗어 인사했다. 그리고 거의 투명해진 몸으로 작은 나무 문을 향해 걸어갔다."], ["p", "문을 지나는 순간, 에드먼드는 빛이 되어 사라졌다."], ["p", "딸랑."], ["p", "아주 멀리서, 작은 종소리가 들렸다."], ["n", "제23장"], ["t", "돌아갈 수 없는 길"], ["p", "에드먼드가 떠나자마자 땅이 흔들렸다."], ["p", "세 번째 세계가 무너지기 시작했다."], ["p", "장치는 여전히 깨어나 있었다. 일곱 개의 열쇠가 모인 원이 이안의 손 안에서 뜨겁게 맥박치고 있었다. 기록이 멈추지 않고 있었다. 아니, 더 빨라지고 있었다."], ["p", "문들은 하나씩 사라졌다."], ["p", "멀리 있는 문부터 차례로, 촛불이 꺼지듯 사라졌다. 하나의 문이 사라질 때마다 그 너머의 세계가 하얗게 굳었다. 미래까지 모두 적혀 버린 세계. 더는 아무것도 선택할 수 없는 세계."], ["p", "하늘에는 거대한 균열이 생겼다."], ["p", "색 없는 하늘이 유리처럼 금 가더니, 그 틈으로 글자들이 쏟아져 내렸다. 수천, 수만 개의 날짜와 이름. 사막의 비석에 새겨져 있던 미래들이었다."], ["p", "기록자는 이안에게 마지막 선택을 하라고 했다."], ["p", "\"원을 장치에서 떼어 내 부수면, 장치는 멈춘다.\""], ["p", "기록자가 말했다."], ["p", "\"장치를 멈추면 모든 세계는 지금의 모습으로 유지된다. 첫 번째 세계는 첫 번째 세계로. 하지만 두 번째 세계와 세 번째 세계에 남아 있는 모든 비밀은 영원히 사라진다. 리아의 마을도, 잠든 바다도, 뒤집힌 도시도, 이곳의 문들도. 아무도 다시는 찾아갈 수 없다.\""], ["p", "\"반대로요?\""], ["p", "\"반대로 장치를 완전히 작동시키면 세 세계가 하나로 연결된다. 모든 기록이 완성되고, 모든 세계가 하나의 이야기가 되지.\""], ["p", "\"그럼 어떻게 되는데요?\""], ["p", "\"그 결과는 누구도 알 수 없다. 나조차도. 하지만 하나는 분명하다. 그 이야기는 이미 다 쓰인 이야기가 될 거다.\""], ["p", "유나의 비석이 떠올랐다. 마지막 문을 열지 못한 사람."], ["p", "유나는 이안을 바라보았다."], ["p", "\"어떻게 할 거야?\""], ["p", "이안은 대답하지 않았다."], ["p", "둘 다 싫었다. 리아의 마을이 영원히 사라지는 것도, 모든 미래가 비석처럼 굳어 버리는 것도. 하지만 기록자는 두 가지 길만 말했다. 책도 아무것도 알려 주지 않았다."], ["p", "리아의 말이 떠올랐다. '언젠가는 책이 알려 주지 않는 순간이 와요.'"], ["p", "그는 검은 책을 펼쳤다."], ["p", "마지막 페이지에는 아직 아무것도 적혀 있지 않았다."], ["p", "저자들의 이름 아래, 희미하게 비치던 이안의 이름이 조금 더 짙어져 있었다. 하지만 아직 완전하지 않았다. 그리고 그 아래는 텅 빈 종이였다."], ["p", "기록자는 항상 마지막에 도착한다."], ["p", "이안은 알 것 같았다. 지금까지 책은 언제나 다른 누군가의 문장을 보여 주었다. 리아의 문장, 에드먼드의 문장, 미래의 이안이 쓴 문장. 이안은 그것을 읽고 따라왔을 뿐이다."], ["p", "이번에는 읽는 것이 아니라 써야 했다."], ["p", "그는 펜을 꺼냈다. 학교 필통에 굴러다니던 평범한 검은 볼펜이었다."], ["p", "\"이안.\""], ["p", "유나가 불렀다. 그리고 주위를 둘러보았다."], ["p", "모든 문이 사라져 가는 가운데, 그들 바로 뒤에 문 하나가 남아 있었다. 이안의 도시로 이어지는 문. 엄마가 있는 창문이 보이는 문."], ["p", "그 문이 천천히 닫히고 있었다."], ["p", "\"저 문이 닫히면 우리는 못 돌아가.\""], ["p", "유나가 말했다. 그리고 문 쪽으로 걸어갔다."], ["p", "\"뭐 하려고?\""], ["p", "\"기록자님, 문은 안에서 닫을 수 있어요?\""], ["p", "유나가 기록자에게 물었다."], ["p", "\"아니. 문은 언제나 바깥에서 붙잡아 주는 사람이 있어야 열려 있다.\""], ["p", "유나는 고개를 끄덕였다. 그리고 닫혀 가는 문틀을 두 손으로 붙잡았다. 문은 무거웠다. 유나의 팔이 떨렸다."], ["p", "\"내가 잡고 있을게. 너는 써.\""], ["p", "\"유나, 그러면 너는….\""], ["p", "\"마지막 문을 열지 못한 사람.\""], ["p", "유나가 웃었다."], ["p", "\"이거였나 봐. 난 이 문을 열지 않을 거야. 네가 돌아올 때까지 닫히지 않게 잡고만 있을 거야. 비석이 맞았네. 근데 생각보다 나쁜 뜻은 아니었어.\""], ["p", "유나는 문틀을 꽉 붙든 채 이안을 보았다."], ["p", "\"그러니까 빨리 써. 그리고 꼭 돌아와. 내가 부를게.\""], ["p", "이안은 고개를 끄덕였다."], ["p", "그리고 처음으로 책에 직접 문장을 적었다."], ["p", "볼펜이 종이에 닿는 순간, 책 전체가 떨렸다. 이안은 천천히, 또박또박 썼다. 삐뚤빼뚤한 'ㅊ'과 작은 받침으로."], ["p", "'세계의 미래는 기록된 것이 아니라 선택되는 것이다.'"], ["p", "마지막 마침표를 찍었다."], ["p", "순간 모든 문이 빛났다."], ["p", "사라졌던 문들이 다시 나타났다. 하얗게 굳었던 세계들이 다시 색을 찾았다. 하늘의 균열에서 쏟아지던 날짜와 이름들이 공중에서 멈췄다가, 눈송이처럼 녹아 사라졌다."], ["p", "책의 마지막 페이지에서 이안의 이름이 선명해졌다."], ["p", "기록자가 얼굴 없는 머리를 천천히 끄덕였다."], ["p", "\"그렇구나. 기록하되, 정하지 않는다. 그것이 세 번째 길이었군.\""], ["p", "이안은 장치의 마지막 버튼을 눌렀다. 손에 쥔 원을 장치의 중심, 0의 자리에 끼워 넣었다."], ["p", "장치는 부서지지도, 완전히 깨어나지도 않았다. 대신 조용히 방향을 바꾸었다. 미래를 적던 장치가 이제는 일어난 일만 적기 시작했다. 앞으로 일어날 일의 자리는 빈칸으로 남겨 둔 채."], ["p", "세 개의 세계는 하나로 합쳐지지 않았다. 대신 서로를 볼 수 있게 되었다."], ["p", "그리고 그 순간, 이안의 발밑이 무너졌다."], ["s", ""], ["p", "이안은 어둠 속으로 떨어지고 있었다."], ["p", "위도 아래도 없었다. 문도 빛도 없었다. 손에는 책과 나침반만 남아 있었다."], ["p", "장치의 방향을 바꾼 대가였다. 기록자의 목소리가 멀리서 들렸다. '선택한 자는 자신이 돌아갈 길도 스스로 찾아야 한다.'"], ["p", "이안은 나침반을 열었다."], ["p", "바늘은 여전히 이안의 심장을 가리키고 있었다. 이안은 눈을 감았다. 그리고 에드먼드의 말을 떠올렸다."], ["p", "'가장 중요한 장소는 항상 네가 어디로 돌아가고 싶은지에 달려 있다.'"], ["p", "엄마가 있는 창문. 날개 달린 사자상. 별관 계단. 그리고."], ["p", "그때 목소리가 들렸다."], ["p", "\"이안!\""], ["p", "아주 멀리서. 하지만 분명하게."], ["p", "\"이안! 들려? 내가 얘기해 줄게. 너 잊어버린 거!\""], ["p", "유나였다."], ["p", "\"초등학교 2학년 때! 하교 시간에 비가 엄청 왔어! 나는 우산이 없었고, 엄마는 안 오고, 현관에서 혼자 울고 있었어!\""], ["p", "이안은 어둠 속에서 귀를 기울였다."], ["p", "\"그때 처음 보는 애가 와서 자기 우산을 줬어! 자기는 집이 가깝다고! 근데 거짓말이었어. 그 애네 집은 우리 집보다 훨씬 멀었거든! 그 애는 비를 쫄딱 맞고 뛰어갔어! 그게 너야! 다음 날 감기 걸려서 학교도 못 왔잖아!\""], ["p", "나침반의 바늘이 떨렸다."], ["p", "\"그날부터 내가 매일 너한테 우산 있냐고 물어보는 거야! 바보야!\""], ["p", "그 순간, 비워져 있던 자리에 무언가가 돌아왔다."], ["p", "빗소리. 젖은 현관. 우산을 꼭 쥐고 울던 작은 여자아이. 그 아이에게 우산을 내밀던 자신의 손. 그리고 빗속을 달리며 이상하게 기분이 좋았던 여덟 살의 이안."], ["p", "기억은 길을 만든다."], ["p", "어둠 속에 가는 빛줄기 하나가 생겼다. 유나의 목소리가 들려오는 쪽에서."], ["p", "나침반의 바늘이 처음으로 이안의 가슴을 떠나, 그 빛을 향해 돌아섰다."], ["p", "이안은 빛을 향해 달렸다."], ["n", "제24장"], ["t", "마지막 문"], ["p", "빛이 사라졌을 때, 세상은 조용했다."], ["p", "이안과 유나는 자신들이 어디에 있는지 알 수 없었다."], ["p", "이안이 눈을 떴을 때 가장 먼저 느낀 것은 손이었다. 누군가 이안의 손을 꽉 붙잡고 있었다. 유나였다. 유나는 숨을 헐떡이며 울다가 웃다가 하고 있었다."], ["p", "\"늦었잖아.\""], ["p", "\"미안.\""], ["p", "\"우산 기억나?\""], ["p", "\"응. 기억나.\""], ["p", "유나는 이안의 어깨를 세게 한 대 쳤다. 그리고 그대로 고개를 숙이고 한참 동안 아무 말도 하지 않았다."], ["p", "그들은 넓은 들판에 서 있었다."], ["p", "마른 풀이 무릎까지 자란 들판이었다. 차가운 밤바람이 불었다. 풀 냄새와 흙냄새가 났다. 진짜 냄새였다."], ["p", "하늘에는 익숙한 별들이 떠 있었다."], ["p", "북두칠성. 오리온자리. 움직이지 않는, 평범한 별들."], ["p", "멀리에는 자신들이 살던 도시가 보였다. 아파트 불빛과 송신탑의 빨간 불빛이 반짝였다. 그리고 들판 아래쪽 길가에, 낯익은 낡은 승용차 한 대가 비상등을 깜빡이며 서 있었다."], ["p", "차 옆에서 누군가 손전등을 흔들며 소리치고 있었다."], ["p", "\"이안! 유나!\""], ["p", "윤 관리인이었다."], ["p", "두 사람이 들판을 뛰어 내려가자 관리인은 손전등을 떨어뜨리고 두 사람을 한꺼번에 끌어안았다. 그의 카디건에서 오래된 종이 냄새가 났다."], ["p", "\"다섯 시간이나 연락이 없어서… 산 쪽에 안개가 끼더니 너희가 사라졌어. 경찰에 신고하려던 참이었다.\""], ["p", "\"다섯 시간이요?\""], ["p", "유나가 휴대전화를 꺼냈다. 화면이 켜졌다. 멈춰 있던 시계가 다시 움직이고 있었다. 오후 7시 42분. 날짜는 그대로였다."], ["p", "2026년 11월 25일."], ["p", "에드먼드의 일지 마지막 페이지의 날짜. 유나의 비석에 새겨져 있던 날짜."], ["p", "그 하루가, 아무 일 없이 저물고 있었다."], ["p", "모든 것이 원래대로 돌아온 것처럼 보였다."], ["p", "하지만 한 가지가 달라져 있었다."], ["p", "관리인이 하늘을 올려다보며 손전등을 다시 주웠다. 그리고 입을 벌린 채 굳어 버렸다."], ["p", "하늘에 세 개의 달이 떠 있었다."], ["p", "원래의 달 하나. 그 옆에 조금 작은 은빛 달. 그리고 가장 작은, 희미한 하얀 달."], ["p", "첫 번째 세계와 두 번째 세계, 그리고 세 번째 세계. 서로를 볼 수 있게 된 세 개의 세계."], ["p", "\"저건….\""], ["p", "관리인이 중얼거렸다."], ["p", "\"박 선생이 봤으면 좋아했을 텐데.\""], ["p", "이안은 가방을 열었다."], ["p", "검은 책은 사라져 있었다."], ["p", "배낭 속을 아무리 뒤져도 없었다. 에드먼드의 일지도, 테오도르의 나침반도 그대로 있는데, 책만 없었다."], ["p", "대신 작은 종이 한 장이 들어 있었다."], ["p", "종이에는 짧은 문장이 적혀 있었다. 이안의 글씨였다."], ["p", "'첫 번째 이야기는 끝났다.'"], ["p", "그 아래에는 다른 문장이 있었다. 이번에는 처음 보는 글씨였다. 아니, 어디선가 본 것 같은. 책방 카운터에 펼쳐져 있던 장부의 반듯하고 단정한 글씨."], ["p", "'이제 네가 발견할 차례다.'"], ["p", "유나는 하늘을 올려다보았다."], ["p", "\"우리 집에 가자.\""], ["p", "이안은 고개를 끄덕였다."], ["p", "\"그 전에 우리 엄마한테 전화부터 해야겠다.\""], ["p", "\"너희 엄마 오늘 야간 근무 아니야?\""], ["p", "\"그래도. 그냥 목소리 듣고 싶어서.\""], ["p", "유나가 웃었다."], ["s", ""], ["p", "관리인의 차는 도시로 향했다."], ["p", "차가 구시가지에 들어섰을 때, 이안은 창밖을 보다가 문득 이상한 사실을 깨달았다."], ["p", "\"선생님, 잠깐만 세워 주세요.\""], ["p", "차가 멈췄다. 이안은 차에서 내려 좁은 골목을 바라보았다."], ["p", "그가 살던 도시에는 원래 없었던 건물이 하나 생겨 있었다."], ["p", "아니, 원래부터 있었지만 아무도 보지 못하던 건물이었다. 이제는 길 건너편에서도, 큰길에서도 또렷하게 보였다. 지나가는 사람들이 고개를 돌려 그 건물을 쳐다보고 있었다."], ["p", "바로 그 오래된 책방이었다."], ["p", "붉은 벽돌 이 층 건물. 진열창 안에 높이 쌓인 책들. 숨을 쉬듯 밝아졌다 어두워지는 주황색 불빛."], ["p", "그리고 책방의 간판에는 처음으로 글자가 적혀 있었다."], ["p", "세계의 마지막 기록관."], ["p", "이안과 유나는 진열창으로 다가갔다."], ["p", "안쪽 카운터에 두 사람이 앉아 있었다. 둥근 안경을 쓴 하얀 머리의 노인과, 수염을 기른 키 큰 남자. 두 사람 앞에 찻잔 두 개가 놓여 있었다. 키 큰 남자가 무언가 말하자, 안경 쓴 노인이 어깨를 들썩이며 웃었다. 오래 참았던 웃음이었다."], ["p", "수염 난 남자가 창밖의 두 사람을 발견했다. 그는 찻잔을 들어 보이며 한쪽 눈을 찡긋했다."], ["p", "이안이 손을 들어 인사하려는 순간, 불빛이 깜빡였다."], ["p", "다시 보았을 때 카운터에는 아무도 없었다. 찻잔 두 개만 남아 김을 피워 올리고 있었다."], ["p", "\"갔네.\""], ["p", "유나가 말했다."], ["p", "\"응. 같이 갔어.\""], ["p", "이안은 간판을 다시 올려다보았다. 세계의 마지막 기록관. 그 글씨 역시, 반듯하고 단정했다."], ["n", "에필로그"], ["t", "아직 발견되지 않은 페이지"], ["p", "몇 달이 지났다."], ["p", "이안과 유나는 다시 평범한 생활로 돌아왔다."], ["p", "학교에 가고, 친구들과 이야기하고, 숙제를 했다. 이안의 성적은 여전히 중간쯤이었다. 다만 국어 시간에 독서 감상문을 직접 쓰기 시작했다. 선생님은 이안의 감상문을 읽고 처음으로 출석부를 보지 않고 이안의 이름을 불렀다."], ["p", "이안은 엄마와 일요일 저녁마다 밥을 먹기로 했다. 처음에는 어색했다. 무슨 말을 해야 할지 몰라서 둘 다 텔레비전만 보았다. 그러다 세 번째 일요일에 엄마가 먼저 말했다. 요즘 하늘에 달이 세 개라서 퇴근길이 덜 무섭다고. 이안은 그 말에 웃음을 터뜨렸고, 그날은 밥을 다 먹고도 한 시간이나 이야기를 했다."], ["p", "하늘의 세 달은 한동안 온 세상을 떠들썩하게 했다. 과학자들은 매일 새로운 이론을 발표했다. 뉴스는 매일 그 이야기를 했다. 그러다 사람들은 조금씩 익숙해졌다. 달이 세 개인 하늘 아래서도 사람들은 출근하고, 장을 보고, 아이들을 재웠다."], ["p", "윤 관리인은 도서관 지하의 돌판 사진을 찍어 두 사람에게 보내 주었다. 세 번째 원에 아주 가는 선 몇 개가 새로 생겨 있었다. 문틀 모양의 선들이었다."], ["p", "하지만 두 사람은 자신들이 겪은 일을 누구에게도 말하지 않았다."], ["p", "아무도 믿지 않을 것이라고 생각했기 때문이다. 그리고 어쩌면, 아직 끝나지 않았다는 것을 둘 다 알고 있었기 때문이다."], ["p", "유나는 리아의 하얀 꽃을 책갈피 사이에 끼워 말려 두었다. 꽃은 노랗게 바랬지만, 향기는 아직 조금 남아 있었다."], ["s", ""], ["p", "그러던 어느 날 이안은 자신의 책상 위에서 작은 상자를 발견했다."], ["p", "비가 내리는 날이었다. 학교에서 돌아와 방문을 열자, 책상 한가운데에 나무 상자가 놓여 있었다. 뚜껑에 작은 원이 새겨진, 먼지가 소복이 쌓인 상자."], ["p", "상자에는 보낸 사람의 이름이 없었다."], ["p", "엄마는 아무것도 모른다고 했다. 택배가 온 적도 없다고."], ["p", "안에는 낡은 책 한 권이 들어 있었다."], ["p", "검은색 표지."], ["p", "중앙에 새겨진 작은 원."], ["p", "이안은 한참 동안 책을 바라보았다. 그리고 손을 뻗었다. 손끝이 표지에 닿는 순간, 익숙한 차가운 감각이 손가락을 타고 올라왔다."], ["p", "이안은 책을 펼쳤다."], ["p", "첫 페이지에는 이렇게 적혀 있었다."], ["p", "'돌아온 것을 환영한다.'"], ["p", "이안은 다음 페이지를 넘겼다."], ["p", "그곳에는 자신이 한 번도 가본 적 없는 장소가 그려져 있었다."], ["p", "하늘 위에 떠 있는 바다."], ["p", "바다 아래에 있는 도시."], ["p", "도시의 중심에는 거대한 나무가 있었다."], ["p", "그 나무의 뿌리는 하늘을 향하고 있었다."], ["p", "프롤로그의 소문이 떠올랐다. 하늘을 향해 거꾸로 자라는 나무."], ["p", "이안은 책을 덮으려 했다."], ["p", "하지만 마지막 페이지에 적힌 문장이 눈에 들어왔다."], ["p", "'첫 번째 세계는 누군가의 꿈이었다.'"], ["p", "그 아래에는 작은 글씨가 하나 더 있었다."], ["p", "'그리고 꿈을 꾸고 있는 사람은 아직 깨어나지 않았다.'"], ["p", "이안은 창밖을 바라보았다."], ["p", "하늘에는 세 개의 달이 떠 있었다."], ["p", "그중 가장 작은 달이 천천히 움직이고 있었다. 다른 두 달은 제자리에 있는데, 가장 작은 하얀 달만 아주 천천히, 원을 그리며."], ["p", "절대로 하늘을 믿지 말라."], ["p", "그 달의 표면에는 아주 작은 문양이 새겨져 있었다."], ["p", "책의 표지와 똑같은 원이었다."], ["p", "그 순간 책의 마지막 페이지가 저절로 넘어갔다."], ["p", "새로운 글자가 나타났다."], ["p", "'두 번째 탐험을 시작할 준비가 되었는가?'"], ["p", "이안은 한동안 아무 말도 하지 못했다."], ["p", "그때 휴대전화가 울렸다. 유나였다."], ["p", "'야, 너 지금 하늘 봤어?'"], ["p", "이안은 피식 웃으며 답장을 보냈다."], ["p", "'봤어. 그리고 나 우산 있어.'"], ["p", "그리고 천천히 책을 펼쳤다."], ["p", "이번에는 첫 번째 페이지에 새로운 제목이 적혀 있었다."], ["p", "끝나지 않은 세계의 지도."], ["s", ""], ["p", "첫 번째 기록, 종료."], ["p", "두 번째 기록, 시작."]];const COVER="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAT5A4QDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD56Bp6AsQFBJPAA5JpgrufhpohuLw6pOv7mA7YgR95/X8P519jSpupJRRxSdlc6PwP4bXSrVbq6X/T5V5B/wCWSn+H6+v5V1YFLijFezCKguVHM3cKXgdDmkxUkMbSSIiDJYgCqYGlomlNfuZJMrAp5Pcn0FdTDBFbpthjCgDoByantYo7aBIlwqIMVmeIr1Y9Pk+ySqXZghKn7ua8mVSVefKtjZJRRzWoX0t7MWk4UH5U/uiqdFGK9WMVFWRjcWlUKXUO2xScFsZx+FIKDTA9C0wRCwgW3fzIlXCt61aI4rB8Hy77OSLI/dt0781vmvBrR5KjidUXdXK0sQkPzCk+yRu6s6gsvQ+l <script>
{
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('cv').src=COVER;document.getElementById('ic').src=COVER;document.getElementById('bk').src=BACK;
const book=document.getElementById('book'),note=document.getElementById('note'),intro=document.getElementById('intro');
book.innerHTML=ITEMS.map(([k,t],i)=>k==='n'?`<p class="n" data-i="${i}">${esc(t)}</p>`:k==='t'?`<p class="t" data-i="${i}">${esc(t)}</p>`:k==='s'?'<p class="s">✦</p>':`<p data-i="${i}">${esc(t)}</p>`).join('');
let fs=21;try{fs=+localStorage.getItem('bimil-fs3')||21}catch(e){}
function setFs(v){fs=Math.max(16,Math.min(30,v));document.documentElement.style.setProperty('--fs',fs+'px');try{localStorage.setItem('bimil-fs3',fs)}catch(e){}}
setFs(fs);document.getElementById('sm').onclick=()=>setFs(fs-2);document.getElementById('lg').onclick=()=>setFs(fs+2);
/* 듣기 */
const synth=window.speechSynthesis,lb=document.getElementById('listen');let on=false,voice=null,gen=0,idx=0;
const rs=document.getElementById('rate');let VO=[],cur=0;
function ld(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}function sv(k,v){try{localStorage.setItem(k,v)}catch(e){}}
rs.value=ld('bimil-rate','1');cur=+ld('bimil-preset','0')||0;
const PRE=[{p:1,r:1,want:/female|여|yuna|sunhi|sora|heami|google/i,hi:'안녕, 나는 이 책을 읽어 줄 기본 목소리야.'},{p:1.6,r:1.08,want:/female|여|yuna|sunhi|sora|google/i,hi:'안녕! 내가 재미있게 읽어 줄게!'},{p:0.55,r:0.88,want:/male|남|injoon|hyunsu|minsu/i,hi:'허허, 할아버지가 옛날이야기를 들려주마.'}];
function pv(){const P=PRE[cur];return VO.find(v=>P.want.test(v.name)&&!(cur!==2&&/male/i.test(v.name)&&!/female/i.test(v.name)))||VO[cur%Math.max(1,VO.length)]||VO[0]||null}
function pick(){if(!synth)return;const all=synth.getVoices();const ko=all.filter(v=>/^ko/i.test(v.lang));VO=ko.length?ko:all;voice=pv()}
function mark(){document.querySelectorAll('.vb').forEach(b=>b.classList.toggle('sel',+b.dataset.v===cur))}mark();
function restart(){if(on){const k=idx;gen++;try{synth.cancel()}catch(e){}setTimeout(()=>{idx=k;speakPara()},150)}}
document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>{cur=+b.dataset.v;sv('bimil-preset',cur);mark();pick();if(on)restart();else if(synth){try{synth.cancel()}catch(e){}const u=new SpeechSynthesisUtterance(PRE[cur].hi);u.lang='ko-KR';if(voice)u.voice=voice;u.pitch=PRE[cur].p;u.rate=PRE[cur].r*+rs.value;synth.speak(u)}});
rs.onchange=()=>{sv('bimil-rate',rs.value);restart()};

if(synth){pick();synth.onvoiceschanged=pick}
const paras=[...book.querySelectorAll('p[data-i]')];
function firstVisible(){for(let k=0;k<paras.length;k++){const r=paras[k].getBoundingClientRect();if(r.bottom>70)return k}return 0}
function hl(k){book.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));const p=paras[k];if(!p)return;p.classList.add('hl');const r=p.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-40)scrollTo({top:scrollY+r.top-innerHeight*.3})}
function speakPara(){if(!on)return;const g=gen;if(idx>=paras.length){stop();note.textContent='끝까지 다 읽었어요.';document.querySelector('.end').scrollIntoView();return}
  hl(idx);const text=paras[idx].textContent.replace(/[‘’'“”"]/g,'');const parts=text.match(/[^.!?…]+[.!?…]*/g)||[text];let j=0;
  const nx=()=>{if(g!==gen)return;if(j>=parts.length){idx++;speakPara();return}
    const u=new SpeechSynthesisUtterance(parts[j].trim());u.lang='ko-KR';if(voice)u.voice=voice;u.rate=PRE[cur].r*+rs.value;u.pitch=PRE[cur].p;
    u.onend=()=>{if(g!==gen)return;j++;nx()};u.onerror=e=>{if(g!==gen)return;if(e.error!=='interrupted'&&e.error!=='canceled'){j++;nx()}};synth.speak(u)};nx()}
function start(from){if(!synth){note.textContent='이 브라우저는 듣기 기능을 지원하지 않아요.';return}
  on=true;gen++;lb.classList.add('on');lb.textContent='⏹ 멈추기';note.textContent=voice?'':'소리가 안 나면 기기에 한국어 음성이 있는지 확인해 주세요.';setTimeout(()=>{if(voice)note.textContent=''},4000);
  try{synth.cancel()}catch(e){}idx=from;setTimeout(speakPara,150)}
function stop(){if(!on)return;on=false;gen++;try{synth.cancel()}catch(e){}lb.classList.remove('on');lb.textContent='🔊 듣기';book.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'))}
lb.onclick=()=>{if(on){stop();note.textContent=''}else start(firstVisible())};
document.getElementById('goRead').onclick=()=>{intro.remove();try{const y=+localStorage.getItem('bimil-y');if(y)scrollTo({top:y,behavior:'auto'})}catch(e){}};
document.getElementById('goListen').onclick=()=>{intro.remove();book.scrollIntoView({behavior:'auto'});start(0)};
document.getElementById('again').onclick=()=>{stop();note.textContent='';scrollTo({top:0})};
let st;addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('bimil-y',scrollY)}catch(e){}},300)},{passive:true});
}
</script></body></html>
