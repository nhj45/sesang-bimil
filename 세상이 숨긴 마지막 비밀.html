<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세상이 숨긴 마지막 비밀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* VOICE: 조용한 밤에 책 읽기
   IDEA: 끝없이 이어지는 두루마리 책
   PICTURE: 표지 그림과 큰 글씨 본문
   COLOUR and TYPE: 깊은 남보라 밤, 흰 종이, 보라 버튼 / Gowun Batang
   LAYOUT: 시작 화면에서 읽기·듣기 선택, 아래로 스크롤, 맨 끝에 다시 보기 */
:root{color-scheme:light;--night:#141235;--ink:#221c44;--acc:#7a4fd0;--paper:#fdfcff}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Batang",serif;overflow-x:clip}
.cover{background:var(--night);display:flex;justify-content:center}.cover img{width:100%;max-width:760px;display:block}
main{max-width:760px;margin:0 auto;padding:40px max(6vw,22px) 40px;font-size:var(--fs,21px)}
main p{margin:0 0 .6em;text-indent:1em;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere;border-radius:4px;transition:background .3s}
main p.s{text-align:center;text-indent:0;color:var(--acc);margin:1.2em 0}
main .n{text-align:center;text-indent:0;color:var(--acc);font-size:.95em;margin:3.5em 0 .3em}
main .t{text-align:center;text-indent:0;font-weight:700;font-size:1.6em;line-height:1.3;margin:0 0 1.4em}
.title{text-align:center;padding:60px 20px 10px}.title .a{font-size:26px}.title .b{font-size:44px;font-weight:700;color:var(--acc);margin:.15em 0 .6em}
.hl{background:#ece4ff;box-shadow:0 0 0 4px #ece4ff}
.end{background:var(--night);text-align:center;padding-bottom:60px}.end img{width:100%;max-width:760px;display:block;margin:0 auto 28px}
button{font:600 16px system-ui,sans-serif;min-height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid #c9b6ff;outline-offset:2px}
.ghost{background:#ffffff1f;border:1px solid #ffffff55}
#again{font-size:18px;min-height:56px;padding:0 34px}
#top{position:fixed;top:10px;right:12px;z-index:6;display:flex;gap:6px}
#top button{min-height:42px;font-size:14px;padding:0 14px;box-shadow:0 4px 14px #0004}
#top .sm{background:#1d1a4ae6}
#listen.on{background:#d9436b}
#intro{position:fixed;inset:0;z-index:10;background:#141235;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;color:#fff;text-align:center}
#intro img{max-height:56vh;max-width:90vw;border-radius:6px;box-shadow:0 10px 40px #000a}
#intro .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#intro button{font-size:20px;min-height:60px;min-width:150px}
#intro small{color:#c9c3ee;font:14px system-ui,sans-serif}
#vpanel{position:fixed;top:60px;right:12px;z-index:7;background:#1d1a4af2;color:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;width:min(300px,calc(100vw - 24px));font:14px system-ui,sans-serif;box-shadow:0 8px 24px #0006}#vpanel[hidden]{display:none}#vpanel label{display:flex;flex-direction:column;gap:4px}#vpanel select{font:15px system-ui,sans-serif;min-height:42px;border-radius:10px;border:1px solid #ffffff40;background:#2a2560;color:#fff;padding:0 8px}.vg{display:flex;flex-direction:column;gap:8px}.vb{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;background:#2a2560;border:2px solid transparent;border-radius:12px;min-height:58px;padding:6px 12px;font-size:22px}.vb b{font-size:15px}.vb small{grid-column:2;font-size:12px;color:#c9c3ee;font-weight:400}.vb.sel{border-color:#c9b6ff;background:#3a3080}
#note{position:fixed;top:60px;right:12px;z-index:6;max-width:250px;font:13px system-ui,sans-serif;color:#fff;background:#1d1a4aee;border-radius:10px}#note:not(:empty){padding:8px 10px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<div id="intro"><img id="ic" alt="세상이 숨긴 마지막 비밀 표지"><div class="row"><button id="goRead">📖 읽기</button><button id="goListen" class="ghost">🔊 듣기</button></div><small>읽기는 직접 스크롤하며 읽고, 듣기는 소리 내어 읽어 줘요</small></div>
<div id="top"><button class="sm" id="sm" aria-label="글씨 작게">가-</button><button class="sm" id="lg" aria-label="글씨 크게">가+</button><button id="vbtn" class="sm" aria-label="목소리 설정">🎙 목소리</button><button id="listen">🔊 듣기</button></div>
<div id="vpanel" hidden><div class="vg"><button data-v="0" class="vb">🙂<b>기본 목소리</b><small>차분하게 읽어요</small></button><button data-v="1" class="vb">🧒<b>아이 목소리</b><small>높고 밝게 읽어요</small></button><button data-v="2" class="vb">👴<b>할아버지 목소리</b><small>낮고 천천히 읽어요</small></button></div><label>빠르기<select id="rate"><option value="0.8">천천히</option><option value="1" selected>보통</option><option value="1.25">빠르게</option></select></label></div><div id="note"></div>
<div class="cover"><img id="cv" alt="앞표지"></div>
<div class="title"><div class="a">세상이 숨긴</div><div class="b">마지막 비밀</div><div>— 첫 번째 기록 —</div></div>
<main id="book"></main>
<div class="end"><img id="bk" alt="뒤표지"><button id="again">↺ 다시 보기</button></div>
<script>const ITEMS=[["n", "프롤로그"], ["t", "사라진 탐험가의 마지막 기록"], ["p", "북쪽 바다에는 오래전부터 이상한 소문이 전해져 내려왔다."], ["p", "그곳에는 어떤 지도에도 표시되지 않는 섬이 하나 있다는 이야기였다."], ["p", "섬의 이름은 없었다. 정확한 위치도 알려지지 않았다. 심지어 그 섬을 직접 보았다는 사람들조차 섬의 모습을 제대로 설명하지 못했다."], ["p", "어떤 사람은 섬에 끝없이 이어지는 계단이 있다고 했다. 계단은 위로 올라가는 것처럼 보이다가 어느 순간 아래로 내려가고, 아래로 내려가는 것처럼 보이다가 다시 하늘로 이어진다고 했다."], ["p", "어떤 사람은 하늘을 향해 거꾸로 자라는 나무가 있다고 했다. 뿌리는 구름 속에 박혀 있고, 가지는 땅을 움켜쥐고 있다고."], ["p", "또 어떤 사람은 그 섬에는 아무것도 없었다고 주장했다."], ["p", "단 하나의 건물도, 나무도, 바위도 없는 텅 빈 땅이었다고. 너무 비어 있어서 오래 바라보면 눈이 아파 오는 땅이었다고."], ["p", "이야기는 저마다 달랐다. 하지만 그곳에 다녀온 사람들에게는 한 가지 공통점이 있었다."], ["p", "모두 같은 말을 남겼다는 것이다."], ["p", "\"우리는 세상을 잘못 알고 있었다.\""], ["s", ""], ["p", "189년 전, 북쪽 바다를 탐험하던 탐험가 에드먼드 로웰은 마지막 항해를 떠났다."], ["p", "그는 이름난 지리학자였다. 사람들이 지도의 빈칸을 두려워할 때, 그는 빈칸을 보면 가슴이 뛰었다. 아직 아무도 이름 붙이지 않은 땅, 아무도 발자국을 남기지 않은 해안, 그 모든 것이 그를 부르고 있다고 믿었다."], ["p", "그에게는 오랫동안 함께한 젊은 조수가 있었다. 이름은 테오도르였다. 테오도르는 에드먼드가 남기는 모든 기록을 정리하고, 지도를 옮겨 그리고, 탐험 일지를 책으로 묶는 일을 맡았다."], ["p", "항해를 떠나기 전날 밤, 에드먼드는 테오도르에게 편지 한 통을 남겼다."], ["p", "편지는 봉투에 넣어 밀랍으로 봉해져 있었다. 테오도르는 스승이 항구를 떠난 뒤에야 봉투를 열어 보았다."], ["p", "편지에는 단 세 문장만 적혀 있었다."], ["p", "'만약 내가 돌아오지 않는다면, 나를 찾지 마라.'"], ["p", "'내가 발견한 것은 섬이 아니다.'"], ["p", "'그리고 가장 중요한 것은, 절대로 하늘을 믿지 말라는 것이다.'"], ["p", "테오도르는 그 편지를 여러 번 읽었다. 읽을 때마다 마지막 문장이 마음에 걸렸다. 하늘을 믿지 말라니. 뱃사람에게 하늘은 길이었다. 별을 보고 방향을 정하고, 구름을 보고 날씨를 읽었다. 하늘을 믿지 않는다면 대체 무엇을 믿고 바다를 건넌단 말인가."], ["p", "그 이후 에드먼드는 돌아오지 않았다."], ["p", "배도 발견되지 않았고, 선원들의 시신도 발견되지 않았다. 마치 바다가 배 한 척을 통째로 삼켜 버린 것 같았다."], ["p", "처음 몇 해 동안은 사람들이 그의 이름을 이야기했다. 위대한 탐험가가 사라졌다고, 북쪽 바다에는 역시 무언가가 있다고. 그러나 시간이 지나자 이야기는 점점 짧아졌고, 결국 아무도 그의 이름을 꺼내지 않게 되었다."], ["p", "그의 이름은 역사에서 조용히 지워졌다."], ["p", "그리고 테오도르 역시 어느 날 갑자기 자취를 감추었다. 그가 살던 집에는 정리되지 않은 지도 몇 장과, 표지에 작은 원이 새겨진 검은 상자 하나만 남아 있었다고 한다."], ["s", ""], ["p", "그로부터 아주 오랜 시간이 흐른 뒤, 한 해안 마을의 창고에서 오래된 항해 일지 하나가 발견되었다."], ["p", "가죽 표지는 바닷물에 젖었다가 마르기를 수없이 반복한 듯 갈라져 있었다. 종이는 누렇게 바랬고, 글씨의 대부분은 번져서 알아볼 수 없었다."], ["p", "하지만 마지막 페이지만은 이상할 정도로 깨끗했다."], ["p", "그곳에는 이런 문장이 적혀 있었다."], ["p", "'우리는 이곳에 처음 도착한 사람들이 아니다. 우리는 이곳을 떠나지 못한 마지막 사람들이 될 것이다.'"], ["p", "그리고 그 아래에는 날짜가 적혀 있었다."], ["p", "189년 전의 날짜가 아니었다."], ["p", "2026년 11월 25일."], ["p", "아직 오지 않은 날이었다."], ["n", "제1장"], ["t", "오래된 책방"], ["p", "비가 내리는 날이었다."], ["p", "십일월의 비는 차가웠다. 굵지도 가늘지도 않은 빗줄기가 하루 종일 그치지 않고 도시를 적셨다."], ["p", "도시의 좁은 골목에는 오래된 건물들이 빽빽하게 들어서 있었다. 사람들은 우산을 쓴 채 빠르게 지나갔고, 빗물은 도로의 작은 틈 사이로 흘러 들어갔다. 가로등은 아직 켜지지 않았지만 하늘이 어두워서 오후 네 시인데도 저녁처럼 느껴졌다."], ["p", "이안은 우산도 없이 후드를 뒤집어쓴 채 골목을 걷고 있었다."], ["p", "열여섯 살. 고등학교 1학년. 키는 반에서 중간쯤이었고, 성적도 중간쯤이었다. 특별히 잘하는 것도 없었고 특별히 못하는 것도 없었다. 선생님들은 이안의 이름을 부를 때 한 번쯤 출석부를 확인했다. 그 정도로 눈에 띄지 않는 아이였다."], ["p", "이안 자신도 그게 나쁘다고 생각하지는 않았다. 눈에 띄지 않으면 귀찮은 일도 생기지 않는다. 학교에 가고, 수업을 듣고, 집에 돌아와 게임을 하다 잠드는 하루. 내일도, 모레도 비슷할 하루."], ["p", "그날은 학원 수업이 갑자기 취소되었다. 버스를 타려다가 정류장이 너무 붐벼서 그냥 걷기로 했다. 그리고 평소에는 지나치던 골목으로 발을 들였다. 왜 그랬는지는 이안 자신도 설명할 수 없었다. 그냥, 그쪽으로 가고 싶었다."], ["p", "골목은 생각보다 길었다."], ["p", "양쪽으로 문을 닫은 철물점, 간판이 반쯤 떨어진 세탁소, 유리창에 신문지를 붙여 놓은 빈 가게들이 이어졌다. 사람의 발길이 끊긴 지 오래된 거리 같았다."], ["p", "그 골목의 가장 끝에, 이상한 책방 하나가 있었다."], ["p", "붉은 벽돌로 지은 이 층짜리 건물이었다. 진열창 안쪽에는 책이 높이 쌓여 있었고, 문 위에는 나무 간판이 걸려 있었다."], ["p", "그런데 간판에는 아무런 글자도 적혀 있지 않았다."], ["p", "글자를 지운 흔적도 없었다. 처음부터 아무것도 쓰지 않은 것처럼, 매끈한 나무판만 걸려 있었다."], ["p", "이안은 그 책방 앞에서 발걸음을 멈췄다."], ["p", "\"여기에 이런 가게가 있었나?\""], ["p", "이 동네에서 태어나 십육 년을 살았다. 이 골목 근처도 수없이 지나다녔다. 그런데 이런 건물은 본 기억이 없었다."], ["p", "이안은 평소 책을 좋아하는 편이 아니었다. 학교에서 책을 읽으라고 하면 대충 몇 페이지를 넘기다가 잠들기 일쑤였다. 독서 감상문은 늘 줄거리를 인터넷에서 찾아 적당히 고쳐 냈다."], ["p", "그런데 그날은 이상하게도 책방 안쪽에서 새어 나오는 희미한 빛이 눈에 들어왔다."], ["p", "형광등의 하얀 빛이 아니었다. 촛불처럼 흔들리는 주황빛이었다. 빛은 마치 숨을 쉬듯 천천히 밝아졌다가 다시 어두워졌다."], ["p", "이안은 자기도 모르게 손잡이를 잡았다."], ["p", "문을 열자 작은 종이 울렸다."], ["p", "딸랑."], ["s", ""], ["p", "안쪽은 생각보다 넓었다."], ["p", "밖에서 볼 때는 작은 가게처럼 보였는데, 안으로 들어서자 끝이 보이지 않을 만큼 깊었다. 천장까지 닿을 만큼 높은 책장이 줄지어 있었고, 책장 사이에는 좁은 통로가 미로처럼 이어져 있었다."], ["p", "오래된 종이 냄새와 나무 냄새가 섞여 있었다. 그리고 아주 희미하게, 바다 냄새가 났다."], ["p", "이안은 고개를 갸웃했다. 이 도시는 바다에서 한참 떨어져 있었다."], ["p", "\"어서 오게.\""], ["p", "카운터 뒤에서 노인이 고개를 들었다."], ["p", "하얗게 센 머리를 뒤로 단정하게 넘긴 노인이었다. 둥근 안경 너머로 보이는 눈은 나이에 어울리지 않게 맑았다. 낡았지만 깨끗한 조끼를 입고, 손에는 펜 한 자루를 쥐고 있었다. 카운터 위에는 두꺼운 장부가 펼쳐져 있었다."], ["p", "\"책을 찾으러 왔니?\""], ["p", "\"아뇨. 그냥 지나가다가요.\""], ["p", "이안은 젖은 후드를 벗으며 어색하게 대답했다. 바닥에 물방울이 떨어졌다."], ["p", "노인은 잠시 이안을 바라보았다. 아주 오래, 마치 오랫동안 기다려 온 편지를 확인하듯 이안의 얼굴을 살폈다."], ["p", "그러더니 천천히 자리에서 일어났다."], ["p", "\"그렇다면 잘 찾아왔구나.\""], ["p", "\"네?\""], ["p", "\"책을 찾으러 온 사람은 대개 원하는 책을 찾지 못한다네. 하지만 그냥 지나가던 사람은 가끔, 자기를 찾던 책을 만나지.\""], ["p", "노인은 그 말에 대해 더 설명하지 않았다."], ["p", "대신 펜을 장부 위에 내려놓고, 책장 가장 깊숙한 곳으로 걸어갔다."], ["p", "이안은 잠시 망설였다. 그냥 나가 버릴까 생각했다. 하지만 발이 저절로 노인을 따라가고 있었다."], ["p", "통로는 갈수록 좁아졌다. 책장에 꽂힌 책들의 제목은 처음 보는 글자로 적혀 있는 것도 있었고, 아예 아무것도 적혀 있지 않은 것도 있었다. 어떤 책장에는 지구본이 놓여 있었는데, 대륙의 모양이 이안이 아는 것과 조금 달랐다."], ["p", "\"여기 책들은 다 파는 거예요?\""], ["p", "\"파는 책도 있고, 맡아 두는 책도 있지.\""], ["p", "\"맡아 둔다고요?\""], ["p", "\"주인이 올 때까지.\""], ["p", "책장 맨 아래에는 먼지가 가득 쌓인 나무 상자가 있었다. 상자 뚜껑에는 작은 원 하나가 새겨져 있었다."], ["p", "노인은 무릎을 굽혀 상자를 꺼냈다. 그리고 뚜껑을 열어 검은색 책 한 권을 꺼냈다."], ["p", "책의 표지는 이상했다."], ["p", "제목이 없었다."], ["p", "저자도 없었다."], ["p", "출판 날짜도 없었다."], ["p", "다만 표지 중앙에 작은 원 하나가 새겨져 있었다. 손가락 한 마디만 한 크기의 원이었다. 빛을 받는 각도에 따라 원은 은색으로 빛나기도 하고, 표지와 같은 검은색으로 사라지기도 했다."], ["p", "\"이 책은 얼마예요?\""], ["p", "이안은 별생각 없이 물었다. 사겠다는 뜻은 아니었다. 그냥 무슨 말이라도 해야 할 것 같았다."], ["p", "노인은 고개를 저었다."], ["p", "\"돈으로 살 수 있는 물건이 아니야.\""], ["p", "\"그럼 어떻게 사는데요?\""], ["p", "\"네가 가져가면 되지.\""], ["p", "\"그냥요?\""], ["p", "\"그냥은 아니야. 이 책을 가져가는 사람은 이 책이 가는 곳까지 함께 가야 하거든.\""], ["p", "노인이 웃었다. 농담인지 진담인지 알 수 없는 웃음이었다."], ["p", "이안은 책을 받아 들었다."], ["p", "생각보다 무거웠다. 두께는 보통 소설책 정도였는데, 무게는 사전 몇 권을 한꺼번에 든 것 같았다. 아니, 무겁다기보다는 단단히 붙잡히는 느낌이었다. 책이 이안의 손을 놓아주지 않으려는 것처럼."], ["p", "그는 첫 페이지를 펼쳤다."], ["p", "그 순간 손끝이 차가워졌다. 겨울 아침 쇠 난간을 잡았을 때처럼, 차가운 기운이 손가락을 타고 손목까지 올라왔다."], ["p", "첫 페이지에는 한 문장만 적혀 있었다. 오래된 잉크로, 반듯하고 단정한 글씨였다."], ["p", "'이 책을 발견한 사람은 이미 첫 번째 문을 지나왔다.'"], ["p", "이안은 고개를 들었다."], ["p", "\"이게 무슨 뜻이에요?\""], ["p", "그러나 대답은 없었다."], ["p", "통로에는 이안 혼자 서 있었다. 노인은 보이지 않았다. 발소리도, 옷깃이 스치는 소리도 들리지 않았는데."], ["p", "\"할아버지?\""], ["p", "이안은 통로를 되짚어 카운터 쪽으로 걸어갔다."], ["p", "카운터 쪽에도 아무도 없었다. 펼쳐져 있던 장부도, 노인이 내려놓은 펜도 사라져 있었다. 주황색 불빛만이 여전히 천천히 숨을 쉬고 있었다."], ["p", "책방의 문은 닫혀 있었다."], ["p", "\"저기요, 이거 진짜 가져가도 돼요?\""], ["p", "이안의 목소리가 책장 사이로 퍼져 나갔다가 메아리도 없이 사라졌다."], ["p", "한참을 기다렸지만 아무도 나타나지 않았다. 이안은 책을 다시 상자에 넣어 두고 갈까 생각했다. 그런데 책을 내려놓으려는 순간, 다시 그 차가운 감각이 손끝을 붙잡았다."], ["p", "결국 이안은 책을 가방에 넣고 밖으로 나왔다."], ["p", "딸랑."], ["p", "종소리가 등 뒤에서 울렸다. 이안은 뒤를 돌아보았다. 책방의 불빛이 천천히 꺼지고 있었다."], ["s", ""], ["p", "비는 조금 약해져 있었다."], ["p", "이안은 가방끈을 꽉 쥐고 골목을 빠져나왔다. 가방 속의 책이 등을 묵직하게 눌렀다. 큰길로 나오자 자동차 소리와 사람들의 목소리가 한꺼번에 밀려왔다. 조금 전까지의 고요함이 꿈처럼 느껴졌다."], ["p", "그때 휴대전화가 울렸다."], ["p", "친구인 유나에게서 온 메시지였다."], ["p", "유나는 이안과 초등학교 때부터 같은 반을 여러 번 한 친구였다. 성격은 이안과 정반대였다. 궁금한 게 생기면 끝까지 파고들어야 직성이 풀렸고, 누가 \"그건 원래 그래\"라고 말하면 \"왜 원래 그런데?\"라고 되묻는 아이였다. 덕분에 선생님들은 유나의 이름을 출석부 없이도 다 알았다."], ["p", "'야, 너 지금 어디야?'"], ["p", "'집 가는 중.'"], ["p", "'비 오는데 우산은?'"], ["p", "'없음.'"], ["p", "'역시. 그럼 이상한 거 하나 보여줄게.'"], ["p", "'뭔데.'"], ["p", "잠시 뒤 사진 한 장이 도착했다."], ["p", "사진에는 오래된 지도 하나가 찍혀 있었다. 누렇게 바랜 종이 위에 갈색 잉크로 해안선과 산맥이 그려져 있었다. 가장자리는 닳아서 너덜너덜했고, 군데군데 손으로 쓴 메모가 보였다."], ["p", "그리고 지도 한가운데에는 원 하나가 그려져 있었다."], ["p", "이안은 걸음을 멈췄다."], ["p", "빗물이 휴대전화 화면 위로 떨어졌다. 이안은 소매로 화면을 닦고 사진을 확대했다."], ["p", "틀림없었다."], ["p", "크기도, 선의 굵기도, 원 안쪽에 아주 희미하게 그어진 가는 선까지도."], ["p", "지도 한가운데의 원은 지금 이안의 가방 속에 들어 있는 책의 표지와 똑같았다."], ["p", "'이거 어디서 났어?'"], ["p", "이안은 떨리는 손가락으로 답장을 보냈다."], ["p", "'할아버지 서재. 내일 학교에서 얘기해. 진짜 이상한 게 있어.'"], ["p", "이안은 가방을 고쳐 멨다. 등 뒤에서, 책이 아주 조금 따뜻해지는 것 같았다."], ["n", "제2장"], ["t", "지도에 없는 장소"], ["p", "그날 밤 이안은 책을 책상 위에 올려 두고 한참을 바라보았다."], ["p", "첫 페이지 이후로는 모두 빈 종이였다. 이안은 페이지를 한 장 한 장 넘겨 보았다. 처음부터 끝까지, 글자 하나 없는 하얀 종이뿐이었다. 손전등을 비춰 보기도 하고, 창문에 대고 빛에 비춰 보기도 했다. 아무것도 나타나지 않았다."], ["p", "\"장난 같은 거겠지.\""], ["p", "이안은 중얼거리며 불을 껐다."], ["p", "하지만 쉽게 잠들 수 없었다. 어둠 속에서 눈을 감으면 텅 빈 간판과 주황색 불빛, 그리고 노인의 맑은 눈이 떠올랐다."], ["p", "'이 책을 가져가는 사람은 이 책이 가는 곳까지 함께 가야 하거든.'"], ["p", "책이 가는 곳이라니. 책이 어디를 간다는 걸까."], ["s", ""], ["p", "다음 날 아침, 이안은 학교에 도착하자마자 유나를 찾았다."], ["p", "평소라면 종이 울리기 직전에 겨우 교실에 들어섰을 이안이 수업 시작 삼십 분 전에 나타나자, 반 친구 몇 명이 놀란 얼굴로 쳐다보았다."], ["p", "유나는 창가 자리에 앉아 노트북을 보고 있었다. 짧게 자른 머리에 커다란 헤드폰을 목에 걸고 있었다. 이안이 다가오자 유나는 고개도 들지 않고 말했다."], ["p", "\"웬일이야. 지각 대장이.\""], ["p", "\"그 지도 어디서 났어?\""], ["p", "유나는 그제야 고개를 들었다. 이안의 얼굴을 보더니 장난기 어린 표정이 사라졌다."], ["p", "\"너 표정이 왜 그래?\""], ["p", "\"먼저 말해 봐. 그 지도.\""], ["p", "유나는 노트북 화면을 이안 쪽으로 돌렸다."], ["p", "\"할아버지 서재에서 발견했어.\""], ["p", "유나의 할아버지는 지도를 만드는 사람이었다. 정확히는 오래된 지도를 연구하고 복원하는 학자였다. 이 년 전 돌아가신 뒤, 할아버지의 서재는 그대로 잠겨 있었다. 어제 유나의 어머니가 서재를 정리하기로 했고, 유나가 그 일을 돕다가 책장 뒤쪽에 숨겨진 지도 통을 발견한 것이다."], ["p", "화면에는 사진으로 찍은 지도가 펼쳐져 있었다."], ["p", "지도에는 산맥과 강, 바다와 도시들이 섬세하게 그려져 있었다. 산은 작은 삼각형이 겹겹이 쌓인 모양이었고, 강은 가는 곡선으로 굽이쳤다. 도시들 옆에는 깨알 같은 글씨로 이름이 적혀 있었는데, 대부분 처음 듣는 이름이었다."], ["p", "\"이게 어느 나라야?\""], ["p", "\"모르겠어. 내가 아는 어떤 지도랑도 안 맞아. 해안선을 하나하나 비교해 봤는데 비슷한 데가 없더라.\""], ["p", "그런데 이상한 점이 하나 더 있었다."], ["p", "지도 오른쪽 아래에, 아무것도 없는 거대한 빈 공간이 있었다."], ["p", "바다도 아니었고 땅도 아니었다. 색칠도, 선도, 글씨도 없었다. 다른 곳은 그렇게 촘촘하게 그려져 있는데, 그 부분만 마치 누가 일부러 비워 둔 것처럼 하얗게 남아 있었다."], ["p", "\"여기는 뭐야?\""], ["p", "\"몰라. 근데 생각나는 게 하나 있어.\""], ["p", "유나는 잠시 망설이다가 말했다."], ["p", "\"어릴 때 할아버지 서재에서 놀다가, 할아버지가 지도 그리는 걸 본 적이 있거든. 내가 빈 곳에 뭐 그리라고 졸랐더니 할아버지가 엄청 진지한 얼굴로 그랬어. 여기는 절대 표시하면 안 된다고.\""], ["p", "\"왜?\""], ["p", "\"표시하면 누군가 찾아가니까.\""], ["p", "유나는 지도를 확대했다. 빈 공간의 한가운데가 화면 가득 커졌다."], ["p", "그곳에 작은 원이 있었다."], ["p", "연필로 아주 연하게, 지웠다가 다시 그린 듯한 원이었다. 원래 사진에서는 거의 보이지 않을 정도였다."], ["p", "이안은 말없이 가방을 열었다. 그리고 검은 책을 꺼내 노트북 옆에 내려놓았다."], ["p", "유나의 눈이 커졌다."], ["p", "두 원은 정확히 같았다."], ["p", "\"너… 이거 어디서 났어?\""], ["p", "이안은 어제 일을 처음부터 이야기했다. 간판 없는 책방, 끝없이 깊던 통로, 사라진 노인, 첫 페이지의 문장."], ["p", "유나는 이야기를 듣는 동안 한 번도 끼어들지 않았다. 유나답지 않은 일이었다."], ["p", "\"믿기 어렵지?\""], ["p", "이안이 말하자 유나는 고개를 저었다."], ["p", "\"아니. 믿기 어려운 게 아니라, 믿고 싶어서 무서운 거야.\""], ["p", "그때 책이 저절로 펼쳐졌다."], ["p", "바람이 분 것도 아니었다. 교실 창문은 닫혀 있었다. 표지가 천천히 들리더니, 페이지들이 빠르게 넘어가다가 한가운데쯤에서 멈췄다."], ["p", "이안과 유나는 동시에 뒤로 물러났다. 의자 다리가 바닥을 긁는 소리에 앞자리 아이가 돌아보았다가, 별일 아니라는 듯 다시 고개를 돌렸다."], ["p", "어젯밤까지 분명히 비어 있던 페이지였다."], ["p", "그곳에 새로운 문장이 나타나 있었다."], ["p", "'첫 번째 장소는 가장 오래된 도시 아래에 있다.'"], ["p", "잉크가 아직 마르지 않은 것처럼 글자가 반짝였다."], ["p", "\"이거 누가 장난치는 거 아니야?\""], ["p", "유나가 속삭였다."], ["p", "\"어떻게? 내가 계속 들고 다녔는데.\""], ["p", "\"그럼 무슨 특수 잉크 같은 거. 시간이 지나면 나타나는.\""], ["p", "\"어젯밤에 손전등으로 다 비춰 봤어. 아무것도 없었어.\""], ["p", "이안은 조심스럽게 페이지를 넘겼다."], ["p", "그 뒤에는 아주 작은 글씨로 무언가가 적혀 있었다. 너무 작아서 유나가 휴대전화 카메라로 확대해서야 읽을 수 있었다."], ["p", "'도시는 사라진 적이 없다. 사람들이 도시를 볼 수 없게 되었을 뿐이다.'"], ["p", "종이 울렸다. 아이들이 자리에 앉고 담임 선생님이 들어왔다. 이안은 서둘러 책을 덮어 가방에 넣었다."], ["p", "조회 시간 내내, 이안은 선생님의 말을 한마디도 듣지 못했다."], ["s", ""], ["p", "점심시간, 두 사람은 아무도 오지 않는 별관 계단에 앉았다."], ["p", "\"가장 오래된 도시.\""], ["p", "유나가 휴대전화를 두드리며 말했다."], ["p", "\"전 세계에서 제일 오래된 도시를 찾으라는 거면 우린 망한 거야. 비행기 표 살 돈도 없고.\""], ["p", "\"그런 뜻은 아닐 것 같아.\""], ["p", "\"왜?\""], ["p", "\"그 책방이 우리 동네에 있었잖아. 지도는 너희 할아버지 서재에 있었고. 다 가까이 있어.\""], ["p", "유나가 이안을 쳐다보았다."], ["p", "\"너 오늘 좀 똑똑하다?\""], ["p", "\"원래 똑똑했거든.\""], ["p", "\"그건 아니고.\""], ["p", "유나는 다시 휴대전화를 들여다보았다. 그리고 잠시 후, 무언가를 찾은 듯 화면을 이안에게 내밀었다."], ["p", "\"이거 봐. 우리 도시 구시가지. 지금 시청이랑 중앙도서관 있는 데 말이야. 거기가 원래 천 년도 넘은 옛 성곽 도시 자리래. 지금 도시는 그 위에 흙을 덮고 새로 지은 거고.\""], ["p", "\"그러니까 우리 발밑에 옛날 도시가 있다는 거야?\""], ["p", "\"땅 아래에. '가장 오래된 도시 아래에.'\""], ["p", "두 사람은 한동안 말이 없었다."], ["p", "\"그리고 하나 더.\""], ["p", "유나가 말했다."], ["p", "\"할아버지가 생전에 제일 자주 가던 데가 중앙도서관이었어. 지하 자료실. 엄마 말로는 거의 매일 갔대. 거기 관리하시는 분이랑 친구였다고.\""], ["p", "이안은 계단 아래를 내려다보았다. 별관 건물의 낡은 콘크리트 바닥. 그 아래에도, 또 그 아래에도, 무언가가 있을지 몰랐다."], ["p", "\"우리 가 보자.\""], ["p", "유나가 먼저 말했다."], ["p", "\"어디를?\""], ["p", "\"가장 오래된 도시. 오늘 학교 끝나고.\""], ["p", "이안은 대답 대신 가방을 끌어안았다. 책은 여전히 묵직했다. 그런데 이상하게도, 처음처럼 무섭지는 않았다."], ["p", "그렇게 두 사람의 첫 번째 탐험이 시작되었다."], ["p", "하지만 그들은 아직 몰랐다."], ["p", "그 지도가 단순한 지도가 아니라는 사실을."], ["p", "그리고 누군가가 이미 그들의 움직임을 지켜보고 있다는 사실도."], ["p", "별관 계단 위쪽 창문 너머, 맞은편 건물 옥상에 검은 새 한 마리가 앉아 있었다. 새는 두 사람이 계단을 내려갈 때까지 한 번도 움직이지 않았다. 그리고 그들이 사라지자, 소리 없이 하늘로 날아올랐다."], ["n", "제3장"], ["t", "지워진 역사"], ["p", "중앙도서관은 구시가지 한가운데에 있었다."], ["p", "석조 기둥이 늘어선 오래된 건물이었다. 정문 위에는 건물이 지어진 연도가 새겨져 있었지만 너무 닳아서 숫자를 알아볼 수 없었다. 계단 양옆에는 날개 달린 사자상이 앉아 있었는데, 한쪽 사자는 귀가 떨어져 나가 있었다."], ["p", "방과 후의 도서관은 조용했다. 시험공부를 하는 대학생 몇 명과 신문을 읽는 노인들이 있을 뿐이었다."], ["p", "두 사람은 안내 데스크에서 지하 자료실의 위치를 물었다. 직원은 둘을 위아래로 훑어보더니 귀찮은 듯 말했다."], ["p", "\"지하 자료실은 일반 열람이 안 돼요. 연구자 등록증이 있어야 하고요.\""], ["p", "\"관리하시는 분을 만나고 싶은데요. 저희 할아버지 친구분이세요.\""], ["p", "유나가 할아버지의 이름을 말하자, 직원의 표정이 조금 달라졌다. 직원은 내선 전화를 걸어 누군가와 짧게 통화했다. 그리고 수화기를 내려놓으며 말했다."], ["p", "\"계단으로 내려가세요. 맨 끝 방입니다.\""], ["s", ""], ["p", "지하로 내려가는 계단은 좁고 가팔랐다. 벽에는 오래된 도시의 사진들이 액자에 걸려 있었다. 아래로 내려갈수록 사진은 점점 오래된 것이 되었다. 흑백 사진, 누렇게 바랜 사진, 그리고 마지막에는 사진이 아닌 손으로 그린 그림이었다."], ["p", "\"꼭 시간을 거슬러 내려가는 것 같아.\""], ["p", "유나가 중얼거렸다."], ["p", "복도 끝의 철문을 열자, 공기가 달라졌다. 서늘하고 건조한 공기였다. 오래된 종이를 보관하기 위해 온도와 습도를 맞춰 둔 방이었다."], ["p", "그곳에는 수백 년 전의 신문과 지도, 오래된 건축 기록들이 보관되어 있었다. 금속 선반이 끝없이 늘어서 있었고, 선반마다 번호가 붙은 상자가 빼곡했다."], ["p", "\"윤 선생님?\""], ["p", "유나가 불렀다."], ["p", "선반 사이에서 한 남자가 나왔다. 육십 대쯤으로 보이는 남자였다. 회색 작업복 위에 카디건을 걸치고, 손에는 흰 면장갑을 끼고 있었다. 이마에 걸친 돋보기 안경 때문에 눈이 유난히 커 보였다."], ["p", "\"자네가 박 선생 손녀로구나. 장례식 때 봤었지. 많이 컸네.\""], ["p", "윤 관리인은 유나를 보며 잠시 웃었다. 하지만 곧 경계하는 눈빛으로 두 사람을 번갈아 보았다."], ["p", "\"그래, 여긴 무슨 일로 왔니?\""], ["p", "유나는 할아버지의 지도에 대해 이야기했다. 그리고 가장 오래된 도시, 구시가지 아래에 있었다는 옛 성곽 도시에 대한 기록을 보여 달라고 부탁했다."], ["p", "관리인은 처음에는 거절했다."], ["p", "\"그 시대 기록은 대부분 훼손돼서 보존 처리 중이란다. 학생들이 볼 만한 건 없어. 숙제라면 위층 향토 자료실에 정리된 책들이 있으니….\""], ["p", "\"숙제 아니에요.\""], ["p", "이안이 말했다."], ["p", "관리인이 이안을 보았다. 이안은 잠시 망설이다가, 가방에서 검은 책을 꺼냈다."], ["p", "관리인의 표정이 달라졌다."], ["p", "돋보기 안경이 이마에서 미끄러져 콧등에 걸렸다. 관리인은 그것을 고쳐 쓰지도 않은 채, 한참 동안 표지의 원을 바라보았다."], ["p", "\"이 책을 어디서 얻었지?\""], ["p", "목소리가 낮아져 있었다."], ["p", "\"그냥 오래된 책방에서요. 간판 없는.\""], ["p", "\"간판 없는 책방.\""], ["p", "관리인은 그 말을 천천히 따라 했다. 그리고 주변을 살폈다. 자료실에는 그들 셋뿐이었지만, 관리인은 철문까지 걸어가 문을 닫고 걸쇠를 걸었다."], ["p", "그리고 돌아와 조용히 말했다."], ["p", "\"이 책을 가진 사람이 다시 나타났군.\""], ["p", "이안은 놀랐다."], ["p", "\"저희 말고도 이 책을 아는 사람이 있어요?\""], ["p", "\"알던 사람이 있었지.\""], ["p", "관리인은 유나를 바라보았다."], ["p", "\"네 할아버지.\""], ["p", "유나가 숨을 들이켰다."], ["p", "\"할아버지가요?\""], ["p", "\"박 선생은 평생 그 책을 찾아다녔다. 직접 본 적은 한 번도 없었지만. 그 사람은 늘 이렇게 말했어. 그 책은 사람이 찾는 게 아니라, 책이 사람을 고른다고.\""], ["p", "관리인은 대답 대신 책상 서랍을 열었다. 열쇠로 잠긴 맨 아래 서랍이었다."], ["p", "그 안에는 얇은 종이 봉투 하나가 들어 있었다. 봉투 안에서 관리인은 낡은 사진 한 장을 꺼냈다. 장갑 낀 손가락이 아주 조심스럽게 사진의 가장자리만 잡았다."], ["p", "사진에는 탐험가 세 명이 서 있었다."], ["p", "모두 두꺼운 외투를 입고, 목에는 망원경과 나침반을 걸고 있었다. 뒤편으로는 바위투성이 해안과 거친 바다가 보였다."], ["p", "가운데에 선 사람은 키가 크고 수염을 기른 남자였다. 눈빛이 날카로웠고, 한 손에 둘둘 만 지도를 들고 있었다."], ["p", "\"이분이 에드먼드 로웰이다.\""], ["p", "관리인이 말했다."], ["p", "\"189년 전 북쪽 바다에서 사라진 탐험가지. 역사책에는 거의 나오지 않아. 누군가 일부러 지운 것처럼.\""], ["p", "에드먼드의 왼쪽에는 젊은 남자가 서 있었다. 둥근 안경을 쓰고, 품에 두꺼운 장부를 안고 있었다."], ["p", "이안은 그 얼굴을 보는 순간 숨이 멎을 뻔했다."], ["p", "훨씬 젊었다. 머리카락도 검었다. 하지만 둥근 안경 너머의 맑은 눈은 틀림없었다."], ["p", "\"이 사람….\""], ["p", "\"테오도르. 에드먼드의 조수였지.\""], ["p", "\"어제 책방에 있던 할아버지예요.\""], ["p", "관리인은 놀라지 않았다. 마치 그 말을 이미 예상하고 있었던 것처럼, 그저 천천히 고개를 끄덕였다."], ["p", "\"그럴 거라고 생각했다.\""], ["p", "유나가 사진의 세 번째 사람을 가리켰다."], ["p", "\"이 사람은요?\""], ["p", "에드먼드의 오른쪽에 선 세 번째 사람은 얼굴을 알아볼 수 없었다. 사진이 훼손된 것이 아니었다. 그 부분만 날카로운 것으로 긁어 낸 듯, 얼굴이 있어야 할 자리에 하얀 자국만 남아 있었다."], ["p", "\"아무도 모른다. 내가 이 사진을 받았을 때부터 이랬어.\""], ["p", "관리인은 사진을 뒤집었다."], ["p", "사진 뒷면에는 갈색 잉크로 날짜가 적혀 있었다."], ["p", "1837년."], ["p", "그리고 그 아래에는 또 다른 문장이 있었다."], ["p", "'첫 번째 세계의 문을 발견하다.'"], ["p", "\"첫 번째 세계….\""], ["p", "유나가 그 말을 따라 했다."], ["p", "이안은 다시 사진을 앞으로 돌렸다. 그리고 그제야 처음에는 보지 못했던 것을 발견했다."], ["p", "사진 속 세 사람의 뒤편, 해안 너머의 안개 속에 무언가가 서 있었다."], ["p", "거대한 건물이었다."], ["p", "건물의 형태는 현대의 어떤 건축물과도 달랐다. 기둥들은 위로 갈수록 굵어졌고, 창문들은 둥글게 휘어 있었다. 건물 전체가 바다 위에 떠 있는 것처럼 보였다."], ["p", "무엇보다 이상한 것은 건물 위쪽에 있었다."], ["p", "탑이 있었다. 그런데 탑은 하늘을 향해 솟아 있지 않았다. 뾰족한 끝이 아래를 향한 채, 거꾸로 매달려 있었다. 마치 하늘에 뿌리를 박고 땅을 향해 자라난 것처럼."], ["p", "유나는 휴대전화를 꺼내 허락을 구한 뒤 사진을 찍고 확대했다."], ["p", "\"저건 뭐지?\""], ["p", "관리인이 대답했다."], ["p", "\"그게 바로 지워진 역사야.\""], ["p", "\"지워진 역사요?\""], ["p", "\"사람들은 역사를 기록한다고 생각하지. 하지만 기록하지 않기로 한 것들도 있다. 기록하는 순간, 그것이 진짜가 되어 버리니까.\""], ["p", "관리인은 사진을 봉투에 다시 넣었다."], ["p", "\"박 선생이 지도에 빈칸을 남겨 둔 이유도 그거였다. 그곳을 그리면, 그곳이 정말로 생겨 버릴까 봐.\""], ["p", "이안은 손에 든 검은 책을 내려다보았다. 표지의 원이 지하실의 희미한 불빛을 받아 은색으로 빛나고 있었다."], ["p", "\"그럼 이 책은요? 이 책에는 글자가 저절로 생겨요.\""], ["p", "관리인은 한참 동안 대답하지 않았다."], ["p", "그리고 마침내 자료실의 가장 안쪽, 불이 켜지지 않은 어두운 구석을 바라보며 말했다."], ["p", "\"따라오너라. 보여 줄 것이 있다.\""], ["n", "제4장"], ["t", "세 번째 세계"], ["p", "관리인은 두 사람을 자료실 안쪽으로 데려갔다."], ["p", "선반과 선반 사이의 통로를 몇 번이나 꺾어 들어가자, 형광등이 닿지 않는 어두운 구석이 나왔다. 관리인은 주머니에서 작은 손전등을 꺼내 켰다."], ["p", "그곳에는 오래된 나무 책장이 하나 있었다."], ["p", "금속 선반들 사이에서 그 책장만 유독 낡아 보였다. 검게 변한 나무에는 덩굴 무늬가 새겨져 있었고, 모서리는 수많은 손길에 닳아 둥글어져 있었다."], ["p", "책장에는 아무것도 꽂혀 있지 않았다."], ["p", "\"자료실 한가운데에 빈 책장이라니. 이상하지?\""], ["p", "관리인이 말했다."], ["p", "\"이 도서관이 처음 지어질 때부터 여기 있던 거란다. 아니, 정확히는 도서관이 이 책장을 감싸며 지어졌다고 해야겠지.\""], ["p", "관리인은 책장의 가운데 칸, 덩굴 무늬가 원 모양으로 휘감긴 부분에 손바닥을 댔다. 그리고 천천히 눌렀다."], ["p", "딸깍."], ["p", "어딘가에서 작은 소리가 났다. 이어서 벽이 낮게 울리기 시작했다. 바닥에서 먼지가 피어올랐다. 책장이 통째로 안쪽으로 밀려 들어가더니, 옆으로 천천히 움직였다."], ["p", "이안과 유나는 입을 다물지 못했다."], ["p", "뒤쪽에는 작은 방이 있었다."], ["p", "천장이 낮고 둥근 방이었다. 벽은 도서관의 다른 곳과 달리 매끄러운 회색 돌로 되어 있었다. 오래된 공기 냄새가 났다. 수백 년 동안 아무도 숨 쉬지 않은 공기였다."], ["p", "\"여기가….\""], ["p", "\"옛 성곽 도시의 일부다. 지금 도시가 그 위에 덮이면서 거의 다 묻혔지만, 이 방만은 남았어. 박 선생과 내가 삼십 년 전에 처음 찾아냈지.\""], ["p", "방 중앙에는 둥근 돌판이 놓여 있었다."], ["p", "돌판은 식탁만 한 크기였다. 표면은 거울처럼 매끄러웠고, 그 위에 가는 선들이 새겨져 있었다."], ["p", "돌판에는 세 개의 원이 겹쳐져 있었다."], ["p", "첫 번째 원에는 땅이 그려져 있었다. 산과 들판, 작은 집들과 길. 세밀하게 새겨진 선들은 마치 살아 있는 풍경 같았다."], ["p", "두 번째 원에는 바다가 그려져 있었다. 물결 아래로 무언가 커다란 형체가 가라앉아 있었다. 도시처럼 보이기도 했고, 잠든 거대한 생물처럼 보이기도 했다."], ["p", "세 번째 원에는 아무것도 없었다."], ["p", "선 하나, 점 하나도 없이 매끈하게 비어 있었다. 유나의 할아버지가 지도에 남긴 빈 공간과 똑같았다."], ["p", "세 원이 겹치는 한가운데에는 작은 원 하나가 있었다. 검은 책의 표지와 같은 원이었다."], ["p", "\"이게 뭐예요?\""], ["p", "이안이 물었다."], ["p", "관리인은 손전등 빛을 돌판 위로 천천히 움직이며 대답했다."], ["p", "\"세 세계의 표시다.\""], ["p", "\"세 세계요?\""], ["p", "\"사람들은 자신들이 하나의 세계에 살고 있다고 생각하지. 하늘이 하나고, 땅이 하나고, 역사도 하나라고. 하지만 오래된 기록에는 세 개의 세계가 존재했다고 적혀 있다.\""], ["p", "그는 돌판을 가리켰다."], ["p", "\"첫 번째 세계는 우리가 살고 있는 땅이다. 눈으로 보고 손으로 만질 수 있는 세계.\""], ["p", "\"두 번째 세계는?\""], ["p", "유나가 물었다."], ["p", "\"사라진 세계.\""], ["p", "관리인은 두 번째 원의 가라앉은 형체를 손끝으로 짚었다."], ["p", "\"아주 오래전에는 첫 번째 세계와 두 번째 세계가 이어져 있었다고 한다. 사람들이 두 세계를 자유롭게 오갔다고. 그런데 어느 날 두 번째 세계가 사라졌어. 정확히는, 아무도 그곳을 볼 수 없게 되었지.\""], ["p", "이안은 책에 나타났던 문장을 떠올렸다."], ["p", "'도시는 사라진 적이 없다. 사람들이 도시를 볼 수 없게 되었을 뿐이다.'"], ["p", "\"그럼 세 번째는요?\""], ["p", "관리인은 잠시 침묵했다. 손전등 빛이 텅 빈 세 번째 원 위에서 멈췄다."], ["p", "\"아무도 모른다.\""], ["p", "\"기록이 없어요?\""], ["p", "\"기록이 없는 게 아니라, 기록할 수 없었던 거지. 박 선생은 평생 그 원을 연구했다. 그리고 죽기 얼마 전에 나한테 이런 말을 했어. 세 번째 원은 비어 있는 게 아니라 기다리고 있는 거라고.\""], ["p", "\"뭘 기다리는데요?\""], ["p", "\"그건 말하지 않았다. 아니, 몰랐던 것 같다.\""], ["p", "방 안이 조용해졌다. 손전등 빛 속에서 먼지가 천천히 떠다녔다."], ["p", "그 순간, 이안의 가방 속에서 검은 책이 흔들렸다."], ["p", "처음에는 휴대전화가 진동하는 줄 알았다. 하지만 떨림은 점점 강해졌다. 가방 전체가 덜덜 떨렸다. 이안은 서둘러 책을 꺼냈다."], ["p", "책은 이안의 손 위에서 저절로 열렸다."], ["p", "페이지들이 바람에 날리듯 넘어갔다. 그리고 지금까지 아무것도 적혀 있지 않던 한 페이지에서 멈췄다."], ["p", "글자가 떠오르고 있었다. 종이 아래에서 위로 스며 나오듯, 한 획 한 획 천천히."], ["p", "'세 번째 세계는 사라진 것이 아니다. 아직 만들어지지 않았을 뿐이다.'"], ["p", "그와 동시에 돌판의 한가운데, 세 원이 겹치는 작은 원이 희미하게 빛나기 시작했다."], ["p", "관리인의 얼굴이 굳어졌다."], ["p", "\"박 선생 말이 맞았군.\""], ["p", "그는 낮게 중얼거렸다."], ["p", "\"이 책이 너희에게 말을 걸고 있구나.\""], ["p", "\"무슨 뜻이에요?\""], ["p", "이안의 목소리가 조금 떨렸다."], ["p", "관리인은 대답하지 않고 돌판의 세 번째 원을 바라보았다. 빈 원 위로, 돌판 가운데에서 퍼져 나온 빛이 아주 조금씩 번지고 있었다."], ["p", "\"이 돌판은 삼십 년 동안 한 번도 빛난 적이 없었다.\""], ["p", "관리인이 말했다."], ["p", "\"그런데 지금 빛나고 있어. 그렇다면 시간이 얼마 남지 않았다는 뜻이지.\""], ["p", "\"무슨 시간이요?\""], ["p", "\"문이 열릴 시간. 혹은 닫힐 시간.\""], ["s", ""], ["p", "관리인은 두 사람을 다시 자료실로 데리고 나왔다. 책장이 제자리로 돌아가자 돌판의 빛도 보이지 않게 되었다."], ["p", "관리인은 한동안 책상 앞에 앉아 생각에 잠겨 있었다. 그러다가 결심한 듯 일어나 선반 하나로 갔다. 맨 위 칸에서 그는 끈으로 묶은 서류 뭉치를 꺼냈다."], ["p", "\"이건 박 선생이 남긴 거다. 에드먼드 로웰의 탐험 기록 중 남아 있는 일부를 옮겨 적은 거지. 원본은 오래전에 사라졌고.\""], ["p", "서류의 첫 장에는 유나의 할아버지 글씨로 제목이 적혀 있었다."], ["p", "'북쪽 산맥 경로 — 첫 번째 문으로 가는 길.'"], ["p", "유나는 할아버지의 글씨를 손가락으로 천천히 쓸어 보았다."], ["p", "\"할아버지는 왜 직접 가지 않으셨어요?\""], ["p", "\"가려고 했지. 몇 번이나. 하지만 길이 열리지 않았어. 박 선생은 그게 자기에게 책이 없어서라고 생각했다.\""], ["p", "관리인은 서류를 유나에게 건넸다."], ["p", "\"지금 너희에게 이걸 주는 게 옳은 일인지 나는 모르겠다. 하지만 책이 너희를 골랐다면, 내가 막는다고 멈출 일도 아니겠지.\""], ["p", "\"저희가 가야 한다고 생각하세요?\""], ["p", "이안이 물었다."], ["p", "관리인은 이안을 오래 바라보았다."], ["p", "\"나는 네가 어떻게 해야 한다고 말할 수 없다. 그건 네가 정할 일이야. 다만 하나만 약속해 다오.\""], ["p", "\"뭘요?\""], ["p", "\"혼자 가지 마라. 그리고 가게 되면, 나한테 먼저 말하고 가라.\""], ["p", "이안과 유나는 고개를 끄덕였다."], ["p", "도서관을 나섰을 때, 밖은 이미 어두워져 있었다. 비는 그쳤고, 젖은 거리에 가로등 불빛이 번져 있었다."], ["p", "두 사람은 한참 동안 말없이 걸었다."], ["p", "\"무서워?\""], ["p", "유나가 먼저 물었다."], ["p", "\"조금.\""], ["p", "\"나도.\""], ["p", "유나는 가방 속의 서류 뭉치를 꼭 끌어안았다."], ["p", "\"근데 이상하게, 할아버지가 옆에 있는 것 같아.\""], ["n", "제5장"], ["t", "움직이는 별"], ["p", "그날 밤, 이안은 잠을 이루지 못했다."], ["p", "침대에 누워 천장을 바라보았다. 낮에 본 것들이 머릿속에서 끝없이 맴돌았다. 거꾸로 매달린 탑, 얼굴이 긁혀 나간 사진, 빛나기 시작한 돌판."], ["p", "그리고 세 번째 세계."], ["p", "'아직 만들어지지 않았을 뿐이다.'"], ["p", "만들어지지 않은 세계라니. 세계가 만들어진다는 건 대체 무슨 뜻일까. 누가 만드는 걸까. 언제?"], ["p", "이안은 결국 몸을 일으켰다. 시계는 새벽 한 시를 가리키고 있었다. 거실은 조용했다. 엄마는 야간 근무라 아침에야 돌아올 것이다."], ["p", "창문을 열자 차가운 공기가 밀려들었다. 비가 그친 하늘은 유난히 맑았다. 도시의 불빛 때문에 평소에는 별이 잘 보이지 않았는데, 오늘은 이상하게 별들이 선명했다."], ["p", "창밖에는 별들이 떠 있었다."], ["p", "그런데 별 하나가 이상했다."], ["p", "북쪽 하늘, 낮은 산등성이 바로 위에 떠 있는 별이었다. 다른 별들은 제자리에 박혀 있는데, 유독 그 별 하나만 천천히 이동하고 있었다."], ["p", "처음에는 비행기라고 생각했다. 하지만 비행기라면 빨간 불빛이 깜빡여야 했다. 그 별은 깜빡이지 않았다. 하얗고 고요한 빛으로, 아주 천천히 하늘을 가로지르고 있었다."], ["p", "인공위성일까? 이안은 과학 시간에 배운 것을 떠올리려 애썼다. 인공위성은 일정한 방향으로 곧게 움직인다고 했다."], ["p", "그런데 그 별은 곧게 움직이지 않았다. 원을 그리고 있었다. 아주 큰 원을."], ["p", "이안은 옷장 위에서 먼지 쌓인 망원경을 꺼냈다. 초등학교 때 생일 선물로 받은 장난감 망원경이었다. 몇 번 달을 보다가 그 뒤로는 한 번도 꺼내지 않았던."], ["p", "삼각대를 창틀에 겨우 고정하고, 렌즈를 닦고, 초점을 맞췄다."], ["p", "별이 렌즈 안으로 들어왔다."], ["p", "별은 점점 밝아졌다."], ["p", "아니, 밝아지는 게 아니라 커지고 있었다. 가까워지고 있는 것이다. 빛의 가장자리가 흔들렸다. 물에 비친 달처럼."], ["p", "이안은 숨을 죽였다. 빛의 한가운데에 무언가가 보였다. 아주 작고 가는 선. 원 하나."], ["p", "그리고 갑자기, 별이 사라졌다."], ["p", "꺼진 것이 아니었다. 처음부터 거기 없었던 것처럼, 한순간에 사라졌다."], ["p", "이안은 망원경에서 눈을 떼고 맨눈으로 하늘을 보았다. 별이 있던 자리는 그냥 어두운 밤하늘이었다."], ["p", "다음 순간, 등 뒤에서 종이 넘어가는 소리가 들렸다."], ["p", "이안은 천천히 돌아보았다."], ["p", "책상 위에 놓아 둔 검은 책이 펼쳐져 있었다. 스탠드 불빛 아래에서, 하얀 페이지 위로 글자가 떠오르고 있었다."], ["p", "이안은 책상으로 다가갔다."], ["p", "새로운 페이지가 나타나 있었다."], ["p", "'첫 번째 열쇠는 하늘에 있지 않다.'"], ["p", "'별은 별이 아니다.'"], ["p", "'그것은 누군가가 남긴 표시다.'"], ["p", "이안은 그 세 문장을 몇 번이나 읽었다. 그리고 프롤로그처럼 떠오르는 다른 문장 하나를 기억해 냈다. 관리인이 보여 준 서류의 첫 장, 에드먼드가 조수에게 남겼다는 편지."], ["p", "'절대로 하늘을 믿지 말라.'"], ["p", "이안은 다시 창가로 갔다."], ["p", "멀리 떨어진 북쪽 산 위에서 작은 불빛이 깜빡이고 있었다. 별이 사라진 바로 그 아래쪽이었다."], ["p", "세 번."], ["p", "잠시 멈추고."], ["p", "두 번."], ["p", "다시 세 번."], ["p", "그리고 한참 동안 어둠. 그러고는 다시, 세 번, 두 번, 세 번."], ["p", "규칙적인 신호였다. 누군가 손전등이나 등불로 보내는 신호 같았다."], ["p", "이안은 이상하게도 그 신호가 자신에게 보내는 것이라고 생각했다. 근거는 없었다. 하지만 그 불빛이 깜빡일 때마다, 가슴 한가운데가 같은 박자로 두근거렸다."], ["p", "삼, 이, 삼."], ["p", "그때 휴대전화가 울렸다."], ["p", "새벽 한 시 반이었다. 화면에 유나의 이름이 떠 있었다."], ["p", "\"여보세요?\""], ["p", "\"너도 봤어?\""], ["p", "유나의 목소리는 숨이 차 있었다."], ["p", "\"뭘?\""], ["p", "\"하늘에서 움직이는 별.\""], ["p", "이안은 대답하지 못했다. 손에 쥔 휴대전화가 조금 미끄러웠다."], ["p", "\"봤구나.\""], ["p", "유나가 말했다."], ["p", "\"나 잠이 안 와서 할아버지 서류 보고 있었거든. 그러다 창문 밖을 봤는데, 별 하나가 원을 그리면서 움직이는 거야. 그러다 갑자기 사라졌어.\""], ["p", "\"나도 봤어. 망원경으로.\""], ["p", "\"망원경? 너 그런 것도 있어?\""], ["p", "\"장난감이야. 근데 별 안에 원이 있었어.\""], ["p", "수화기 너머가 조용해졌다."], ["p", "\"그리고 지금 북쪽 산에서 불빛이 깜빡이고 있어. 삼, 이, 삼.\""], ["p", "\"잠깐만.\""], ["p", "종이 넘기는 소리가 들렸다. 유나가 서류를 뒤지고 있었다."], ["p", "\"찾았다. 이안, 그 별, 지도에 있어.\""], ["p", "\"뭐라고?\""], ["p", "\"할아버지 지도 말이야. 우리 지도에 그려진 원. 내가 지도를 우리 동네 위성 사진이랑 겹쳐 봤거든. 해안선은 하나도 안 맞는데, 이상하게 산맥 모양만은 맞아. 북쪽 산맥. 그리고 오늘 별이 사라진 위치가, 지도의 원이랑 정확히 같은 위치에 있어.\""], ["p", "이안은 창밖의 북쪽 산을 바라보았다. 불빛은 여전히 깜빡이고 있었다."], ["p", "\"그리고 하나 더 있어.\""], ["p", "유나의 목소리가 낮아졌다."], ["p", "\"할아버지 서류에 에드먼드가 쓴 문장이 있어. 읽어 줄게. '산에서 불빛을 보거든 그 수를 세어라. 숫자가 길을 알려 줄 것이다. 셋, 둘, 셋.'\""], ["p", "두 사람은 한동안 아무 말도 하지 않았다. 전화기 너머로 유나의 숨소리만 들렸다."], ["p", "\"이건 우연이 아니야.\""], ["p", "유나가 말했다."], ["p", "\"응.\""], ["p", "\"가야 할 것 같아.\""], ["p", "\"응.\""], ["p", "\"윤 선생님한테 먼저 말하기로 했잖아.\""], ["p", "\"내일 아침에 같이 가자.\""], ["p", "그날 밤 두 사람은 다음 목적지를 정했다."], ["p", "북쪽 산맥."], ["p", "그곳에서 첫 번째 열쇠를 찾기로 했다."], ["p", "전화를 끊은 뒤에도 이안은 오랫동안 창가에 서 있었다. 불빛은 새벽 네 시가 되어서야 꺼졌다. 마지막 신호가 끝나자, 산은 다시 어둠 속으로 잠겼다."], ["s", ""], ["p", "다음 날은 개교기념일이라 학교에 가지 않는 날이었다. 2026년 11월 25일, 수요일."], ["p", "두 사람은 아침 일찍 도서관을 찾아갔다. 윤 관리인은 두 사람의 이야기를 끝까지 듣고 나서 한숨을 쉬었다."], ["p", "\"결국 그렇게 되는구나.\""], ["p", "그는 반대하지 않았다. 대신 몇 가지를 단단히 일렀다. 산 입구까지는 자신이 차로 데려다줄 것. 해가 지기 전에 반드시 연락할 것. 무전기를 가지고 갈 것. 그리고 위험하다고 느끼면 무조건 돌아올 것."], ["p", "\"부모님께는?\""], ["p", "\"엄마한테는 유나네 할아버지 댁 정리 도와드리러 산 쪽에 간다고 말씀드렸어요. 윤 선생님이랑 같이 간다고요.\""], ["p", "이안이 말했다. 거짓말은 아니었다. 전부가 아닐 뿐."], ["p", "관리인은 고개를 끄덕이고, 창고에서 낡은 배낭 두 개를 꺼내 왔다. 그 안에는 손전등과 비상식량, 담요, 밧줄, 그리고 오래된 놋쇠 나침반이 들어 있었다."], ["p", "\"박 선생 거다. 결국 한 번도 제대로 쓰지 못했지.\""], ["p", "유나는 나침반을 손에 쥐었다. 뚜껑 안쪽에 할아버지의 이름이 새겨져 있었다."], ["p", "차는 도시를 빠져나와 북쪽으로 달렸다. 아파트 단지가 사라지고, 논밭이 나타나고, 그러다 길은 점점 좁아지며 산으로 이어졌다."], ["p", "이안은 창밖을 보며 가방 속의 책을 만져 보았다."], ["p", "책은 따뜻했다. 마치 오래 기다린 길을 마침내 떠나는 사람처럼."], ["n", "제6장"], ["t", "북쪽 산맥"], ["p", "북쪽 산맥은 지도에도 제대로 표시되지 않은 곳이었다."], ["p", "정확히는, 지도마다 다르게 표시된 곳이었다. 어떤 지도에는 봉우리가 다섯 개였고, 어떤 지도에는 일곱 개였다. 어떤 지도는 아예 그 일대를 국립공원 보호 구역이라고만 적고 등고선을 그리지 않았다."], ["p", "산으로 향하는 길은 오래전에 폐쇄되었다."], ["p", "차가 멈춘 곳은 녹슨 철문 앞이었다. 철문에는 '출입 금지 — 낙석 위험'이라는 표지판이 붙어 있었는데, 글씨가 거의 지워져 있었다. 철문 옆으로 사람 하나가 겨우 지나갈 만한 틈이 나 있었다."], ["p", "\"나는 여기서 기다리마.\""], ["p", "윤 관리인이 말했다."], ["p", "\"해가 지기 전에 연락해라. 무전이 안 되면 바로 내려오고.\""], ["p", "\"네.\""], ["p", "관리인은 잠시 무언가를 더 말하려다가, 결국 이안의 어깨만 한 번 두드렸다."], ["p", "두 사람은 철문 틈으로 들어섰다."], ["s", ""], ["p", "길은 생각보다 험하지 않았다. 오래 방치되었지만, 누군가 가끔 다닌 것처럼 길의 윤곽이 남아 있었다. 낙엽이 발목까지 쌓여 있었고, 키 큰 소나무 사이로 십일월의 햇빛이 비스듬히 들어왔다."], ["p", "유나는 할아버지의 서류를 펼치고 앞장섰다. 서류에는 에드먼드의 기록을 옮긴 길 안내가 적혀 있었다."], ["p", "'개울을 건너 서쪽으로. 쓰러진 나무 세 그루를 지나면 첫 번째 바위가 있다.'"], ["p", "정말로 개울이 있었다. 쓰러진 나무도 세 그루 있었다. 백팔십구 년이 지났는데도."], ["p", "\"이상해.\""], ["p", "유나가 말했다."], ["p", "\"뭐가?\""], ["p", "\"나무가 쓰러진 지 이백 년이 지났으면 벌써 다 썩어서 흙이 됐어야 하잖아. 근데 이거 봐. 꼭 작년에 쓰러진 것 같아.\""], ["p", "이안은 쓰러진 나무의 껍질을 만져 보았다. 이끼가 조금 끼어 있었을 뿐, 나무는 단단했다."], ["p", "그리고 산에는 이상한 바위들이 많았다."], ["p", "처음 나타난 바위는 이안의 키만 했다. 둥글고 매끈한 회색 바위였다. 그 표면에 작은 숫자 하나가 새겨져 있었다."], ["p", "1."], ["p", "조금 더 올라가자 두 번째 바위가 나왔다. 2. 그리고 3, 4."], ["p", "바위들은 숲 속에 흩어져 있었지만, 숫자를 따라가면 하나의 길이 되었다. 누군가 아주 오래전에 길을 표시해 둔 것이다."], ["p", "5, 6, 7, 8, 9, 10."], ["p", "열 번째 바위는 작은 공터 한가운데에 있었다. 다른 바위들보다 두 배는 컸고, 꼭대기가 평평했다."], ["p", "그런데 숫자는 어느 순간부터 거꾸로 이어졌다."], ["p", "공터 맞은편, 숲으로 다시 이어지는 길에 바위가 하나 더 있었다. 그 바위에는 10이 적혀 있었다. 그 다음 바위에는 9. 그리고 8, 7."], ["p", "\"올라갔다가 다시 내려가는 거야?\""], ["p", "유나가 서류를 뒤적였다."], ["p", "\"여기서 갈림길이 생기는 것 같아. 할아버지가 써 놓은 게 있어. '숫자가 거꾸로 흐르기 시작하면, 신호를 따르라.'\""], ["p", "\"삼, 이, 삼.\""], ["p", "이안이 말했다."], ["p", "두 사람은 거꾸로 이어지는 바위들을 살폈다. 10에서 7까지 내려온 뒤, 길은 세 갈래로 갈라졌다. 각 갈래의 입구에도 바위가 하나씩 있었다. 그런데 그 바위들에는 숫자 대신 작은 홈이 파여 있었다. 한 바위에는 홈이 하나, 다른 바위에는 둘, 또 다른 바위에는 셋."], ["p", "\"세 번째 길로 가고, 다음엔 두 번째, 그 다음엔 다시 세 번째.\""], ["p", "이안의 말에 유나가 고개를 끄덕였다."], ["p", "두 사람은 홈이 셋 파인 바위가 지키는 길로 들어섰다."], ["p", "길은 점점 가팔라졌다. 나무들의 모양이 조금씩 달라지기 시작했다. 줄기가 나선형으로 꼬여 있었고, 잎은 계절에 맞지 않게 푸르렀다. 공기에서는 비 냄새와 쇠 냄새가 섞여 났다."], ["p", "두 번째 갈림길에서는 홈이 둘인 길을, 세 번째 갈림길에서는 다시 홈이 셋인 길을 골랐다."], ["p", "마지막 길 끝에는 바위 하나가 서 있었다."], ["p", "다른 바위들과 달랐다. 검고, 표면이 유리처럼 반들거렸다. 그리고 거기에는 숫자 대신 원 하나가 새겨져 있었다."], ["p", "\"누가 이런 걸 만든 걸까?\""], ["p", "유나가 숨을 고르며 물었다."], ["p", "\"에드먼드?\""], ["p", "\"아니면 에드먼드보다 훨씬 전의 누군가.\""], ["p", "이안은 바위에 손을 댔다."], ["p", "그 순간 머릿속에서 낯선 장면이 스쳐 지나갔다."], ["p", "하얀 도시."], ["p", "모든 건물이 하얀 돌로 지어진 도시였다. 지붕도, 길도, 다리도 모두 하얬다. 너무 하얘서 눈이 부셨다."], ["p", "검은 하늘."], ["p", "그 위로 펼쳐진 하늘은 칠흑처럼 검었다. 별도 달도 없었다. 그런데도 도시는 환했다. 빛이 하늘에서가 아니라 땅에서, 도시 자체에서 나오고 있었다."], ["p", "그리고 수많은 사람들이 같은 방향을 바라보고 있었다."], ["p", "광장에, 지붕 위에, 다리 위에. 수천, 수만 명의 사람들이 모두 한쪽을 향해 서 있었다. 아무도 말하지 않았다. 아무도 움직이지 않았다."], ["p", "그들은 모두 무언가를 기다리고 있었다."], ["p", "이안은 그들이 바라보는 방향으로 고개를 돌리려 했다. 그런데 그 순간 장면이 깨졌다. 유리가 부서지듯."], ["p", "\"이안! 이안!\""], ["p", "이안이 정신을 차렸을 때, 유나가 그의 어깨를 흔들고 있었다. 이안은 바위 앞에 주저앉아 있었다."], ["p", "\"괜찮아? 갑자기 눈을 뜬 채로 멍하게 서 있었어. 불러도 대답도 없고.\""], ["p", "\"얼마나?\""], ["p", "\"일 분? 이 분?\""], ["p", "이안에게는 한 시간도 넘게 느껴졌다."], ["p", "\"도시를 봤어. 하얀 도시. 사람들이 다 같은 쪽을 보고 있었어.\""], ["p", "유나는 무언가 말하려다가 바위를 보고 입을 다물었다."], ["p", "바위에는 새로운 글자가 나타나 있었다. 원 아래쪽에, 빛나는 선으로."], ["p", "'기억은 길을 만든다.'"], ["s", ""], ["p", "두 사람은 바위 주위를 샅샅이 살폈다. 그리고 바위 밑동, 두 개의 돌 틈 사이에서 무언가 반짝이는 것을 발견했다."], ["p", "유나가 손을 넣어 꺼냈다."], ["p", "작은 금속 조각이었다. 손바닥 길이만 했고, 오래된 은처럼 희뿌연 빛을 띠었다."], ["p", "그것은 열쇠 모양이었다."], ["p", "손잡이 부분은 둥근 고리였고, 그 고리 안에 숫자 1이 새겨져 있었다. 몸통은 길고 가늘었으며 끝에는 톱니 모양의 이가 나 있었다."], ["p", "하지만 열쇠에는 구멍이 없었다. 보통 열쇠라면 고리에 끈을 꿸 구멍이 있어야 했다. 이 열쇠는 처음부터 어디에도 매달리지 않도록 만들어진 것 같았다."], ["p", "유나는 열쇠를 뒤집었다."], ["p", "뒷면에는 작은 문장이 적혀 있었다."], ["p", "'문을 열려면 문이 어디 있는지 먼저 잊어야 한다.'"], ["p", "\"이게 무슨 말이지?\""], ["p", "\"모르겠어. 근데 이게 첫 번째 열쇠인 건 확실해.\""], ["p", "이안은 책을 꺼냈다. 책은 열쇠를 알아본 것처럼 스스로 펼쳐졌다. 빈 페이지에 그림 하나가 그려지고 있었다. 지금 그들이 서 있는 검은 바위, 그리고 그 아래에서 빛나는 작은 열쇠."], ["p", "그 아래에 글이 적혔다."], ["p", "'첫 번째 열쇠. 북쪽 산맥.'"], ["p", "\"책이 우리를 기록하고 있어.\""], ["p", "유나가 속삭였다."], ["p", "그때 산 아래쪽에서 종소리가 들렸다."], ["p", "깊고 낮은 종소리였다. 교회 종소리와는 달랐다. 땅속 깊은 곳에서 울려 나오는 것 같았다."], ["p", "한 번."], ["p", "두 번."], ["p", "세 번."], ["p", "이안은 무전기를 꺼냈다."], ["p", "\"윤 선생님, 들리세요? 열쇠를 찾았어요.\""], ["p", "지직거리는 잡음만 돌아왔다."], ["p", "\"윤 선생님?\""], ["p", "잡음. 그리고 아주 희미하게, 관리인의 목소리가 섞여 들어왔다. 말은 알아들을 수 없었다. 단 한 단어만 겨우 들렸다."], ["p", "\"…안개….\""], ["p", "그리고 산 전체가 희미하게 흔들리기 시작했다."], ["p", "발밑의 땅이 떨렸다. 나무들이 일제히 흔들리며 낙엽을 쏟아 냈다. 두 사람은 서로의 팔을 붙잡았다."], ["p", "산 아래에서부터 하얀 안개가 밀려 올라오고 있었다. 순식간이었다. 안개는 나무를 삼키고, 바위를 삼키고, 두 사람의 발목을, 무릎을, 허리를 삼켰다."], ["p", "\"이안!\""], ["p", "\"손 놓지 마!\""], ["p", "안개 속에서 아무것도 보이지 않았다. 바로 옆에 있는 유나의 얼굴조차. 오직 붙잡은 손의 감촉만이 남아 있었다."], ["p", "종소리가 한 번 더 울렸다. 이번에는 바로 귓가에서."], ["p", "그리고 이안은 발밑의 땅이 사라지는 것을 느꼈다."], ["p", "떨어지는 것이 아니었다. 오히려 떠오르는 것에 가까웠다. 위아래가 뒤섞이고, 앞뒤가 사라지고, 시간마저 잠시 멈춘 것 같은 감각."], ["p", "그 속에서 이안은 첫 페이지의 문장을 떠올렸다."], ["p", "'이 책을 발견한 사람은 이미 첫 번째 문을 지나왔다.'"], ["p", "그리고 열쇠 뒷면의 문장을."], ["p", "'문을 열려면 문이 어디 있는지 먼저 잊어야 한다.'"], ["p", "이안은 눈을 감았다. 돌아갈 길이 어느 쪽인지 생각하지 않기로 했다. 그저 유나의 손을 꽉 쥐었다."], ["p", "안개가 걷혔을 때, 두 사람은 낯선 능선 위에 서 있었다."], ["p", "해는 조금 전보다 훨씬 높이 떠 있었다. 하늘은 너무 파래서 보랏빛이 돌았다. 그리고 산 아래, 그들이 올라온 쪽에는 철문도, 관리인의 차도, 아스팔트 길도 보이지 않았다."], ["p", "대신 넓은 골짜기 하나가 펼쳐져 있었다."], ["p", "골짜기 한가운데에, 작은 마을이 있었다."], ["n", "제7장"], ["t", "아무도 늙지 않는 마을"], ["p", "산맥을 내려가자 작은 마을이 나타났다."], ["p", "능선에서 골짜기까지는 생각보다 멀었다. 위에서 볼 때는 금방 닿을 것 같았는데, 걸어도 걸어도 마을은 같은 크기로 보였다. 마치 마을이 그들이 다가오는 만큼 뒤로 물러나는 것 같았다."], ["p", "\"우리 지금 어디 있는 걸까?\""], ["p", "유나가 물었다. 손에 쥔 할아버지의 나침반은 바늘이 미친 듯이 돌고 있었다."], ["p", "\"모르겠어. 근데 우리가 사는 데는 확실히 아니야.\""], ["p", "이안은 하늘을 올려다보았다. 보랏빛이 도는 하늘 한쪽에 낮달이 떠 있었다. 그런데 달의 모양이 이상했다. 둥근 달의 가장자리에 아주 가는 고리 같은 것이 걸쳐 있었다."], ["p", "무전기는 완전히 먹통이었다. 휴대전화도 마찬가지였다. 화면 위쪽에는 '서비스 없음'이라는 글자가 떠 있었고, 시계는 오후 두 시 십칠 분에서 멈춰 있었다."], ["p", "\"시간이 멈췄어.\""], ["p", "\"배터리가 나간 거 아니야?\""], ["p", "\"배터리는 칠십 퍼센트야.\""], ["p", "마침내 골짜기 바닥에 닿았을 때, 마을은 갑자기 가까이 있었다. 마치 그들이 충분히 걸었다고 마을이 인정해 준 것처럼."], ["p", "마을에는 사람들이 살고 있었다."], ["p", "이상한 것은 마을의 모습이었다."], ["p", "집들은 오래되어 보였다. 지붕은 이끼 낀 기와였고, 벽은 손으로 쌓은 돌벽이었다. 문틀은 비바람에 닳아 둥글어져 있었다. 수백 년은 된 집들이었다."], ["p", "그런데 거리에는 먼지가 없었다."], ["p", "돌로 포장된 길 위에 낙엽 하나 굴러다니지 않았다. 담장 아래에 잡초 하나 자라지 않았다. 창문 유리는 방금 닦은 것처럼 깨끗했다."], ["p", "나무들은 무성했지만, 가지가 하나도 부러져 있지 않았다. 잎은 모두 같은 초록이었다. 시든 잎도, 새로 난 연한 잎도 없었다."], ["p", "\"꼭 그림 같아.\""], ["p", "유나가 말했다."], ["p", "\"아니, 사진 같아. 누가 찍어 놓은 순간에 우리가 들어온 것처럼.\""], ["p", "마을 사람들은 모두 같은 옷을 입고 있었다. 회색빛이 도는 긴 웃옷에 짙은 허리띠. 남자도 여자도, 어른도 아이도."], ["p", "그들은 평범하게 생활하고 있었다. 빨래를 널고, 우물에서 물을 긷고, 문 앞에 앉아 바구니를 엮었다. 아이들은 골목에서 공놀이를 했다."], ["p", "그런데 무엇보다 이상한 것은 그들의 나이였다."], ["p", "아니, 정확히는 그들의 나이가 아무것도 말해 주지 않는다는 점이었다."], ["p", "아이들은 아이의 모습 그대로였고, 노인들은 노인의 모습 그대로였다. 그건 당연한 일이었다. 그런데 이안은 우물가에 앉은 할머니를 보다가 이상한 느낌을 받았다. 그 할머니는 바구니를 엮고 있었는데, 손이 움직이는데도 바구니는 조금도 커지지 않았다. 같은 매듭을, 같은 자리에서, 끝없이 다시 묶고 있었다."], ["p", "공놀이하는 아이들도 마찬가지였다. 공은 늘 같은 높이로 떠올랐다가 같은 자리에 떨어졌다. 아이들은 같은 소리로 웃었다."], ["p", "마치 시간이 멈춘 것처럼."], ["p", "아니, 시간이 한 바퀴를 돌아 제자리로 돌아오기를 영원히 반복하는 것처럼."], ["p", "\"이안.\""], ["p", "유나가 이안의 소매를 잡아당겼다."], ["p", "\"저 사람들, 우리를 안 봐.\""], ["p", "정말이었다. 이방인 두 명이 커다란 배낭을 메고 마을 한가운데를 걸어가는데, 아무도 고개를 돌리지 않았다. 우물가의 할머니도, 빨래를 너는 아주머니도, 공놀이하는 아이들도."], ["p", "그런데 그때, 한 사람이 그들을 보았다."], ["p", "골목 끝에서 한 소녀가 걸어오고 있었다."], ["p", "열두세 살쯤 되어 보였다. 다른 마을 사람들처럼 회색 웃옷을 입고 있었지만, 허리띠 대신 가는 은색 줄을 매고 있었다. 머리카락은 길고 검었으며, 한쪽 귀 뒤에 작은 하얀 꽃을 꽂고 있었다."], ["p", "소녀의 눈은 똑바로 이안과 유나를 향해 있었다."], ["p", "두 사람이 마을에 들어선 것을 처음부터 알고 있었다는 듯, 소녀는 망설임 없이 다가왔다. 그리고 두 사람 앞에 멈춰 서서 활짝 웃었다."], ["p", "\"드디어 왔네요.\""], ["p", "유나가 물었다."], ["p", "\"우리를 알아요?\""], ["p", "소녀는 고개를 끄덕였다."], ["p", "\"당연하죠. 여러분은 오래전부터 기다리던 사람들이니까요.\""], ["p", "\"얼마나 오래요?\""], ["p", "\"음.\""], ["p", "소녀는 손가락을 꼽아 보려다가 웃으며 그만두었다."], ["p", "\"이 마을에서는 그런 걸 세기가 어려워요. 그냥, 아주 오래요. 제 이름은 리아예요.\""], ["p", "\"난 유나. 이쪽은 이안.\""], ["p", "\"알아요.\""], ["p", "리아는 이안을 바라보았다. 아니, 정확히는 이안의 가방을 바라보았다."], ["p", "이안은 검은 책을 꺼냈다."], ["p", "리아는 책을 보자 웃었다. 오랜 친구를 다시 만난 사람처럼, 조금 반갑고 조금 슬픈 웃음이었다."], ["p", "\"그 책은 아직도 가지고 있네요.\""], ["p", "\"당신은 이 책을 알아요?\""], ["p", "리아는 손을 뻗어 표지의 원을 손끝으로 살짝 만졌다. 원이 은색으로 빛났다."], ["p", "\"제가 썼으니까요.\""], ["p", "두 사람은 아무 말도 하지 못했다."], ["p", "소녀는 자신이 책을 썼다고 했다."], ["p", "그런데 책은 수백 년 전부터 존재한 것처럼 보였다. 에드먼드와 테오도르보다도 오래된 것처럼."], ["p", "\"정확히는 첫 페이지만이요.\""], ["p", "리아가 덧붙였다."], ["p", "\"'이 책을 발견한 사람은 이미 첫 번째 문을 지나왔다.' 그건 제 글씨예요. 이 책은 한 사람이 쓴 게 아니에요. 책을 가졌던 사람들이 한 장씩, 한 줄씩 이어서 써 온 거죠.\""], ["p", "\"그럼 그 뒤에 나타난 글자들은요? '첫 번째 장소는 가장 오래된 도시 아래에 있다', '세 번째 세계는 아직 만들어지지 않았을 뿐이다', 그런 거요.\""], ["p", "\"그건 다른 사람들 글씨겠죠. 책은 필요할 때, 필요한 문장을 보여 줘요. 그 문장을 언제 누가 썼는지는 중요하지 않아요. 이 책 안에서는 과거와 미래가 같은 페이지에 있으니까.\""], ["p", "리아는 몸을 돌려 마을 중앙을 가리켰다."], ["p", "\"따라오세요. 보여 줄 게 있어요.\""], ["s", ""], ["p", "마을 중앙에는 작은 광장이 있었다. 광장 한가운데에는 돌로 쌓은 높은 기둥이 서 있었고, 그 꼭대기에 커다란 시계가 달려 있었다."], ["p", "시계는 12시에서 멈춰 있었다."], ["p", "긴바늘과 짧은바늘이 정확히 겹쳐 하늘을 가리키고 있었다. 초침은 없었다."], ["p", "\"이 마을에는 시간이 흐르지 않아요.\""], ["p", "리아가 말했다."], ["p", "\"왜요?\""], ["p", "\"시간이 이곳을 지나가지 않기로 했거든요.\""], ["p", "리아는 시계를 올려다보았다."], ["p", "\"아주 오래전에, 이 마을에 슬픈 일이 일어날 예정이었어요. 정확히 열두 시에. 마을 사람들은 그 일을 막을 수 없다는 걸 알았어요. 그래서 대신 시간을 멈춰 달라고 빌었죠. 열두 시가 오지 않도록.\""], ["p", "\"그게 이뤄진 거예요?\""], ["p", "\"네. 그날 이후로 이 마을에는 열두 시가 오지 않았어요. 슬픈 일도 일어나지 않았고요.\""], ["p", "리아는 잠시 말을 멈췄다."], ["p", "\"대신 다른 일도 하나도 일어나지 않았어요. 아이들은 자라지 않았고, 꽃은 피지도 지지도 않았어요. 오늘은 내일이 되지 않았어요. 다들 같은 하루를, 같은 순간을 끝없이 살고 있어요. 행복하지도 불행하지도 않게.\""], ["p", "이안은 우물가의 할머니를 떠올렸다. 같은 매듭을 끝없이 다시 묶던 손."], ["p", "\"너는요? 너는 다른 사람들이랑 다르잖아. 우리를 보고, 말도 하고.\""], ["p", "\"저는 책을 쓴 사람이니까요. 책을 가졌던 사람은 멈춘 시간 속에서도 깨어 있어요. 그게 책의 값이에요.\""], ["p", "리아가 웃었다. 그런데 그 웃음은 아까보다 훨씬 지쳐 보였다."], ["p", "\"모두가 멈춰 있는 마을에서 혼자 깨어 있는 건 꽤 심심한 일이에요. 그래서 기다렸어요. 책이 다음 사람을 데려오기를.\""], ["p", "리아는 이안을 바라보았다."], ["p", "\"하지만 이제 다시 움직일 거예요.\""], ["n", "제8장"], ["t", "열리지 않는 문"], ["p", "리아는 두 사람을 광장 뒤편으로 데려갔다."], ["p", "광장 뒤쪽은 골짜기의 끝이었다. 깎아지른 절벽이 마을을 감싸고 있었고, 그 절벽에 거대한 돌문이 박혀 있었다."], ["p", "문은 높이가 마을의 어떤 집보다 세 배는 높았다. 두 짝으로 된 문이었고, 이음새가 너무 정교해서 문 사이에 종이 한 장 들어갈 틈도 없었다."], ["p", "문에는 수천 개의 작은 원이 새겨져 있었다."], ["p", "크기도 모양도 같은 원들이 문 전체를 빈틈없이 덮고 있었다. 가까이서 보면 원 하나하나 안에 아주 작은 그림이 있었다. 나무, 물고기, 사람의 눈, 계단, 달. 같은 그림은 하나도 없었다."], ["p", "그리고 문 한가운데에는 일곱 개의 원이 둥글게 모여 있었다. 다른 원들보다 조금 더 크고, 깊게 파여 있었다."], ["p", "\"이게 이 세계의 문이에요.\""], ["p", "리아가 말했다."], ["p", "\"이 문 너머에 다음 장소들이 있어요. 이 문을 열면 길이 이어지고, 길이 이어지면 시간도 다시 흐르기 시작할 거예요.\""], ["p", "리아는 이안을 향해 손을 내밀었다."], ["p", "\"첫 번째 열쇠를 줄래요?\""], ["p", "이안은 망설이다가 주머니에서 열쇠를 꺼내 건넸다. 리아는 열쇠를 받아 들고 문 앞으로 다가갔다."], ["p", "소녀는 첫 번째 열쇠를 문 가운데, 일곱 개의 원 중 맨 위의 원에 가져갔다."], ["p", "열쇠가 원에 닿는 순간, 열쇠는 저절로 원 속으로 빨려 들어가듯 박혔다."], ["p", "그러자 원들이 차례로 빛났다."], ["p", "맨 위의 원에서 시작된 빛이 옆의 원으로, 또 그 옆의 원으로 번져 나갔다. 수천 개의 작은 원들이 하나씩 깨어났다. 나무 그림이 빛나고, 물고기가 빛나고, 달이 빛났다. 빛은 물결처럼 문 전체로 퍼져 나갔다."], ["p", "이안과 유나는 숨을 죽였다."], ["p", "절벽 전체가 웅웅 울렸다. 마을의 나무들이 흔들렸다. 그 순간, 광장 쪽에서 아이들의 웃음소리가 끊겼다. 공이 떨어지는 소리가 들렸다. 같은 자리가 아닌, 조금 다른 자리에."], ["p", "하지만 문은 열리지 않았다."], ["p", "빛은 문 끝까지 번졌다가 천천히 사그라들었다. 일곱 개의 원 중 맨 위의 원만 희미하게 빛을 유지했다. 나머지 여섯 개는 어둡게 비어 있었다."], ["p", "\"왜 안 열리지?\""], ["p", "유나가 물었다."], ["p", "소녀는 고개를 저었다. 실망한 표정은 아니었다. 이미 알고 있었다는 얼굴이었다."], ["p", "\"열쇠는 하나가 아니에요.\""], ["p", "\"몇 개나 필요한데요?\""], ["p", "\"일곱 개.\""], ["p", "\"일곱 개?\""], ["p", "유나가 되물었다. 이안은 문 한가운데의 일곱 개의 원을 바라보았다. 하나만 빛나고, 여섯 개는 비어 있는."], ["p", "\"그럼 나머지 여섯 개는 어디 있어요?\""], ["p", "리아가 대답하기 전에, 이안의 가방에서 책이 떨리기 시작했다."], ["p", "이안은 책을 펼쳤다."], ["p", "페이지 한가득 그림이 그려지고 있었다. 가는 잉크 선이 종이 위를 스스로 기어 다니며 지도를 만들었다. 산, 마을, 물, 숲, 도시, 모래, 그리고 빈 곳."], ["p", "그곳에는 일곱 개의 장소가 그려져 있었다."], ["p", "북쪽 산맥."], ["p", "멈춰 버린 마을."], ["p", "잠든 바다."], ["p", "거울의 숲."], ["p", "뒤집힌 도시."], ["p", "이름 없는 사막."], ["p", "그리고 마지막으로 아무것도 표시되지 않은 장소."], ["p", "일곱 장소는 하나의 고리처럼 이어져 있었다. 북쪽 산맥에서 시작해 마을을 지나, 바다와 숲과 도시와 사막을 거쳐, 마지막 빈 곳으로. 그리고 그 빈 곳에서 다시 북쪽 산맥으로 이어지는 가는 선이 있었다."], ["p", "\"북쪽 산맥에서 첫 번째 열쇠를 찾았으니까.\""], ["p", "유나가 손가락으로 지도를 짚었다."], ["p", "\"두 번째는 여기, 이 마을이야.\""], ["p", "두 사람은 동시에 리아를 바라보았다."], ["p", "리아는 오랫동안 아무 말도 하지 않았다. 그러다 몸을 돌려 광장의 시계를 올려다보았다. 12시에서 멈춘 시계."], ["p", "\"두 번째 열쇠는 저기 있어요.\""], ["p", "\"시계에?\""], ["p", "\"시곗바늘이 열쇠예요. 마을 사람들이 시간을 멈춰 달라고 빌었을 때, 시계는 자기 바늘을 열쇠로 바꿨어요. 아무도 열 수 없도록.\""], ["p", "\"그럼 그걸 빼면….\""], ["p", "\"시간이 다시 흐르겠죠.\""], ["p", "리아는 담담하게 말했다."], ["p", "\"열두 시가 올 거예요. 오래전에 일어나기로 되어 있던 일이, 마침내 일어나겠죠.\""], ["p", "\"그 슬픈 일이 뭔데요?\""], ["p", "이안이 물었다."], ["p", "리아는 이안을 보며 조금 웃었다."], ["p", "\"저도 몰라요. 너무 오래돼서, 이제는 아무도 기억하지 못해요. 사람들은 무서웠던 기억만 남았어요. 무엇이 무서웠는지는 잊어버린 채로.\""], ["p", "광장에 잠시 침묵이 흘렀다."], ["p", "\"그럼 우리가 그걸 빼면 안 되는 거 아니야?\""], ["p", "유나가 말했다."], ["p", "\"모르는 일이 일어날지도 모르잖아. 누군가 다칠 수도 있고.\""], ["p", "\"맞아요. 그럴 수도 있어요.\""], ["p", "리아는 고개를 끄덕였다."], ["p", "\"하지만 이 마을 사람들은 아무도 다치지 않는 대신 아무도 살아 있지 않아요. 저 아이들은 몇백 년 동안 같은 공을 같은 자리에서 던지고 있어요. 저 할머니는 바구니를 끝내지 못해요. 저는 그게 다치는 것보다 나은지 잘 모르겠어요.\""], ["p", "리아는 광장 쪽을 바라보았다."], ["p", "\"아까 문이 빛났을 때, 공이 다른 자리에 떨어졌어요. 봤어요? 몇백 년 만에 처음이었어요.\""], ["p", "이안은 그 소리를 기억했다. 조금 다른 자리에 떨어지던 공."], ["p", "\"정하는 건 제가 아니에요.\""], ["p", "리아가 말했다."], ["p", "\"저는 오래전에 이미 한 번 정했어요. 시간을 멈추자고 빌었던 사람 중 하나가 저였거든요. 그러니까 이번에는 다른 사람이 정해야 해요.\""], ["p", "이안은 유나를 보았다. 유나도 이안을 보았다."], ["p", "\"어떻게 생각해?\""], ["p", "이안이 물었다. 평소의 이안이라면 유나가 정하기를 기다렸을 것이다. 지금까지 늘 그랬던 것처럼."], ["p", "유나는 오래 생각했다. 그리고 천천히 말했다."], ["p", "\"우리 할아버지는 돌아가시기 전에 오래 아팠어. 그때 나는 시간이 멈췄으면 좋겠다고 매일 빌었어. 내일이 안 왔으면 좋겠다고. 근데 지금 생각하면, 시간이 멈췄으면 할아버지랑 마지막으로 바다에 간 날도 없었을 거야. 그날이 내가 제일 좋아하는 날인데.\""], ["p", "유나는 리아를 보았다."], ["p", "\"마을 사람들한테 물어볼 수는 없어요?\""], ["p", "\"멈춰 있는 사람들은 대답할 수 없어요. 시간이 흘러야 대답도 생기니까요.\""], ["p", "이안은 시계를 올려다보았다. 겹쳐진 두 바늘."], ["p", "그리고 처음으로, 남이 정해 주기를 기다리지 않고 말했다."], ["p", "\"빼자.\""], ["s", ""], ["p", "리아는 기둥 옆의 좁은 계단으로 두 사람을 안내했다. 계단은 기둥을 나선형으로 감고 올라갔다. 꼭대기의 작은 발판에 서자, 시계의 둥근 판이 눈앞에 거대하게 펼쳐졌다."], ["p", "이안은 손을 뻗어 겹쳐진 두 바늘을 잡았다."], ["p", "바늘은 차가웠다. 첫 번째 열쇠를 처음 쥐었을 때처럼."], ["p", "이안은 숨을 크게 들이쉬고 바늘을 당겼다."], ["p", "바늘은 생각보다 쉽게 빠졌다. 손안에서 두 바늘이 하나로 녹아 붙더니, 작은 열쇠의 모양이 되었다. 고리 안에 숫자 2가 새겨져 있었다."], ["p", "그리고 시계가 울렸다."], ["p", "댕."], ["p", "깊고 맑은 소리가 골짜기 전체로 퍼져 나갔다."], ["p", "댕."], ["p", "광장의 아이들이 동시에 고개를 들었다."], ["p", "댕."], ["p", "우물가의 할머니가 손을 멈췄다."], ["p", "열두 번의 종소리가 울리는 동안 마을의 모든 사람이 시계를 올려다보았다. 처음으로, 다른 방향을 보는 사람 없이."], ["p", "마지막 종소리가 사라졌다."], ["p", "아무 일도 일어나지 않았다."], ["p", "아니, 모든 일이 일어났다. 바람이 불었다. 몇백 년 만의 바람이었다. 나뭇잎이 흔들리다가 몇 장이 떨어졌다. 떨어진 잎은 노랗게 물들어 있었다. 할머니가 묶던 매듭이 마침내 끝났고, 할머니는 다음 매듭을 묶기 시작했다. 공은 담장을 넘어 굴러갔고, 아이들이 웃으며 그 공을 쫓아갔다. 처음 듣는 웃음소리였다."], ["p", "그리고 광장 끝에서 누군가 울기 시작했다."], ["p", "한 노인이 무릎을 꿇고 앉아 있었다. 그 옆에는 아주 늙은 개 한 마리가 누워 있었다. 개는 눈을 감은 채 움직이지 않았다."], ["p", "노인은 개를 쓰다듬으며 울었다. 그런데 그 울음은 이상하게도 슬프기만 하지는 않았다. 오래 참았던 숨을 마침내 내쉬는 사람의 울음이었다."], ["p", "\"저 일이었구나.\""], ["p", "리아가 작게 말했다."], ["p", "\"열두 시에 일어나기로 되어 있던 일. 저 할아버지의 개가 떠나는 날이었어요. 마을 전체가 그 이별을 견딜 수 없어서 시간을 멈췄던 거예요.\""], ["p", "리아의 눈가가 젖어 있었다."], ["p", "\"몇백 년 동안 저 할아버지는 작별 인사를 하지 못했어요. 이제야 할 수 있게 됐네요.\""], ["p", "마을 사람들이 하나둘 노인 곁으로 모여들었다. 누군가 노인의 어깨에 담요를 덮어 주었다. 아이들이 들꽃을 꺾어 왔다."], ["p", "이안은 손에 쥔 두 번째 열쇠를 내려다보았다. 열쇠는 따뜻했다."], ["s", ""], ["p", "두 번째 열쇠를 꽂자, 돌문의 두 번째 원이 빛났다. 하지만 문은 여전히 열리지 않았다."], ["p", "대신 문의 오른쪽 아래, 절벽과 맞닿은 부분에 좁은 틈이 생겼다. 사람 하나가 겨우 지나갈 만한 틈이었다. 틈 너머로 물 냄새가 실려 왔다."], ["p", "\"다음 길이에요.\""], ["p", "리아가 말했다."], ["p", "\"문은 일곱 개의 열쇠가 다 모여야 활짝 열려요. 그 전까지는 열쇠 하나마다 다음 장소로 가는 길만 조금씩 열리죠.\""], ["p", "그 순간 이안이 펼쳐 든 책의 가장 아래쪽에 글자가 나타났다."], ["p", "'일곱 번째 열쇠는 찾는 것이 아니다.'"], ["p", "'돌아오는 것이다.'"], ["p", "이안은 그 문장을 이해할 수 없었다."], ["p", "\"돌아온다는 게 무슨 뜻이야?\""], ["p", "리아는 고개를 저었다."], ["p", "\"그 문장은 제 글씨가 아니에요. 하지만 당신들이 마지막 장소에 도착하면 알게 될 거예요.\""], ["p", "리아는 이안에게서 책을 잠시 받아 들고 첫 페이지를 펼쳤다. 자신이 오래전에 쓴 문장을 한참 바라보았다. 그리고 책을 돌려주며 말했다."], ["p", "\"이 책을 가진 사람은 길을 따라가기만 하면 돼요. 책이 다음 장소를 알려 주고, 다음 문장을 보여 줄 테니까요. 편하죠.\""], ["p", "\"그런데요?\""], ["p", "리아의 표정에서 이안은 '그런데'를 읽었다."], ["p", "\"그런데 언젠가는 책이 알려 주지 않는 순간이 와요. 그때는 스스로 정해야 해요. 오늘처럼.\""], ["p", "리아는 웃으며 귀 뒤에 꽂은 하얀 꽃을 빼서 유나의 머리에 꽂아 주었다."], ["p", "\"시간이 흐르기 시작했으니, 이 꽃도 이제 시들 거예요. 그 전에 다음 장소에 도착하세요.\""], ["p", "두 사람은 절벽의 틈으로 들어섰다. 이안이 마지막으로 뒤를 돌아보았을 때, 리아는 광장에서 아이들과 함께 공을 쫓아 달려가고 있었다."], ["p", "처음 보는, 열두 살다운 뒷모습이었다."], ["n", "제9장"], ["t", "잠든 바다"], ["p", "틈은 길고 어두운 동굴로 이어졌다."], ["p", "벽은 축축했고, 발밑에서는 물이 찰박거렸다. 손전등 불빛이 벽에 닿을 때마다 바위 속에 박힌 조개껍데기들이 반짝였다. 아주 오래전에는 이곳이 바다 밑이었던 것 같았다."], ["p", "\"아까 그 할아버지 말이야.\""], ["p", "어둠 속에서 유나가 말했다."], ["p", "\"우리가 잘한 걸까?\""], ["p", "이안은 바로 대답하지 못했다. 울던 노인의 등이 떠올랐다. 그리고 그 옆에 모여들던 사람들, 들꽃을 꺾어 오던 아이들."], ["p", "\"모르겠어. 근데 그 할아버지, 마지막엔 웃고 있었어.\""], ["p", "\"봤어?\""], ["p", "\"응. 아이들이 꽃을 가져왔을 때.\""], ["p", "유나는 한동안 조용히 걸었다. 그러다 머리에 꽂힌 하얀 꽃을 살짝 만졌다."], ["p", "\"이 꽃, 벌써 가장자리가 조금 노래졌어.\""], ["p", "\"시간이 흐르니까.\""], ["p", "\"응. 근데 그게 싫지가 않아.\""], ["p", "동굴 끝에서 빛이 보였다. 파랗고 차가운 빛이었다."], ["s", ""], ["p", "동굴을 빠져나오자 눈앞에 끝없는 물이 펼쳐졌다."], ["p", "그곳에는 잠든 바다라고 불리는 거대한 호수가 있었다."], ["p", "호수라고 부르기에는 너무 컸다. 수평선 끝까지 물이었다. 그런데 바다라고 부르기에는 너무 조용했다."], ["p", "바다는 이상하게도 파도가 없었다."], ["p", "해안의 자갈 위로 물이 밀려왔다 밀려가는 소리조차 없었다. 수면은 거울처럼 매끄러웠고, 하늘의 구름이 그대로 비쳤다. 어디까지가 하늘이고 어디부터가 물인지 구별하기 어려웠다."], ["p", "바람이 불어도 물결은 생기지 않았다. 이안의 머리카락이 바람에 날리는데, 물 위로는 주름 하나 지지 않았다."], ["p", "유나가 조약돌 하나를 주워 물에 던졌다."], ["p", "조약돌은 물에 닿는 순간 소리 없이 가라앉았다. 물결도, 파문도 일지 않았다. 마치 물이 조약돌을 조용히 받아 삼킨 것 같았다."], ["p", "\"으스스해.\""], ["p", "유나가 팔을 문질렀다."], ["p", "이안은 물가로 다가가 아래를 내려다보았다. 물은 놀랄 만큼 맑았다. 그리고 그 아래로, 깊고 깊은 곳까지 보였다."], ["p", "물속에는 수많은 건물들이 잠겨 있었다."], ["p", "지붕과 탑과 다리, 아치형 문과 둥근 창문. 하나의 도시가 통째로 호수 바닥에 가라앉아 있었다. 건물들은 무너지지 않고 온전한 모습 그대로였다. 길에는 가로등까지 서 있었다. 물고기는 한 마리도 보이지 않았다."], ["p", "\"관리인 선생님이 보여 준 돌판.\""], ["p", "유나가 숨을 죽이며 말했다."], ["p", "\"두 번째 원. 바다 아래에 가라앉은 도시.\""], ["p", "\"사라진 세계.\""], ["p", "이안은 중얼거렸다."], ["p", "두 사람은 해안을 따라 걸었다. 책을 펼쳐 보았지만, 지도 위의 '잠든 바다'에는 아무 표시도 없었다. 바다 한가운데에 작은 점 하나가 찍혀 있을 뿐이었다."], ["p", "\"저기까지 가야 한다는 거야? 헤엄쳐서?\""], ["p", "\"이 물에 들어가고 싶어?\""], ["p", "\"절대 싫어.\""], ["p", "한참을 걷다가, 이안은 해안가 바위 뒤에서 무언가를 발견했다."], ["p", "낡은 배 한 척이었다."], ["p", "작은 돛배였다. 돛대는 부러져 있었지만, 선체는 멀쩡해 보였다. 뱃머리에는 글자가 새겨져 있었는데, 오래된 외국 글씨여서 읽을 수 없었다. 다만 그 옆에 새겨진 문양은 알아볼 수 있었다."], ["p", "작은 원."], ["p", "\"에드먼드의 배일까?\""], ["p", "\"아니면 에드먼드가 타고 온 배에 실려 있던 작은 보트.\""], ["p", "유나가 뱃전을 두드려 보았다. 나무는 단단했다. 백팔십구 년이 지난 배라고는 믿을 수 없었다. 쓰러진 나무들처럼."], ["p", "배 안에는 노 두 자루와 방수포로 싼 꾸러미 하나가 있었다. 이안은 조심스럽게 방수포를 풀었다."], ["p", "배 안에는 탐험가의 일지가 있었다."], ["p", "두꺼운 가죽 표지의 공책이었다. 표지 한가운데에 금박으로 이름의 첫 글자가 박혀 있었다. E. R."], ["p", "\"에드먼드 로웰.\""], ["p", "이안은 일지를 펼쳤다. 글씨는 외국어였는데, 이상하게도 읽을 수 있었다. 글자를 보는 순간, 뜻이 저절로 머릿속에 떠올랐다. 마치 검은 책이 옆에서 번역해 주는 것처럼."], ["p", "첫 페이지에는 이렇게 적혀 있었다."], ["p", "'나는 이곳에 도착했다. 그리고 내가 평생 찾던 것을 발견했다.'"], ["p", "그 뒤로는 빽빽한 기록이 이어졌다. 북쪽 바다에서 만난 폭풍, 갑자기 나타난 안개, 지도에 없는 해안. 산맥과 바위의 숫자들. 멈춘 마을과 그곳의 소녀. 에드먼드도 그들과 같은 길을 걸어왔던 것이다."], ["p", "몇몇 페이지에는 스케치가 그려져 있었다. 하얀 도시, 거꾸로 매달린 탑, 은색 나무. 그리고 테오도르의 얼굴을 그린 작은 초상화. 그 아래에는 '내 충실한 친구, 그는 이 일지를 읽게 될까'라고 적혀 있었다."], ["p", "이안은 마지막 페이지를 펼쳤다."], ["p", "마지막 페이지에는 다른 문장이 있었다."], ["p", "'하지만 발견하는 것과 이해하는 것은 전혀 다른 일이었다.'"], ["p", "글씨가 떨리고 있었다. 첫 페이지의 힘찬 글씨와는 전혀 달랐다."], ["p", "\"에드먼드는 뭘 발견했는데, 뭘 이해하지 못했던 걸까?\""], ["p", "유나가 물었다."], ["p", "이안은 대답 대신 일지를 덮어 배낭에 넣었다."], ["p", "\"가 보면 알겠지.\""], ["s", ""], ["p", "두 사람은 배에 올라탔다."], ["p", "노를 젓는 것은 생각보다 힘들었다. 둘 다 노를 저어 본 적이 없었다. 처음에는 배가 제자리에서 빙글빙글 돌기만 했다. 몇 번이나 서로 노를 부딪쳤고, 유나는 물을 튀기다가 깜짝 놀라 노를 놓칠 뻔했다. 물방울이 팔에 닿았는데 이상하게 차갑지도 젖지도 않았다."], ["p", "\"왼쪽! 아니, 너 말고 내 왼쪽!\""], ["p", "\"그걸 어떻게 알아!\""], ["p", "결국 두 사람은 박자를 맞추기로 했다. 하나, 둘. 하나, 둘. 배가 마침내 앞으로 나아가기 시작했다."], ["p", "물 위로 미끄러지는 배는 소리를 내지 않았다. 노가 물을 가르는데도 물결이 생기지 않았다. 배가 지나간 자리는 곧바로 다시 거울이 되었다."], ["p", "아래로는 잠긴 도시가 천천히 지나갔다. 광장과 시장, 학교처럼 보이는 건물, 커다란 원형 극장. 어떤 창문 안에는 식탁이 차려져 있었다. 그릇과 컵이 그대로 놓여 있었다. 사람들이 식사를 하다가 잠시 자리를 비운 것 같았다."], ["p", "\"사람들은 다 어디 간 걸까?\""], ["p", "\"어쩌면 아직 저기 있는지도 몰라. 우리가 못 보는 것뿐이고.\""], ["p", "'도시는 사라진 적이 없다. 사람들이 도시를 볼 수 없게 되었을 뿐이다.'"], ["p", "호수의 한가운데로 향하자, 물의 색이 조금씩 짙어졌다. 바닥이 점점 깊어지고 있었다."], ["p", "그때였다."], ["p", "물속에서 거대한 그림자가 나타났다."], ["p", "처음에는 구름 그림자인 줄 알았다. 하지만 하늘에는 구름이 없었다. 그림자는 물 아래 깊은 곳에서, 천천히 떠오르고 있었다."], ["p", "그것은 물고기도 아니었고, 배도 아니었다."], ["p", "너무 컸다. 그림자의 끝이 보이지 않았다. 그리고 그림자의 표면에는 창문과 지붕과 탑의 윤곽이 있었다."], ["p", "마치 도시 전체가 움직이는 것처럼 보였다."], ["p", "이안과 유나는 노를 멈추고 숨을 죽였다. 배 아래로 거대한 도시의 그림자가 미끄러지듯 지나갔다. 마치 잠든 고래가 꿈을 꾸며 몸을 뒤척이듯."], ["p", "그 순간 물속의 건물들이 하나둘씩 빛나기 시작했다."], ["p", "창문마다 불이 켜졌다. 하나, 둘, 열, 백. 가로등이 켜지고, 광장의 분수가 빛났다. 순식간에 호수 바닥 전체가 별이 가득한 밤하늘처럼 반짝였다."], ["p", "\"아름다워.\""], ["p", "유나가 속삭였다. 두려움을 잊은 목소리였다."], ["p", "물속의 빛들은 한 방향을 가리키고 있었다. 활주로의 유도등처럼, 불빛이 차례로 켜지며 호수 한가운데의 한 지점으로 이어졌다."], ["p", "이안은 배 밖으로 몸을 숙여 그곳을 내려다보았다."], ["p", "물속에서 거대한 문을 발견했다."], ["p", "호수의 가장 깊은 곳, 도시 한가운데의 광장 바닥에 둥근 문이 박혀 있었다. 북쪽 산맥의 돌문처럼 수많은 원이 새겨진 문이었다. 그리고 그 문의 한가운데에서, 무언가가 반짝이고 있었다."], ["p", "문에는 세 번째 열쇠가 꽂혀 있었다."], ["p", "\"저걸 어떻게 꺼내?\""], ["p", "유나가 물었다. 문은 아득히 깊은 곳에 있었다. 아파트 몇 층 높이는 될 것 같았다."], ["p", "이안은 책을 펼쳤다. 지도 위의 잠든 바다 한가운데, 작은 점 옆에 글자가 나타났다."], ["p", "'잠든 것은 깨우지 말고, 부르라.'"], ["p", "\"부르라고?\""], ["p", "이안은 생각했다. 첫 번째 열쇠는 기억이 길을 만들었다. 두 번째 열쇠는 선택이 시간을 움직였다."], ["p", "그는 문득 일지의 마지막 페이지를 떠올렸다. 그리고 배낭에서 일지를 꺼내, 표지의 금박 글자를 물 위로 향하게 들었다."], ["p", "\"에드먼드 로웰.\""], ["p", "이안은 물을 향해 그 이름을 불렀다."], ["p", "물속 깊은 곳에서 열쇠가 반짝였다. 그리고 아주 천천히, 떠오르기 시작했다. 물결 하나 일으키지 않고 깊은 곳에서부터 수면을 향해."], ["p", "열쇠가 수면 위로 올라오자 이안이 손을 뻗어 잡았다. 열쇠는 젖어 있지 않았다. 고리 안에 숫자 3이 새겨져 있었다."], ["p", "그런데 열쇠가 빠져나간 자리를 내려다보던 이안은 몸이 굳었다."], ["p", "문 옆에는 누군가의 이름이 새겨져 있었다."], ["p", "물속의 불빛이 그 글자를 환하게 비추고 있었다. 외국 글씨였지만, 이안은 읽을 수 있었다."], ["p", "에드먼드 로웰."], ["p", "그리고 그 아래에 작은 글씨가 하나 더 있었다."], ["p", "'이 문을 처음 연 사람. 그리고 닫지 못한 사람.'"], ["p", "그 순간 물속의 불빛들이 하나씩 꺼지기 시작했다. 거대한 도시의 그림자가 다시 깊은 곳으로 가라앉았다. 잠든 바다는 다시 잠들었다."], ["p", "호수의 서쪽 끝, 아까까지 아무것도 없던 수평선 위에 은빛 숲의 윤곽이 떠올라 있었다."], ["n", "제10장"], ["t", "거울의 숲"], ["p", "세 번째 열쇠를 얻은 뒤, 두 사람은 서쪽의 숲으로 향했다."], ["p", "배를 서쪽 해안에 대기까지 꼬박 반나절이 걸렸다. 적어도 그렇게 느껴졌다. 이곳의 해는 이상하게 움직였다. 한참을 노 저어도 해는 같은 자리에 떠 있다가, 잠깐 한눈을 판 사이 훌쩍 기울어 있곤 했다."], ["p", "두 사람은 배 위에서 관리인이 챙겨 준 비상식량을 꺼내 먹었다. 딱딱한 건빵과 초콜릿 바, 미지근한 물. 이렇게 맛있는 건빵은 처음이었다."], ["p", "\"윤 선생님 걱정하시겠다.\""], ["p", "유나가 초콜릿을 반으로 쪼개 이안에게 건네며 말했다."], ["p", "\"해 지기 전에 연락하기로 했는데.\""], ["p", "\"여기 해는 언제 지는지도 모르겠어.\""], ["p", "\"엄마도 걱정하실 거야.\""], ["p", "이안은 엄마의 얼굴을 떠올렸다. 야간 근무를 마치고 아침에 돌아와, 식탁 위에 차려 둔 밥을 보고 이안의 방문을 살짝 열어 보는 엄마. 이안이 자는 척하면 엄마는 아무 말 없이 문을 닫았다. 이안은 그게 고마우면서도 조금 서운했다. 서로 할 말이 많은데, 늘 서로 피곤해서 그 말을 꺼내지 못했다."], ["p", "\"돌아가면.\""], ["p", "이안이 말했다."], ["p", "\"엄마랑 밥 한번 제대로 먹어야겠다.\""], ["p", "유나가 이안을 쳐다보았다."], ["p", "\"너 오늘 진짜 이상해.\""], ["p", "\"좋은 쪽으로?\""], ["p", "\"응. 좋은 쪽으로.\""], ["s", ""], ["p", "배가 자갈 해안에 닿았다. 두 사람은 배를 물가에 끌어 올려 두고 숲으로 걸어 들어갔다."], ["p", "그 숲의 나무들은 모두 은색이었다."], ["p", "줄기도 가지도 잎도, 하나같이 녹인 은을 부어 만든 것처럼 반짝였다. 껍질에는 나뭇결 대신 매끄러운 물결무늬가 있었다. 손으로 만져 보면 금속처럼 차갑고 단단했는데, 바람이 불면 가지가 부드럽게 휘어졌다."], ["p", "나뭇잎은 거울처럼 빛났고, 가지에는 사람들의 모습이 비쳤다."], ["p", "수천, 수만 장의 잎이 저마다 작은 거울이었다. 두 사람이 걸어가면 잎마다 두 사람의 모습이 비쳤다. 위를 보아도, 옆을 보아도, 사방에 이안과 유나가 있었다."], ["p", "\"어지러워.\""], ["p", "유나가 눈을 가늘게 떴다."], ["p", "\"꼭 거울로 된 방에 들어온 것 같아.\""], ["p", "처음에는 단순한 반사라고 생각했다."], ["p", "하지만 이안은 곧 이상한 점을 발견했다."], ["p", "나뭇잎 속의 자신은 자신과 다른 행동을 하고 있었다."], ["p", "처음에는 착각이라고 생각했다. 잎이 흔들려서 그렇게 보이는 거라고. 그런데 이안이 걸음을 멈추고 가만히 서 있어도, 잎 속의 이안은 조금씩 움직였다. 고개를 기울이고, 눈을 깜빡이고, 손가락을 꼼지락거렸다."], ["p", "이안은 시험 삼아 오른손을 들어 보았다."], ["p", "현실의 이안은 오른손을 들었지만, 나뭇잎 속의 이안은 고개를 돌렸다."], ["p", "그리고 이안을 똑바로 보았다."], ["p", "거울 속의 눈이 거울 밖의 눈을 마주 보았다. 이안의 등줄기로 소름이 쫙 끼쳤다."], ["p", "잎 속의 이안이 입을 움직였다. 소리는 들리지 않았지만, 입 모양은 분명했다."], ["p", "'돌아가.'"], ["p", "이안은 뒤로 물러났다. 발이 나무뿌리에 걸려 넘어질 뻔했다."], ["p", "\"왜 그래?\""], ["p", "\"저 잎. 저 안의 내가… 돌아가래.\""], ["p", "유나가 이안이 가리킨 잎을 보았다. 그 잎 속에는 이제 평범하게 놀란 얼굴의 이안이 비치고 있었다."], ["p", "\"아무것도 없는데?\""], ["p", "\"방금 전에는….\""], ["p", "이안이 말을 잇기 전에, 유나가 숨을 들이켰다."], ["p", "유나도 자신의 모습이 이상하게 움직이는 것을 보았다."], ["p", "바로 옆 나뭇가지의 잎 속에서, 유나가 유나를 보고 있었다. 잎 속의 유나는 겁먹은 얼굴이 아니었다. 오히려 차분하고, 무언가 확신하는 얼굴이었다."], ["p", "나뭇잎 속의 유나는 손가락으로 숲 안쪽을 가리키고 있었다."], ["p", "\"저쪽으로 가라는 건가?\""], ["p", "\"내 쪽은 돌아가라는데.\""], ["p", "\"그럼 하나는 가라고 하고 하나는 돌아가라고 하는 거네.\""], ["p", "유나가 조금 웃었다. 억지로 웃는 웃음이었지만, 덕분에 이안의 어깨에서 힘이 조금 빠졌다."], ["p", "\"어느 쪽 말을 들을 거야?\""], ["p", "이안은 다시 아까의 잎을 바라보았다. 잎 속의 자신은 이제 아무 말도 하지 않았다. 그저 이안을 따라 고개를 갸웃할 뿐이었다."], ["p", "\"돌아가라는 건, 내가 겁나서 하는 말일 거야.\""], ["p", "이안이 말했다."], ["p", "\"저건 내 안에 있는 무서워하는 나 같아. 아까부터 계속 그 생각을 했거든. 그냥 돌아가고 싶다고.\""], ["p", "\"그럼 저쪽은?\""], ["p", "\"저쪽은 네 안에 있는, 궁금해하는 너겠지.\""], ["p", "유나는 숲 안쪽을 바라보았다."], ["p", "그곳에는 아무것도 없었다."], ["p", "은색 나무들이 빽빽하게 서 있을 뿐, 길도, 빛도, 표시도 없었다. 나무 사이의 틈이 너무 좁아서 사람이 지나갈 수 없을 것 같았다."], ["p", "\"가 보자. 길이 없으면 그때 돌아오면 되지.\""], ["p", "하지만 두 사람이 가까이 다가가자 나무들이 양옆으로 갈라졌다."], ["p", "나무들이 움직이는 소리는 쇠붙이가 부딪치는 소리와 바람 소리를 섞어 놓은 것 같았다. 쨍그랑, 쉬이이. 은빛 줄기들이 비켜서며 좁은 길 하나를 열어 주었다. 두 사람이 지나가면 등 뒤에서 나무들이 다시 닫혔다."], ["p", "이제 정말로 돌아갈 수 없었다."], ["p", "길 양옆의 잎마다 두 사람의 모습이 비쳤다. 이제 그 모습들은 대놓고 다르게 움직였다. 어떤 잎 속의 이안은 울고 있었다. 어떤 잎 속의 이안은 웃고 있었다. 화를 내는 이안도, 잠든 이안도, 무언가를 열심히 쓰는 이안도 있었다."], ["p", "어떤 잎 속의 유나는 혼자 서 있었다. 주변에 아무도 없이, 하얀 들판 한가운데에."], ["p", "유나는 그 잎을 오래 바라보다가 고개를 돌렸다."], ["p", "\"저것들이 다 우리야?\""], ["p", "\"우리가 될 수도 있었던 모습들 아닐까.\""], ["p", "길은 생각보다 길지 않았다. 몇십 걸음쯤 걸었을까, 갑자기 사방이 탁 트였다."], ["p", "숲의 중심에는 둥근 공터가 있었다. 그리고 공터 한가운데에 거대한 거울이 서 있었다."], ["p", "이 층 건물만 한 높이였다. 테두리는 은색 나무뿌리들이 엉켜서 만들어져 있었고, 거울 면은 잔잔한 물처럼 맑았다. 하늘의 보랏빛이 거울 위로 일렁였다."], ["p", "두 사람은 거울 앞으로 다가갔다."], ["p", "그런데 거울에는 두 사람의 모습이 비치지 않았다."], ["p", "숲의 모든 잎이 두 사람을 비추었는데, 정작 가장 큰 이 거울만은 아무것도 비추지 않았다. 이안이 손을 흔들어도, 유나가 바로 앞에 서도."], ["p", "대신 오래전의 도시가 나타났다."], ["p", "거울 속에 풍경이 떠올랐다. 하얀 돌로 지은 도시. 이안이 북쪽 산맥의 바위 앞에서 본 그 도시였다. 검은 하늘 아래, 스스로 빛나는 하얀 건물들. 광장에 모여 같은 방향을 바라보는 수많은 사람들."], ["p", "이번에는 이안도 그들이 바라보는 방향을 볼 수 있었다."], ["p", "사람들은 도시 한가운데의 높은 단을 바라보고 있었다."], ["p", "그리고 그 도시 한가운데에는 이안과 똑같이 생긴 사람이 서 있었다."], ["n", "제11장"], ["t", "거울 속의 사람"], ["p", "거울 속의 이안은 천천히 고개를 들었다."], ["p", "높은 단 위에 선 그는 이안과 같은 얼굴, 같은 키, 같은 머리 모양이었다. 하지만 옷은 달랐다. 하얀 도시 사람들과 같은 긴 옷을 입고 있었다. 그리고 얼굴은 같은데 표정이 달랐다. 이안이 한 번도 지어 본 적 없는 표정이었다. 무척 지쳐 있으면서도, 동시에 무척 단단한."], ["p", "광장의 사람들과 도시와 하늘이 흐려졌다. 거울 속에는 이제 그 한 사람만 남았다. 그리고 그는 거울 바로 안쪽까지 걸어와 이안과 마주 섰다."], ["p", "유리 한 장을 사이에 두고, 두 이안이 서로를 보았다."], ["p", "\"너는 누구야?\""], ["p", "이안이 물었다. 목소리가 생각보다 작게 나왔다."], ["p", "거울 속의 사람은 대답했다. 이안과 같은 목소리였다. 하지만 더 낮고 느렸다."], ["p", "\"너는 누구라고 생각하지?\""], ["p", "\"난 이안이야.\""], ["p", "\"그건 네 이름이지.\""], ["p", "이안은 아무 말도 하지 못했다."], ["p", "이름이 아니면 무엇을 말해야 할까. 열여섯 살. 고등학교 1학년. 성적은 중간. 게임을 좋아하고, 책은 안 읽고, 엄마랑은 대화를 잘 안 하고. 그런 것들은 이안을 설명하는 말이었지만, 이안 자신은 아닌 것 같았다."], ["p", "거울 속의 사람은 계속 말했다."], ["p", "\"이름은 사람이 누구인지 알려 주지 않아. 단지 다른 사람과 구별하기 위해 붙인 표시일 뿐이지. 너를 너로 만드는 건 이름이 아니라, 네가 기억하는 것과 네가 선택하는 것들이야.\""], ["p", "\"넌 그걸 어떻게 알아?\""], ["p", "\"나는 너니까. 아니, 정확히는 네가 될지도 모르는 사람이니까.\""], ["p", "유나가 거울 앞으로 다가갔다."], ["p", "거울 속의 사람은 유나를 보자 표정이 조금 부드러워졌다. 아주 잠깐, 그리운 사람을 보는 듯한 눈빛이 스쳐 지나갔다."], ["p", "\"우리가 찾는 열쇠는 어디 있어?\""], ["p", "유나가 물었다. 목소리가 떨리지 않도록 애쓰는 게 느껴졌다."], ["p", "거울 속의 사람은 유나를 바라보았다."], ["p", "\"열쇠를 찾는 이유부터 알아야 해.\""], ["p", "\"이유?\""], ["p", "\"너희는 지금까지 책이 가리키는 곳으로 왔어. 열쇠가 있다니까 찾았고, 문이 있다니까 열었지. 그런데 왜? 일곱 개의 열쇠를 모아서 무엇을 하려는 거지?\""], ["p", "유나는 대답하지 못했다. 이안도 마찬가지였다."], ["p", "처음에는 호기심이었다. 그 다음에는 책에 이끌려서. 그리고 지금은, 돌아갈 길이 없어서. 그 어떤 것도 진짜 이유는 아니었다."], ["p", "\"모르겠어.\""], ["p", "이안이 솔직하게 말했다."], ["p", "\"그냥 여기까지 왔어.\""], ["p", "거울 속의 사람은 고개를 끄덕였다. 비웃는 표정이 아니었다."], ["p", "\"정직하네. 좋아. 대부분은 거짓 이유를 대거든. 세상을 구하려고, 비밀을 밝히려고. 에드먼드도 그랬어.\""], ["p", "\"에드먼드가 여기 왔었어?\""], ["p", "\"이 거울 앞에 선 사람은 모두 자기 자신을 만나. 에드먼드는 거울 속의 자신에게 인류에게 진실을 알려 주고 싶다고 말했지. 그건 반만 진실이었어. 나머지 반은, 그가 누구보다 먼저 발견한 사람이 되고 싶었다는 거야.\""], ["p", "거울 속의 사람은 이안을 다시 보았다."], ["p", "\"모른다는 건 나쁜 답이 아니야. 아직 정하지 않았다는 뜻이니까. 하지만 언젠가는 정해야 해. 이 여행이 끝나기 전에.\""], ["p", "그러자 거울 표면에 글자가 나타났다. 거울 속의 사람의 가슴 높이에, 서리가 낀 것처럼 하얀 글씨로."], ["p", "'기억을 잃은 자만이 진실을 볼 수 있다.'"], ["p", "\"무슨 뜻이야?\""], ["p", "\"열쇠는 거울 안에 있어. 꺼내려면 손을 넣어야 하고, 손을 넣으면 값을 치러야 해.\""], ["p", "\"무슨 값?\""], ["p", "\"기억 하나.\""], ["p", "이안은 숨을 멈췄다."], ["p", "\"어떤 기억인데?\""], ["p", "\"그건 거울이 정해. 그리고 너는 무엇을 잃었는지 알 수 없을 거야. 잃어버린 기억은, 잃어버렸다는 사실까지 함께 가져가니까.\""], ["p", "유나가 이안의 팔을 잡았다."], ["p", "\"하지 마. 다른 방법이 있을 거야.\""], ["p", "\"다른 방법은 없어.\""], ["p", "거울 속의 사람이 조용히 말했다."], ["p", "\"하지만 거절할 수는 있지. 여기서 돌아가도 돼. 숲은 길을 열어 줄 거야. 호수를 건너고, 마을을 지나고, 산을 넘어서 집으로. 그 길은 아직 닫히지 않았어.\""], ["p", "이안은 유나를 보았다. 유나의 손이 이안의 팔을 꽉 붙들고 있었다."], ["p", "돌아갈 수 있다. 집으로. 학원과 게임과 중간쯤의 성적이 있는 곳으로. 엄마가 아침에 방문을 살짝 여는 곳으로."], ["p", "그런데 이안은 그 생각을 하자마자, 멈춘 마을의 노인이 떠올랐다. 몇백 년 동안 작별 인사를 하지 못한 노인. 그리고 마침내 울던, 그러다 웃던 얼굴."], ["p", "그리고 리아의 말."], ["p", "'언젠가는 책이 알려 주지 않는 순간이 와요. 그때는 스스로 정해야 해요.'"], ["p", "\"기억 하나랑 바꿔서 얻는 진실이 뭔지, 그건 알려 줄 수 있어?\""], ["p", "이안이 물었다."], ["p", "거울 속의 사람은 처음으로 웃었다. 이안과 똑같은 웃음이었다."], ["p", "\"그걸 물어보는 걸 보니, 넌 에드먼드보다는 나은 탐험가가 되겠네. 진실은 이거야. 너희가 모으는 열쇠는 문을 여는 게 아니야. 무언가를 다시 깨우는 거야. 그게 좋은 일일지 나쁜 일일지는, 마지막에 열쇠를 쥔 사람이 정해.\""], ["p", "이안은 천천히 고개를 끄덕였다."], ["p", "그리고 유나의 손을 살며시 풀었다."], ["p", "\"괜찮아. 기억 하나잖아. 어차피 나 평소에도 맨날 까먹어.\""], ["p", "\"농담할 때 아니야.\""], ["p", "\"알아.\""], ["p", "이안은 거울에 손을 댔다."], ["p", "그 순간 거울이 물처럼 흔들렸다."], ["p", "차갑지 않았다. 따뜻한 물에 손을 넣는 것 같았다. 손끝이 거울 면 안으로 스르르 들어갔다. 손목까지, 팔꿈치까지."], ["p", "거울 속의 사람이 이안의 손을 맞잡았다. 그리고 그 손바닥 위에 무언가를 쥐여 주었다."], ["p", "이안이 손을 빼냈다."], ["p", "그리고 세 번째 열쇠가 나타났다. 아니, 네 번째. 고리 안에 숫자 4가 새겨진 은빛 열쇠였다. 숲의 나뭇잎처럼 표면에 이안의 얼굴이 비쳤다."], ["p", "하지만 열쇠를 잡는 순간, 이안의 머릿속 어딘가가 조용히 비워졌다."], ["p", "아프지 않았다. 아무 느낌도 없었다. 방 안의 가구 하나가 소리 없이 사라졌는데, 처음부터 그 자리가 비어 있었던 것처럼 느껴지는 것과 비슷했다."], ["p", "이안은 자신의 어린 시절 기억 하나를 떠올리지 못하게 되었다."], ["p", "그는 자신이 무엇을 잊었는지조차 알 수 없었다."], ["p", "\"이안?\""], ["p", "유나가 불렀다."], ["p", "\"괜찮아?\""], ["p", "\"응. 아무렇지도 않아.\""], ["p", "정말로 아무렇지도 않았다. 그게 오히려 이상했다."], ["p", "\"뭘 잊었는지 알겠어?\""], ["p", "이안은 머릿속을 더듬었다. 엄마 얼굴. 기억난다. 집 주소. 기억난다. 초등학교 운동회, 중학교 졸업식, 처음 산 게임기. 다 기억났다."], ["p", "\"모르겠어. 다 있는 것 같아.\""], ["p", "거울 속의 사람은 이미 사라지고 없었다. 거울은 이제 평범하게 숲과 하늘과 두 사람을 비추고 있었다."], ["s", ""], ["p", "공터를 떠나기 전, 유나가 갑자기 걸음을 멈췄다."], ["p", "\"이안.\""], ["p", "\"응?\""], ["p", "\"너 나랑 처음 만난 날 기억나?\""], ["p", "이안은 생각했다. 유나와는 초등학교 때부터 같은 반이었다. 언제부터였더라. 2학년? 3학년? 처음 말을 건 게 누구였더라."], ["p", "머릿속이 하얗게 비어 있었다. 그 자리에 무언가 있었다는 느낌조차 없었다."], ["p", "\"…글쎄. 2학년 때쯤? 그냥 자연스럽게 친해졌던 것 같은데.\""], ["p", "유나는 아무 말도 하지 않았다. 잠시 이안을 바라보다가, 고개를 돌렸다."], ["p", "\"그래. 자연스럽게.\""], ["p", "유나의 목소리는 평소와 같았다. 하지만 이안은 유나가 머리에 꽂은 리아의 하얀 꽃을 한 번 만지는 것을 보았다. 무언가를 꼭 붙잡으려는 사람처럼."], ["p", "이안은 그게 무슨 뜻인지 알 수 없었다. 알 수 없다는 사실이, 처음으로 조금 무서웠다."], ["n", "제12장"], ["t", "뒤집힌 도시"], ["p", "네 번째 열쇠를 얻은 두 사람은 뒤집힌 도시로 향했다."], ["p", "책의 지도는 거울의 숲 너머로 이어지는 길을 보여 주었다. 숲이 끝나는 곳에 커다란 절벽이 있었다. 지도에는 절벽 아래에 도시가 그려져 있었는데, 이상하게도 그림이 위아래가 바뀌어 있었다."], ["p", "숲의 끝에 다다르자 땅이 갑자기 끊겼다."], ["p", "그곳은 절벽 아래에 있었다."], ["p", "두 사람은 절벽 끝에 엎드려 아래를 내려다보았다. 그리고 동시에 숨을 삼켰다."], ["p", "도시는 거꾸로 매달려 있었다."], ["p", "절벽 아래에는 커다란 골짜기가 있었고, 그 골짜기 위로 거대한 바위가 지붕처럼 튀어나와 있었다. 도시는 그 바위의 밑면에 붙어 있었다. 박쥐가 동굴 천장에 매달리듯이."], ["p", "건물들은 하늘을 향해 뒤집혀 있었고, 길은 천장처럼 보이는 바위에 붙어 있었다."], ["p", "뾰족한 지붕들이 아래를 향했다. 굴뚝에서 나오는 연기는 아래로 흘러내렸다. 창문 안의 커튼은 위로 펄럭였다. 다리가 바위 천장과 바위 천장 사이를 아치형으로 이었는데, 그 아치도 거꾸로 휘어 있었다."], ["p", "그리고 도시 한가운데에, 그 탑이 있었다."], ["p", "관리인이 보여 준 사진 속의 탑. 끝이 아래를 향한 채 하늘에 뿌리를 박은 듯한 탑. 이렇게 보니 탑은 거꾸로 선 게 아니었다. 도시 전체가 거꾸로였고, 탑은 도시를 따라 똑바로 서 있었을 뿐이다."], ["p", "\"사진이 여기였구나.\""], ["p", "유나가 중얼거렸다."], ["p", "\"에드먼드랑 테오도르, 그리고 얼굴 없는 사람. 셋이 여기까지 왔었던 거야.\""], ["p", "그런데 사람들은 아무렇지도 않게 그곳에서 생활하고 있었다."], ["p", "거꾸로 된 길 위를 사람들이 걸었다. 머리를 아래로 향한 채, 발바닥을 바위 천장에 붙이고. 시장에서는 상인들이 물건을 팔았고, 아이들은 뛰어다녔다. 누군가 물동이를 들고 가다가 물을 쏟았는데, 물은 아래로 떨어지지 않고 위로, 그러니까 그들의 발밑인 바위 천장 쪽으로 흘렀다."], ["p", "\"저기를 어떻게 가?\""], ["p", "\"저기.\""], ["p", "이안이 절벽 옆을 가리켰다. 바위를 깎아 만든 계단이 아래로 이어져 있었다. 계단은 절벽을 따라 내려가다가, 바위 천장의 가장자리에서 둥글게 휘어 거꾸로 올라붙었다."], ["p", "두 사람은 계단을 내려가기 시작했다."], ["p", "처음에는 평범한 계단이었다. 그러다 계단이 휘어지는 지점에 다다랐다. 이안은 망설이다가 한 걸음을 내디뎠다."], ["p", "순간 세상이 뒤집혔다."], ["p", "정확히는 이안의 몸이 뒤집혔다. 머리가 빙 돌았다. 배 속이 붕 떴다. 그리고 정신을 차렸을 때, 이안은 평범하게 계단 위에 서 있었다. 다만 하늘이 발밑에 있었고, 절벽 위의 숲이 머리 위에 거꾸로 매달려 있었다."], ["p", "\"으악!\""], ["p", "뒤따르던 유나가 비명을 지르며 이안의 등에 부딪혔다. 두 사람은 계단에 털썩 주저앉았다. 한참 동안 둘 다 일어나지 못했다."], ["p", "\"나 토할 것 같아.\""], ["p", "\"나도.\""], ["p", "\"근데 신기해.\""], ["p", "\"응. 진짜 신기해.\""], ["p", "두 사람은 서로를 보며 웃음을 터뜨렸다. 숲을 떠난 뒤 처음 웃는 웃음이었다."], ["s", ""], ["p", "뒤집힌 도시의 거리는 활기찼다. 사람들은 두 사람을 신기한 눈으로 쳐다보았지만, 멈춘 마을처럼 무시하지는 않았다. 몇몇 아이들은 이안의 배낭을 따라오며 키득거렸다."], ["p", "\"저 사람들 머리가 거꾸로 붙어 있어!\""], ["p", "\"우리 입장에선 너희가 거꾸로야!\""], ["p", "유나가 받아치자 아이들이 꺄르르 웃으며 도망갔다."], ["p", "도시 중앙에는 거대한 시계탑이 있었다. 그 거꾸로 선 탑의 정체였다. 탑의 한 면에 커다란 시계판이 박혀 있었다."], ["p", "시계탑의 숫자는 이상했다."], ["p", "12, 11, 10, 9."], ["p", "숫자가 거꾸로 돌아가고 있었다. 12에서 시작해 11, 10, 9로 이어지다가 3, 2, 1."], ["p", "그리고 1 다음에는 다시 12가 아니라 0이 있었다."], ["p", "0의 자리만 다른 숫자들과 달랐다. 숫자가 새겨진 것이 아니라, 둥글게 파인 홈이었다. 그 안은 텅 비어 있었다."], ["p", "시계바늘은 천천히, 거꾸로 돌고 있었다."], ["p", "\"이 도시는 시간이 거꾸로 흐르는 걸까?\""], ["p", "\"그건 아닐세.\""], ["p", "뒤에서 목소리가 들렸다."], ["p", "두 사람이 돌아보자, 키가 크고 마른 노인 하나가 서 있었다. 거꾸로 된 도시의 사람답게, 그의 긴 수염은 위로 뻗쳐 있었다. 검은 외투에는 주머니가 수십 개나 달려 있었고, 주머니마다 두루마리가 꽂혀 있었다. 손에는 깃펜을 들고 있었다."], ["p", "\"시간은 어느 쪽으로든 똑같이 흐르지. 다만 이 도시는 끝에서부터 세는 것을 좋아할 뿐이야. 몇 시냐고 묻지 않고, 얼마나 남았냐고 묻는 거지.\""], ["p", "\"누구세요?\""], ["p", "\"오르반. 이 도시의 기록관이다. 이 도시에서 일어나는 모든 일을 적는 사람이지.\""], ["p", "도시의 기록관은 두 사람을 기다리고 있었다. 정확히는, 기다리고 있었다고 말했다."], ["p", "\"네가 올 줄 알았다. 그 책의 다음 주인.\""], ["p", "그는 이안의 책을 보자마자 말했다."], ["p", "\"네 번째 열쇠까지 왔군. 그리고 마지막 열쇠는 이미 너희 곁에 있구나.\""], ["p", "이안은 자신의 가방을 확인했다. 산맥에서, 마을에서, 바다에서, 숲에서 얻은 열쇠들."], ["p", "네 개의 열쇠밖에 없었다."], ["p", "\"여기 네 개뿐인데요.\""], ["p", "\"다섯 번째는 저 시계에 있고, 그건 내가 줄 수 있지. 내가 말한 건 마지막 열쇠다.\""], ["p", "기록관은 깃펜으로 이안의 발밑을 가리켰다."], ["p", "이안은 아래를, 아니 이 도시에서는 위를 내려다보았다. 바위 천장 위에 이안의 그림자가 드리워져 있었다."], ["p", "그림자 속에는 작은 열쇠 하나가 비치고 있었다."], ["p", "그림자 이안의 손에, 작은 열쇠가 쥐여 있었다. 열쇠의 윤곽이 그림자 속에서 희미하게 빛났다."], ["p", "하지만 현실의 이안에게는 아무것도 없었다. 이안이 손을 펼쳐 보아도 손바닥은 비어 있었다. 그런데 그림자의 손은 여전히 무언가를 쥐고 있었다."], ["p", "\"그건 그림자 열쇠야.\""], ["p", "기록관이 말했다."], ["p", "\"그 열쇠는 네가 세상에 보여 주지 않은 모습에 존재한다.\""], ["p", "\"보여 주지 않은 모습이요?\""], ["p", "\"누구에게나 그런 게 있지. 하고 싶었지만 하지 않은 말, 가고 싶었지만 가지 않은 길. 그런 것들은 사라지지 않고 그림자 속에 쌓인단다.\""], ["p", "이안은 그림자를 향해 손을 뻗었다. 손끝이 바위에 닿았을 뿐, 열쇠는 잡히지 않았다."], ["p", "\"지금은 잡을 수 없다. 그림자 열쇠는 네가 스스로 무언가를 선택하는 순간에만 손에 잡히지. 책이 시키는 것도, 다른 사람이 정해 주는 것도 아닌, 온전히 네 선택일 때.\""], ["p", "\"그게 언젠데요?\""], ["p", "\"그건 내가 기록할 수 없는 일이다. 아직 일어나지 않았으니까.\""], ["p", "오르반은 웃으며 시계탑을 올려다보았다."], ["p", "\"자, 다섯 번째 열쇠를 꺼내러 가 볼까.\""], ["s", ""], ["p", "시계탑 안은 거대한 톱니바퀴들로 가득 차 있었다. 크고 작은 톱니가 서로 맞물려 천천히 돌았다. 철컥, 철컥, 철컥. 일정한 소리가 탑 전체를 울렸다."], ["p", "나선 계단을 따라 꼭대기에 오르자, 시계판 뒤편이 나왔다. 숫자마다 뒤에서 빛이 새어 들어왔다. 12의 자리에는 작은 문이 있었다."], ["p", "오르반이 그 문을 열었다. 안쪽에 열쇠 하나가 걸려 있었다. 고리 안에 숫자 5가 새겨져 있었다."], ["p", "\"이 도시는 오래전에 이 열쇠를 맡았다. 언젠가 책을 가진 아이가 오면 건네주라고. 맡긴 사람의 이름은 기록하지 말라고 했지. 그래서 나도 몰라.\""], ["p", "\"그 사람이 사진 속의 세 번째 사람일까요?\""], ["p", "유나가 휴대전화 속 사진을 보여 주었다. 얼굴이 긁혀 나간 사람."], ["p", "오르반은 사진을 오래 들여다보았다. 그의 표정이 조금 어두워졌다."], ["p", "\"이 셋은 기억한다. 아주 오래전에 이 도시에 왔었지. 탐험가와 조수, 그리고 한 사람 더. 그런데 그 한 사람에 대해서만은 내 기록이 비어 있다. 분명히 적었는데, 나중에 펼쳐 보니 그 부분만 하얗게 지워져 있었어.\""], ["p", "\"누가 지웠는데요?\""], ["p", "\"기록을 지울 수 있는 존재는 하나뿐이지.\""], ["p", "오르반은 대답하지 않고 열쇠를 이안에게 건넸다."], ["p", "그리고 시계판의 0, 텅 빈 홈을 가리켰다."], ["p", "\"저 자리는 아직 비어 있다. 이 도시는 1 다음에 0이 온다고 믿지. 끝 다음에, 시작이 오기 전의 숫자. 마지막 열쇠는 아마 저 숫자를 닮았을 거다.\""], ["p", "이안은 다섯 번째 열쇠를 다른 열쇠들과 함께 꼭 쥐었다. 그리고 바위 천장 위, 아니 아래에 드리워진 자신의 그림자를 다시 한 번 보았다."], ["p", "그림자의 손은 여전히 열쇠를 쥐고 있었다. 그리고 아주 잠깐, 그림자가 이안을 향해 고개를 끄덕인 것 같았다."], ["n", "제13장"], ["t", "이름 없는 사막"], ["p", "도시를 떠난 두 사람은 끝없는 사막에 도착했다."], ["p", "뒤집힌 도시의 반대편 끝에서 계단을 오르자, 세상은 다시 똑바로 돌아왔다. 그리고 눈앞에 하얀 땅이 펼쳐졌다."], ["p", "그 사막에는 모래가 없었다."], ["p", "대신 하얀 돌가루가 땅을 덮고 있었다. 밀가루처럼 고운 가루였다. 발을 디디면 뽀드득 소리가 나며 발자국이 찍혔다가, 바람이 한 번 불면 흔적도 없이 사라졌다. 하늘은 낮게 내려앉은 회색이었다. 해가 어디 있는지 알 수 없었다."], ["p", "사막에는 수많은 비석이 세워져 있었다."], ["p", "허리 높이의 하얀 비석들이 끝없이 늘어서 있었다. 줄을 맞춘 것도 아니고, 흩어진 것도 아니었다. 꼭 오래된 숲처럼, 저마다의 자리에 조용히 서 있었다."], ["p", "비석에는 이름이 적혀 있지 않았다."], ["p", "오직 날짜만 있었다."], ["p", "유나가 가장 가까운 비석의 날짜를 읽었다."], ["p", "\"2041년 3월 9일.\""], ["p", "이안은 옆의 비석을 보았다. 2033년 7월 21일. 그 옆은 2058년 1월 1일."], ["p", "그런데 날짜들은 모두 미래의 날짜였다."], ["p", "\"이게 다 뭐야?\""], ["p", "\"아직 일어나지 않은 일들.\""], ["p", "이안은 그렇게 말하고 나서, 자신이 왜 그렇게 확신하는지 알 수 없었다. 하지만 틀린 것 같지 않았다."], ["p", "책의 지도에서 '이름 없는 사막'은 텅 비어 있었다. 열쇠가 있는 자리도, 길도 표시되지 않았다."], ["p", "두 사람은 비석 사이를 오래 걸었다. 걸을수록 날짜들은 가까워졌다. 2030년, 2028년, 2027년."], ["p", "그리고 어느 순간, 2026년이 나타났다."], ["p", "이안은 그 비석 앞에서 멈췄다. 왜 멈췄는지는 몰랐다. 손이 저절로 그쪽으로 향했다."], ["p", "이안은 비석 하나를 만졌다."], ["p", "그 순간 비석에 이름이 나타났다. 하얀 돌 위로 검은 글씨가 천천히 번져 올랐다."], ["p", "유나의 이름이었다."], ["p", "그리고 그 아래에는 아직 일어나지 않은 사건이 적혀 있었다."], ["p", "'마지막 문을 열지 못한 사람.'"], ["p", "맨 아래에 날짜가 있었다. 2026년 11월 25일."], ["p", "이안은 숨이 멎을 것 같았다. 그 날짜를 어디서 보았는지 기억났다. 관리인의 서류 맨 앞장에 옮겨 적혀 있던, 에드먼드의 일지 마지막 페이지의 날짜."], ["p", "유나는 얼굴이 굳어졌다."], ["p", "\"이건 뭐야?\""], ["p", "이안은 대답하지 못했다."], ["p", "유나는 비석을 똑바로 바라보았다. 그리고 천천히 손을 뻗어 자기 이름을 만졌다."], ["p", "비석이 갈라졌다. 소리 없이, 한가운데가 세로로 쪼개졌다. 그 틈 사이에서 무언가가 떨어졌다."], ["p", "열쇠였다. 고리 안에 숫자 6이 새겨진, 돌가루처럼 하얀 열쇠."], ["p", "유나는 열쇠를 주웠다. 손이 떨리고 있었다."], ["p", "\"여섯 번째 열쇠는 내 이름에서 나왔네.\""], ["p", "유나가 작게 웃었다. 하지만 눈은 웃고 있지 않았다."], ["p", "\"유나, 저건 그냥….\""], ["p", "\"괜찮아.\""], ["p", "유나는 열쇠를 꼭 쥐었다."], ["p", "\"마지막 문을 열지 못한다는 거지, 죽는다는 건 아니잖아. 그리고 아직 안 일어난 일이야. 비석에 적혀 있다고 꼭 그렇게 되는 건 아닐 거야. 그치?\""], ["p", "이안은 그렇다고 말하고 싶었다. 하지만 지금까지 책에 나타난 문장들은 하나도 틀린 적이 없었다."], ["p", "그때 사막 끝에서 한 사람이 걸어왔다."], ["p", "하얀 지평선 위에 작은 검은 점이 나타났다. 점은 점점 커지며 사람의 모습이 되었다. 돌가루 위로 발자국을 남기며, 천천히."], ["p", "그는 오래된 탐험가의 옷을 입고 있었다."], ["p", "두꺼운 모직 외투, 가죽 장화, 목에 건 놋쇠 망원경. 바람에 날리는 긴 머리와 짙은 수염. 날카로우면서도 어딘가 슬퍼 보이는 눈."], ["p", "이안은 그 얼굴을 알았다. 사진에서, 일지의 스케치에서 본 얼굴이었다."], ["p", "남자는 두 사람 앞에 멈춰 섰다. 그리고 모자를 벗어 정중하게 인사했다."], ["p", "\"에드먼드 로웰입니다.\""], ["p", "그가 말했다."], ["p", "두 사람은 놀라서 뒤로 물러났다."], ["p", "에드먼드는 웃었다. 오래 굳어 있던 얼굴 근육이 처음으로 움직이는 것 같은 웃음이었다."], ["p", "\"너희가 오기를 오래 기다렸지.\""], ["n", "제14장"], ["t", "189년 전의 탐험가"], ["p", "에드먼드는 두 사람을 큰 바위 그늘로 데려갔다. 바위 아래에는 작은 천막과 꺼진 모닥불 자리가 있었다. 오래 머문 사람의 자리였다."], ["p", "에드먼드는 자신이 189년 동안 이곳에 있었다고 말했다."], ["p", "하지만 그는 늙지 않았다. 사진 속 얼굴 그대로였다. 주름 하나 늘지 않았다."], ["p", "\"이 사막에서는 시간이 흐르지도, 멈추지도 않는다. 그저 기다릴 뿐이지. 여기 있는 비석들처럼.\""], ["p", "그는 이안이 가진 책을 보았다. 표지의 원을 보는 그의 눈빛이 흔들렸다."], ["p", "\"그 책을 어디서 발견했지?\""], ["p", "\"오래된 책방에서요.\""], ["p", "\"간판에 아무것도 적혀 있지 않은?\""], ["p", "\"네.\""], ["p", "에드먼드는 고개를 끄덕였다."], ["p", "\"그렇다면 책방 주인은 아직도 그곳에 있겠군.\""], ["p", "\"그분을 아세요?\""], ["p", "\"그는 내가 마지막으로 만난 사람이니까.\""], ["p", "에드먼드의 목소리가 낮아졌다."], ["p", "\"테오도르. 내 조수이자 친구였다. 마지막 항해 전날 밤, 나는 그에게 편지를 남겼어. 나를 찾지 말라고. 그런데 그 고집쟁이는 결국 나를 찾아 이 세계로 들어왔지. 그리고 길을 잃었다.\""], ["p", "\"그럼 책방은….\""], ["p", "\"이 세계와 너희 세계 사이의 틈이다. 테오도르는 나를 찾지 못하고 그 틈에 갇혔어. 대신 그는 그곳에서 책을 지키기로 했지. 언젠가 책을 맡길 다음 사람이 올 때까지. 그 사람이 나를 찾아올 수 있도록.\""], ["p", "이안은 책방 노인의 맑은 눈을 떠올렸다. 그 눈이 기다리던 것은 이안이 아니라, 이안이 데려올 소식이었던 것이다."], ["p", "에드먼드는 자신이 발견한 세계에 대해 설명하기 시작했다."], ["p", "이 세계에는 일곱 개의 장소가 있었다."], ["p", "각 장소는 서로 연결되어 있었고, 일곱 개의 열쇠는 그 연결을 열기 위해 만들어졌다."], ["p", "하지만 처음부터 그런 목적은 아니었다."], ["p", "\"원래 열쇠들은 하나의 거대한 장치를 잠그기 위한 것이었다.\""], ["p", "\"장치요?\""], ["p", "\"세계를 기록하는 장치. 이 사막 아래에 있는 오래된 문명이 만든 것이지. 그 장치는 세상에서 일어나는 모든 일을 기록했어. 그리고 너무 많이 기록하다가, 결국 아직 일어나지 않은 일까지 적기 시작했다. 여기 이 비석들처럼.\""], ["p", "에드먼드는 쓸쓸하게 비석들을 둘러보았다."], ["p", "\"그 문명의 사람들은 두려워졌지. 기록된 미래가 바뀌지 않을까 봐. 그래서 장치를 일곱 조각으로 잠그고, 열쇠를 일곱 장소에 흩어 놓았다.\""], ["p", "\"그럼 왜 열쇠를 모으는 거죠?\""], ["p", "유나가 물었다. 손에 쥔 여섯 번째 열쇠를 내려다보면서."], ["p", "\"잠근 걸 다시 여는 거잖아요.\""], ["p", "에드먼드는 대답했다."], ["p", "\"누군가가 그 장치를 다시 작동시키려고 하기 때문이지.\""], ["p", "\"누가요?\""], ["p", "\"처음엔 나였다.\""], ["p", "에드먼드는 고개를 숙였다."], ["p", "\"189년 전, 나는 열쇠를 모았다. 모든 것을 기록하고, 모든 비밀을 밝히고 싶었어. 그런데 일곱 번째 열쇠를 끝내 찾지 못했지. 여섯 개만으로 장치를 억지로 움직였다. 그러자 세계가 흔들렸다. 잠든 바다의 도시가 가라앉았고, 마을의 시간이 비틀렸지. 나는 장치를 멈추기 위해 이곳에 남았다.\""], ["p", "\"그럼 지금은 누가….\""], ["p", "\"장치 자신이다. 내가 한 번 깨운 뒤로, 장치는 조금씩 스스로 깨어나고 있다. 그리고 너희가 열쇠를 모을수록 더 빨리 깨어나지.\""], ["p", "그때 사막 전체가 흔들렸다."], ["p", "돌가루가 물결처럼 일렁였다. 비석들이 덜덜 떨렸다. 멀리서 땅이 갈라지는 소리가 들렸다."], ["p", "멀리서 거대한 검은 구조물이 솟아오르고 있었다."], ["p", "하얀 지평선 너머로 검은 첨탑이 하나, 둘, 셋, 땅을 뚫고 올라왔다. 첨탑들은 원을 그리며 늘어서 있었다. 그 한가운데에서 희미한 빛이 하늘로 뻗어 올라갔다."], ["p", "에드먼드는 그쪽을 바라보았다."], ["p", "\"벌써 시작됐군.\""], ["n", "제15장"], ["t", "사라진 문명"], ["p", "에드먼드는 두 사람을 사막 아래의 지하 도시로 안내했다."], ["p", "천막 뒤의 큰 바위에 좁은 입구가 숨겨져 있었다. 돌계단이 끝없이 아래로 이어졌다. 에드먼드가 든 등불이 벽을 비추었다. 벽에는 원이 새겨져 있었다. 계단 하나에 원 하나."], ["p", "계단의 끝에서 갑자기 공간이 넓어졌다."], ["p", "그곳에는 아주 오래전 문명의 흔적이 남아 있었다."], ["p", "동굴이라기에는 너무 거대했다. 천장이 보이지 않았다. 그 아래로 도시 하나가 통째로 펼쳐져 있었다. 하얀 돌로 지은 건물, 하얀 다리, 하얀 광장."], ["p", "이안은 그 도시를 알아보았다. 북쪽 산맥의 바위 앞에서, 거울의 숲에서 본 하얀 도시. 다만 지금은 불이 꺼져 있었고, 사람이 아무도 없었다."], ["p", "건물은 지금까지 발견된 어떤 유적보다 거대했다. 기둥 하나가 아파트 한 동만 했다."], ["p", "거리에는 사람 모양의 조각상이 늘어서 있었다. 수백, 수천 개였다. 모두 한 방향을 향해 서 있었다. 이안이 환상 속에서 본, 무언가를 기다리던 사람들의 자세 그대로였다."], ["p", "\"사람들이 돌이 된 거예요?\""], ["p", "\"아니. 이 문명 사람들이 스스로 남긴 거다. 자신들이 여기 있었다는 기록으로.\""], ["p", "하지만 조각상들의 얼굴은 모두 똑같았다."], ["p", "눈도 코도 입도, 수천 개의 얼굴이 하나같이 같았다. 마치 한 사람의 얼굴을 수천 번 복사해 놓은 것처럼."], ["p", "유나는 조각상 하나를 살펴보았다."], ["p", "그 조각상의 가슴에는 작은 원이 새겨져 있었다."], ["p", "검은 책의 표지와 똑같은 문양이었다."], ["p", "\"모든 조각상에 다 있어.\""], ["p", "유나가 주위를 둘러보며 말했다."], ["p", "에드먼드는 설명했다."], ["p", "\"이 문명은 세상의 모든 것을 기록했어. 그리고 기록하는 사람은 자기 얼굴을 지웠다. 기록자는 기록 속에 자기를 남기면 안 된다고 믿었거든. 그래서 모두 같은 얼굴, 아무도 아닌 얼굴이 된 거지.\""], ["p", "\"역사도요?\""], ["p", "\"역사뿐만이 아니야. 아직 일어나지 않은 일까지.\""], ["p", "그는 지하 도시의 가장 깊은 곳으로 향했다."], ["p", "광장을 지나고 긴 다리를 건너자, 높은 벽 하나가 나타났다. 벽 한 면 전체가 그림이었다."], ["p", "그곳에는 거대한 벽화가 있었다."], ["p", "벽화에는 세 개의 세계가 그려져 있었다. 관리인의 돌판처럼 세 개의 원이 겹쳐 있었다."], ["p", "첫 번째 세계는 우리가 아는 세계. 산과 도시, 바다와 사람들."], ["p", "두 번째 세계는 사라진 세계. 물에 잠긴 도시, 멈춘 마을, 거꾸로 된 탑. 이안과 유나가 지나온 곳들이었다."], ["p", "세 번째 세계는 아직 완성되지 않은 세계. 몇 개의 선만 그어져 있었다. 화가가 그리다 만 것처럼."], ["p", "그런데 벽화의 아래쪽에는 이상한 그림이 하나 더 있었다."], ["p", "세 세계를 바라보고 있는 한 사람."], ["p", "그 사람은 손에 펜을 들고 있었다. 그리고 발밑에는 검은 책이 놓여 있었다."], ["p", "그 사람의 얼굴은 지워져 있었다."], ["p", "사진 속 세 번째 탐험가처럼, 날카로운 것으로 긁어 낸 하얀 자국만 남아 있었다."], ["p", "이안은 그 하얀 자국을 오래 바라보았다. 이상하게도, 그 지워진 얼굴이 낯설지 않았다."], ["n", "제16장"], ["t", "책의 저자"], ["p", "벽화 앞에서 이안의 가방이 다시 떨렸다."], ["p", "이안은 검은 책을 펼쳤다."], ["p", "지금까지 비어 있던 페이지들이 하나씩 채워지고 있었다. 지도가 그려진 페이지 뒤로, 수십 장의 빈 종이가 있었다. 그 위로 글자가 번져 올랐다. 빠르게, 쉬지 않고, 마치 보이지 않는 손이 받아 적듯이."], ["p", "그곳에는 이안과 유나가 겪은 사건들이 적혀 있었다."], ["p", "비 오는 골목의 책방. 유나가 보낸 지도 사진. 도서관 지하의 돌판. 움직이는 별과 산 위의 불빛."], ["p", "북쪽 산맥에서 발견한 열쇠."], ["p", "시간이 멈춘 마을. 리아의 하얀 꽃. 열두 번의 종소리와 울던 노인."], ["p", "잠든 바다. 물속의 불빛."], ["p", "거울의 숲. 거울 속의 또 다른 이안."], ["p", "뒤집힌 도시. 오르반과 그림자 열쇠."], ["p", "이름 없는 사막. 유나의 비석."], ["p", "그리고 에드먼드와 만난 순간까지."], ["p", "유나는 이안의 어깨 너머로 책을 읽었다. 그리고 '거울의 숲' 부분에서 손가락을 멈췄다. 그곳에는 이안이 잊어버린 기억에 대해서는 한 줄도 적혀 있지 않았다. '이안은 기억 하나를 잃었다.' 그것뿐이었다."], ["p", "유나는 아무 말도 하지 않았다."], ["p", "이안은 책의 마지막 페이지를 넘겼다."], ["p", "맨 뒤의 속표지였다. 처음 책을 받았을 때는 아무것도 없던 자리였다."], ["p", "그곳에는 저자의 이름이 적혀 있었다."], ["p", "이름은 하나가 아니었다. 맨 위에는 아주 오래된 글씨로 '리아'라고 적혀 있었다. 그 아래에는 이안이 읽을 수 없는 낯선 이름들이 몇 개. 그리고 그 아래, 힘 있는 필체로 적힌 이름 하나."], ["p", "에드먼드 로웰."], ["p", "\"이 책을 당신이 쓴 거예요?\""], ["p", "이안이 물었다."], ["p", "에드먼드는 고개를 저었다."], ["p", "\"아니. 나는 그 책의 몇 장을 썼을 뿐이다. 리아가 첫 장을 쓴 것처럼.\""], ["p", "에드먼드는 자기 이름 아래의 빈칸을 손가락으로 가리켰다. 아직 아무것도 적혀 있지 않았다. 하지만 자세히 보니, 종이 위에 아주 희미하게 무언가 비치고 있었다. 물에 비친 글씨처럼, 아직 다 떠오르지 못한 이름."], ["p", "\"그럼 누가 썼어요?\""], ["p", "에드먼드는 이안을 바라보았다."], ["p", "\"네가 썼다.\""], ["p", "이안은 웃음을 터뜨릴 뻔했다."], ["p", "\"저는 독서 감상문도 인터넷에서 베껴요.\""], ["p", "하지만 에드먼드의 표정은 진지했다."], ["p", "\"이 책은 과거와 미래를 구분하지 않아. 기록되는 순간, 모든 시간에 존재하게 되지. 리아가 쓴 첫 문장은 수백 년 전에 쓰였지만, 네가 책을 펼친 그날에도 막 쓰인 것처럼 젖어 있었을 거다.\""], ["p", "이안은 첫 페이지를 처음 펼쳤을 때의 차가운 감각을 떠올렸다."], ["p", "\"책이 보여 준 문장들 중에는 네 글씨도 있다. '첫 번째 장소는 가장 오래된 도시 아래에 있다.' 그 글씨를 잘 봐라.\""], ["p", "이안은 페이지를 넘겨 그 문장을 찾았다. 그리고 오래 들여다보았다."], ["p", "삐뚤빼뚤한 'ㅊ'. 받침을 유난히 작게 쓰는 버릇. 공책 귀퉁이에 낙서할 때 늘 보던 글씨였다."], ["p", "자기 글씨였다."], ["p", "\"그럼 제가 미래에 이 책을 쓰게 된다는 거예요?\""], ["p", "\"그럴지도 모르지. 아니면 이미 썼거나. 이 책 안에서는 그 둘이 같은 말이다.\""], ["p", "\"그럼 저는 그냥 제가 써 놓은 길을 따라온 거예요? 처음부터 다 정해져 있었던 거예요?\""], ["p", "이안의 목소리가 조금 커졌다. 리아의 마을에서 처음으로 직접 정했다고 생각했던 순간, 거울 앞에서 손을 넣기로 했던 순간. 그것들이 모두 이미 적혀 있던 일이었다면."], ["p", "에드먼드는 잠시 대답하지 않았다."], ["p", "\"나도 189년 동안 그 질문을 했다. 내가 한 모든 선택이 이미 적혀 있었던 것인지.\""], ["p", "그 순간 책의 페이지에 새로운 글자가 나타났다. 저자들의 이름 바로 아래, 희미한 빈칸 위에."], ["p", "'기록자는 항상 마지막에 도착한다.'"], ["p", "에드먼드는 그 문장을 읽고 오랫동안 눈을 감았다."], ["p", "\"그렇군. 아직 마지막이 아니라는 뜻이다. 네 이름이 다 적히지 않은 걸 보면, 이 이야기의 끝은 아직 쓰이지 않았어.\""], ["n", "제17장"], ["t", "세계의 중심"], ["p", "에드먼드는 두 사람을 지하 도시의 가장 깊은 장소로 데려갔다."], ["p", "벽화 뒤편에 좁은 통로가 있었다. 통로는 나선을 그리며 아래로 내려갔다. 내려갈수록 공기가 따뜻해졌고, 어디선가 낮은 울림이 들려왔다. 거대한 심장이 뛰는 것 같은 소리였다."], ["p", "그곳에는 거대한 원형 공간이 있었다."], ["p", "둥근 벽에는 수천 개의 원이 새겨져 있었다. 바닥은 매끄러운 검은 돌이었다. 사막 위로 솟아오른 검은 첨탑들의 뿌리가 바로 이곳이었다."], ["p", "천장에는 수많은 빛이 떠 있었다."], ["p", "반딧불처럼 작은 빛, 달처럼 큰 빛. 빛들은 천천히 떠다니며 서로를 스쳐 지나갔다."], ["p", "빛들은 별처럼 보였지만 실제 별은 아니었다."], ["p", "이안은 가장 가까이 떠 있는 빛 하나를 올려다보았다. 빛 안에 무언가가 있었다. 아주 작은 풍경이었다. 유리구슬 속에 갇힌 세상처럼."], ["p", "각각의 빛에는 하나의 세계가 담겨 있었다."], ["p", "어떤 빛에는 바다가 있었고, 어떤 빛에는 산이 있었다. 어떤 빛에는 하늘을 나는 배들이 있었고, 어떤 빛에는 거대한 나무 하나가 세상 전체를 덮고 있었다."], ["p", "또 어떤 빛에는 아무것도 존재하지 않았다. 텅 빈 하얀 빛. 세 번째 원처럼."], ["p", "\"이곳이 세계의 중심이다.\""], ["p", "에드먼드가 말했다."], ["p", "\"우리가 살고 있는 세계도 저 빛 중 하나야?\""], ["p", "유나가 물었다."], ["p", "\"그렇다. 저기.\""], ["p", "에드먼드가 가리킨 빛 속에는 익숙한 풍경이 있었다. 비 오는 도시, 좁은 골목, 중앙도서관의 날개 달린 사자상. 그 빛은 다른 빛들보다 조금 흐릿했다."], ["p", "\"왜 흐려요?\""], ["p", "\"장치가 깨어나고 있어서다. 장치는 모든 빛을 다시 기록하려 하고 있다. 아직 일어나지 않은 일까지 전부. 기록이 끝나면, 그 세계의 미래는 사막의 비석처럼 굳어 버리지. 바꿀 수 없게.\""], ["p", "유나가 숨을 들이켰다. 자기 이름이 새겨진 비석."], ["p", "\"그럼 다른 세계로 갈 수도 있어요?\""], ["p", "유나가 물었다. 목소리가 작았다."], ["p", "에드먼드는 대답하지 않았다."], ["p", "그는 중앙의 장치를 가리켰다."], ["p", "원형 공간 한가운데에 검은 돌로 된 둥근 단이 있었다. 단 위에는 거대한 원반이 떠 있었다. 원반은 아주 천천히 돌고 있었다. 낮은 울림은 그 원반에서 나오고 있었다."], ["p", "장치에는 일곱 개의 홈이 있었다."], ["p", "원반의 가장자리를 따라 일곱 개의 작은 홈이 둥글게 파여 있었다. 북쪽 산맥 마을의 돌문, 잠든 바다의 문과 같은 배치였다."], ["p", "그중 여섯 개에는 열쇠가 들어갈 자리가 있었다. 열쇠 모양 그대로 파인 홈이었다. 홈 옆에는 숫자가 새겨져 있었다. 1, 2, 3, 4, 5, 6."], ["p", "마지막 홈은 비어 있었다."], ["p", "열쇠 모양도 없이 그냥 둥근 구멍이었다. 숫자 대신 텅 빈 원 하나. 뒤집힌 도시의 시계탑에 있던 0의 자리와 똑같았다."], ["p", "그리고 그 아래에는 문장이 새겨져 있었다."], ["p", "'마지막 열쇠는 세계를 만든 자의 것이다.'"], ["p", "\"세계를 만든 자.\""], ["p", "유나가 그 문장을 따라 읽었다."], ["p", "\"누가 세계를 만들었는데요?\""], ["p", "\"나도 그걸 찾지 못했다.\""], ["p", "에드먼드가 말했다."], ["p", "\"그래서 189년 전, 여섯 개만으로 장치를 움직였지. 그리고 모든 것이 뒤틀렸다.\""], ["p", "그는 이안과 유나를 번갈아 보았다."], ["p", "\"이제 너희에게 묻겠다. 열쇠를 꽂을 것이냐, 말 것이냐. 꽂지 않으면 장치는 지금처럼 천천히 깨어나겠지. 몇 년이 걸릴지, 몇십 년이 걸릴지 모른다. 그리고 언젠가는 모든 세계의 미래를 기록해 버릴 거다. 꽂으면, 장치는 지금 당장 완전히 깨어난다. 그 다음 일은 일곱 번째 열쇠를 가진 사람에게 달렸다.\""], ["p", "\"일곱 번째 열쇠가 없으면요?\""], ["p", "\"그럼 나처럼 되겠지.\""], ["n", "제18장"], ["t", "일곱 번째 열쇠"], ["p", "이안과 유나는 일곱 번째 열쇠를 찾아야 했다."], ["p", "여섯 개의 열쇠는 아직 이안의 배낭 속에 있었다. 꽂지 않기로 했다. 적어도 일곱 번째를 찾기 전까지는."], ["p", "하지만 어디에도 열쇠가 보이지 않았다."], ["p", "그들은 지하 도시를 뒤졌고, 오래된 벽화를 살펴보았으며, 책의 모든 페이지를 확인했다."], ["p", "얼굴 없는 조각상들의 손을 하나하나 살폈다. 광장의 분수 안을, 다리 밑을, 텅 빈 집들의 서랍을 뒤졌다. 에드먼드도 함께 찾았다. 그는 189년 동안 이미 찾아본 곳을 다시 찾으며 쓴웃음을 지었다."], ["p", "그러나 열쇠는 나타나지 않았다."], ["p", "몇 시간이 지났는지 알 수 없었다. 두 사람은 지쳐서 광장의 계단에 주저앉았다. 위쪽에서 울림이 점점 커지고 있었다. 장치가 깨어나는 소리였다."], ["p", "\"그 비석.\""], ["p", "유나가 무릎을 끌어안은 채 말했다."], ["p", "\"'마지막 문을 열지 못한 사람.' 혹시 우리가 일곱 번째 열쇠를 못 찾아서 그렇게 되는 걸까?\""], ["p", "\"아니야.\""], ["p", "\"어떻게 알아?\""], ["p", "\"몰라. 그냥 아니라고 하고 싶어.\""], ["p", "유나가 피식 웃었다. 그리고 이안의 어깨에 머리를 기댔다."], ["p", "\"너 진짜 많이 변했다. 처음엔 뭐든 나한테 정하라고 했잖아.\""], ["p", "\"내가?\""], ["p", "\"응. 맨날. 급식 메뉴 뭐 먹을지도.\""], ["p", "그러던 중 이안은 책의 첫 페이지를 다시 펼쳤다."], ["p", "이유는 없었다. 그냥 처음으로 돌아가 보고 싶었다. 모든 것이 시작된 문장을."], ["p", "'이 책을 발견한 사람은 이미 첫 번째 문을 지나왔다.'"], ["p", "리아의 글씨. 그런데 그 아래, 페이지의 맨 아래 귀퉁이에."], ["p", "처음에는 보이지 않았던 작은 글씨가 있었다."], ["p", "너무 작아서 지금까지 한 번도 보지 못했다. 삐뚤빼뚤한 'ㅊ', 받침을 작게 쓰는 버릇."], ["p", "'처음으로 돌아가라.'"], ["p", "이안의 글씨였다."], ["p", "이안은 그 문장을 읽고 깨달았다."], ["p", "그는 배낭에서 여섯 개의 열쇠를 꺼내 계단 위에 늘어놓았다."], ["p", "첫 번째 열쇠는 북쪽 산맥에서 발견했다. 기억이 길을 만든다고 했던 바위 아래에서."], ["p", "두 번째는 멈춘 마을의 시계에서. 시간을 다시 흐르게 하기로 선택했을 때."], ["p", "세 번째는 잠든 바다에서. 에드먼드의 이름을 불렀을 때."], ["p", "네 번째는 거울의 숲에서. 기억 하나를 내주었을 때."], ["p", "다섯 번째는 뒤집힌 도시의 시계탑에서."], ["p", "여섯 번째는 이름 없는 사막, 유나의 비석에서."], ["p", "그런데 일곱 번째는 달랐다."], ["p", "책은 일곱 번째 장소를 '아무것도 표시되지 않은 장소'라고 했다. 그리고 리아의 마을에서 이런 문장을 보여 주었다."], ["p", "'일곱 번째 열쇠는 찾는 것이 아니다. 돌아오는 것이다.'"], ["p", "그 열쇠는 물건이 아니었다."], ["p", "어딘가에 숨겨진 것도 아니었다. 처음부터 이안과 함께 있었다. 뒤집힌 도시에서 오르반이 가리켰던 곳에."], ["p", "'그 열쇠는 네가 세상에 보여 주지 않은 모습에 존재한다.'"], ["p", "이안은 자신의 그림자를 바라보았다."], ["p", "광장의 희미한 빛 아래, 검은 돌바닥 위에 이안의 그림자가 길게 드리워져 있었다."], ["p", "그림자는 빛의 방향과 다르게 움직이고 있었다."], ["p", "빛은 이안의 앞쪽에서 비치고 있었다. 그러니 그림자는 뒤쪽으로 뻗어야 했다. 그런데 이안의 그림자는 옆으로, 장치가 있는 원형 공간 쪽으로 뻗어 있었다. 그리고 그림자의 손에는 여전히 무언가가 쥐여 있었다."], ["p", "유나도 그것을 보았다. 에드먼드도."], ["p", "\"이안.\""], ["p", "에드먼드의 목소리가 굳어 있었다."], ["p", "\"잘 생각해라. 그 열쇠를 잡으면, 더는 되돌릴 수 없다.\""], ["p", "이안은 에드먼드를 보았다. 그리고 유나를 보았다. 유나는 아무 말도 하지 않았다. 대신 아주 작게 고개를 끄덕였다. 네가 정해, 라고 말하듯이."], ["p", "이안은 생각했다."], ["p", "돌아갈 수도 있었다. 거울의 숲에서처럼. 열쇠를 남겨 두고, 길을 되짚어 집으로. 그러면 장치는 천천히 깨어날 것이다. 몇 년 뒤, 몇십 년 뒤. 그때는 다른 누군가가 이 책을 받을 것이다. 혹은 아무도 받지 못하고, 모든 세계의 미래가 사막의 비석처럼 굳어 버리겠지."], ["p", "유나의 이름이 새겨진 비석처럼."], ["p", "책에 적힌 길을 따라온 것이 아니라고, 이안은 증명하고 싶었다. 아니, 증명이 아니라. 그냥 자기가 정하고 싶었다."], ["p", "\"다른 사람한테 넘기지 않을 거예요.\""], ["p", "이안이 말했다."], ["p", "\"제가 끝낼게요. 어떻게 끝날지는 모르지만, 제가 정해서 끝낼래요.\""], ["p", "그는 천천히 손을 뻗었다."], ["p", "그러자 그림자가 손을 맞잡았다."], ["p", "검은 돌바닥에서 그림자의 손이 솟아올랐다. 차갑지도 뜨겁지도 않았다. 자기 손을 맞잡은 것처럼 익숙한 감촉이었다."], ["p", "그리고 작은 목소리가 들렸다. 이안과 똑같은 목소리."], ["p", "\"이제야 찾았구나.\""], ["n", "제19장"], ["t", "그림자의 정체"], ["p", "그림자는 천천히 사람의 모습을 갖추었다."], ["p", "바닥에서 일어선 그림자는 처음에는 검은 윤곽뿐이었다. 그러다 윤곽 안으로 색이 번져 들었다. 머리카락, 얼굴, 옷."], ["p", "그 모습은 이안과 똑같았다."], ["p", "거울 속의 사람과도 달랐다. 거울 속의 이안은 지치고 단단했다. 그림자 이안은 더 어렸다. 지금의 이안과 꼭 같은 나이."], ["p", "하지만 눈빛은 달랐다."], ["p", "이안이 평소에 숨겨 두던 눈빛이었다. 하고 싶은 말을 삼킬 때, 손을 들까 말까 망설이다 내릴 때. 그럴 때 이안의 안쪽에서 반짝이다가 꺼지던 눈빛."], ["p", "\"넌 누구야?\""], ["p", "이안이 물었다."], ["p", "그림자는 대답했다."], ["p", "\"나는 네가 아직 선택하지 않은 모습이다.\""], ["p", "\"그게 무슨 말이야?\""], ["p", "\"너는 지금까지 책에 적힌 길을 따라왔지. 그 전에는 엄마가, 선생님이, 유나가 정해 주는 길을 따라왔고. 한 번도 네가 직접 길을 선택하지 않았어. 그럴 때마다 나는 네 그림자 속에 조금씩 쌓였다.\""], ["p", "그림자는 웃었다."], ["p", "\"그런데 이번 여행에서 너는 세 번 직접 선택했어. 마을의 시계, 거울 속의 손, 그리고 방금. 덕분에 나는 이렇게 일어설 수 있게 됐지.\""], ["p", "그림자는 일곱 번째 열쇠를 건넸다."], ["p", "다른 열쇠들과 달리 투명했다. 유리처럼, 아니 빛을 굳혀 놓은 것처럼. 그 안에 이안의 얼굴이 희미하게 비쳤다."], ["p", "그 열쇠에는 숫자가 적혀 있었다."], ["p", "0."], ["p", "이안은 그것을 바라보았다."], ["p", "\"왜 0이지?\""], ["p", "그림자는 웃었다."], ["p", "\"모든 것이 시작되기 전의 숫자니까. 아직 아무것도 정해지지 않은 숫자. 세계를 만든 자의 열쇠라는 건, 세상을 처음부터 다시 쓸 수 있는 사람의 열쇠라는 뜻이야.\""], ["p", "\"내가 세계를 만들었다는 거야?\""], ["p", "\"아니. 누구나 자기 세계를 만들어. 매일 조금씩. 다만 대부분은 자기가 만들고 있다는 걸 모를 뿐이지.\""], ["p", "그림자는 이안의 가슴을 손가락으로 톡 쳤다. 그리고 웃으며 흐려지기 시작했다. 사라지는 것이 아니었다. 이안의 발밑으로, 원래 있던 자리로 돌아가는 것이었다. 이번에는 빛의 방향을 정확히 따라."], ["p", "그 순간 지하 도시의 모든 빛이 꺼졌다."], ["p", "광장의 등불도, 에드먼드의 등불도, 멀리 원형 공간에서 새어 나오던 빛도. 완전한 어둠. 이안의 손에 쥔 일곱 번째 열쇠만 희미하게 빛났다."], ["p", "그리고 배낭 속의 여섯 개의 열쇠가 저절로 떠올랐다."], ["p", "배낭의 지퍼가 열리며 열쇠들이 하
